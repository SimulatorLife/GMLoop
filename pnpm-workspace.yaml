packages:
  - src/agent-pack
  - src/cli
  - src/lint
  - src/lsp
  - src/format
  - src/parser
  - src/core
  - src/ui
  - src/semantic
  - src/transpiler
  - src/runtime-wrapper
  - src/refactor
  - src/fixture-runner
  - src/mcp
  - src/vscode
  - src/syntax-highlight

catalog:
  "@eslint/compat": "^2"
  "@eslint/js": "^10"
  "@types/node": "^25"
  eslint: "^10"
  eslint-plugin-boundaries: "^6"
  prettier: "^3"
  typescript: "^6"
  ws: "^8"

onlyBuiltDependencies:
  - esbuild
  - fast-folder-size
  - unrs-resolver

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  fast-folder-size: true
  keytar: true
  unrs-resolver: true
