# OpenAI Codex configuration file
# See https://developers.openai.com/codex/config-basic

model_verbosity = "low"
approval_policy = "never"
model_supports_reasoning_summaries = true # Force reasoning
personality = "pragmatic"
sandbox_mode = "workspace-write"
background_terminal_max_timeout = 600000

[features]
shell_snapshot = true           # Speed up repeated commands
unified_exec = true
steer = true
multi_agent = true
fast_mode = false

[analytics]
enabled = false

[feedback]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[projects."/Users/henrykirk/GMLoop"]
trust_level = "trusted"

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 5
max_depth = 1

[model_providers.minimax]
name = "MiniMax"
base_url = "https://api.minimax.io/v1"
env_key = "OPENAI_API_KEY"
wire_api = "chat"

[profiles.simple.features]
multi_agent = false
browser_use = false
apps = false
computer_use = false
image_generation = false
in_app_browser = false
plugins = false