# OpenAI Codex configuration file
# See https://developers.openai.com/codex/config-basic

[mcp_servers.gmloop]
command = "gmloop"
args = ["mcp"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

[mcp_servers.gm-cli]
command = "gmloop"
args = [
  "gm-cli",
  "mcp"
]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.gm-cli.env]
GMLOOP_EXPOSE_INTERNAL_MCP_TOOLS = "true"

[mcp_servers.gmloop.env]
GMLOOP_EXPOSE_INTERNAL_MCP_TOOLS = "true"

[projects."/Users/henrykirk/GMLoop"]
trust_level = "trusted"

[projects."/home/runner/work/GMLoop/GMLoop"]
trust_level = "trusted"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/henrykirk/GMLoop",
  "/Users/henrykirk/Desktop/CannonFatherSource/cannonfather",
  "/Users/henrykirk/.npm",
  "/private/tmp"
]
