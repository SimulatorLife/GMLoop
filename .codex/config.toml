# OpenAI Codex configuration file
# See https://developers.openai.com/codex/config-basic

model_verbosity = "low"
approval_policy = "never"
model_supports_reasoning_summaries = true # Force reasoning summary metadata, not reasoning itself
personality = "pragmatic"
sandbox_mode = "workspace-write"
background_terminal_max_timeout = 600000

[mcp_servers.gmloop]
command = "gmloop"
args = ["mcp"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

[mcp_servers.gm-cli]
command = "npx"
args = [
  "--yes",
  "@gamemaker/gm-cli@latest",
  "resourcetool",
  "mcp",
  "--cache-dir",
  "/Users/henrykirk/GMLoop/tmp/gm-cli-cache",
  "/Users/henrykirk/GMLoop/vendor/3DSpider/3D-ish spider thing 2.yyp"
]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.gm-cli.env]
CI = "true"
GAMEMAKER_CLI_CACHE_DIR = "/Users/henrykirk/GMLoop/tmp/gm-cli-cache"
NPM_CONFIG_CACHE = "/Users/henrykirk/GMLoop/tmp/gm-cli-npm-cache"
npm_config_cache = "/Users/henrykirk/GMLoop/tmp/gm-cli-npm-cache"

[features]
shell_snapshot = true           # Speed up repeated commands
unified_exec = true
steer = true
multi_agent = true
fast_mode = false
image_generation = false

[analytics]
enabled = false

[feedback]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[projects."/Users/henrykirk/GMLoop"]
trust_level = "trusted"

[projects."/home/runner/work/GMLoop/GMLoop"]
trust_level = "trusted"

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 5
max_depth = 1
