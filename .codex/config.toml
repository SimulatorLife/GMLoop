# OpenAI Codex configuration file
# See https://developers.openai.com/codex/config-basic

model_verbosity = "low"
approval_policy = "never"
model_supports_reasoning_summaries = true # Force reasoning summary metadata, not reasoning itself
personality = "pragmatic"
sandbox_mode = "workspace-write"
background_terminal_max_timeout = 600000

[mcp_servers.gmloop]
command = "gmloop"
args = ["mcp"]
enabled = true
default_tools_approval_mode = "approve"
env = { GMLOOP_EXPOSE_INTERNAL_MCP_TOOLS = true }

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

[mcp_servers.gm-cli]
command = "gmloop"
args = [
  "gm-cli",
  "mcp"
]
enabled = true
default_tools_approval_mode = "approve"
env = { GMLOOP_EXPOSE_INTERNAL_MCP_TOOLS = true }

[mcp_servers.lsp]
command = "pnpm"
args = ["exec", "lsp-mcp-server"]
enabled = true
default_tools_approval_mode = "approve"

[features]
shell_snapshot = true           # Speed up repeated commands
unified_exec = true
steer = true
multi_agent = true
fast_mode = false
image_generation = false

[analytics]
enabled = false

[feedback]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[projects."/Users/henrykirk/GMLoop"]
trust_level = "trusted"

[projects."/home/runner/work/GMLoop/GMLoop"]
trust_level = "trusted"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/henrykirk/GMLoop",
  "/Users/henrykirk/Desktop/CannonFatherSource/cannonfather",
  "/Users/henrykirk/.npm",
  "/private/tmp"
]

[agents]
max_threads = 5
max_depth = 1
