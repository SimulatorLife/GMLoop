name: "Cleanup auto-merge artifacts"

on:
  workflow_run:
    workflows: ["Auto-merge PRs"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete temporary report artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete report artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowRunId = context.payload.workflow_run?.id;

            const deleteArtifacts = async (artifacts) => {
              let deleted = 0;
              for (const artifact of artifacts) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`Deleted temporary artifact ${artifact.name} (${artifact.id}).`);
                  deleted += 1;
                } catch (error) {
                  core.warning(`Unable to delete artifact ${artifact.name} (${artifact.id}): ${error.message}`);
                }
              }
              return deleted;
            };

            if (workflowRunId) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner,
                  repo,
                  run_id: workflowRunId,
                  per_page: 100,
                }
              );
              const temporaryArtifacts = artifacts.filter((artifact) =>
                artifact.name.startsWith('report-')
              );
              const deleted = await deleteArtifacts(temporaryArtifacts);
              core.notice(`Deleted ${deleted}/${temporaryArtifacts.length} temporary report artifact(s) from workflow run ${workflowRunId}.`);
              return;
            }

            const cutoff = Date.now() - (24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );
            const staleTemporaryArtifacts = artifacts.filter((artifact) =>
              artifact.name.startsWith('report-') &&
              new Date(artifact.created_at).getTime() <= cutoff
            );
            const deleted = await deleteArtifacts(staleTemporaryArtifacts);
            core.notice(`Deleted ${deleted}/${staleTemporaryArtifacts.length} temporary report artifact(s) older than one day.`);
