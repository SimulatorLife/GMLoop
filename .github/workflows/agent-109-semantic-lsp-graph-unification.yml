name: "Agent 109 - Semantic/LSP/Graph Unification"

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Optional agent override."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    uses: ./.github/workflows/_agent-open-pr-and-ping.yml
    secrets: inherit
    with:
      agent: ${{ inputs.agent }}
      pr_title: "Agent: Semantic/LSP/Graph Unification"
      prompt: >-
        Advance the unification of `@gmloop/semantic`'s project analysis with its two downstream
        consumers, `@gmloop/lsp` and the graph-index/visualization pipeline (`@gmloop/cli` graph
        commands, `@gmloop/mcp` graph tools, `@gmloop/ui` graph explorer), per
        `docs/target-state.md` (semantic analysis, Tier 1/Tier 2 model) and
        `docs/gml-graph-index-plan.md` ("a single graph platform, not separate indexing and
        visualization systems").

        `@gmloop/semantic` is the single source of truth: it owns project indexing, scope/symbol
        metadata, occurrence discovery, the graph index, and visualization-data export, exposed
        through revision-qualified snapshot leases (`SemanticIndexStore.acquireSemanticSnapshot`)
        and the semantic-owned graph query APIs. Per `docs/gml-graph-index-plan.md`'s ownership
        table, `@gmloop/cli`/`@gmloop/mcp`/`@gmloop/ui` must present those facts without duplicating
        graph truth, and `@gmloop/lsp` must stay a thin protocol adapter over the same lease/query
        contract rather than re-deriving analysis of its own. `src/lsp/README.md` already names one
        open gap in this direction: build scheduling and publication currently live in the LSP
        workspace, when the target direction is to move that orchestration behind a long-lived
        semantic project service so the LSP retains only protocol/document/cancellation/progress
        responsibilities.

        Find and fix exactly one concrete gap where this contract is violated or incomplete, such as:
        - LSP-side or CLI/UI graph-visualization code that re-parses, re-scans, or re-derives project
          facts instead of acquiring a semantic snapshot lease or calling the semantic-owned graph
          query APIs;
        - divergent results between what the LSP reports (hover, definition, references, symbols,
          semantic tokens) and what the graph index/visualization exports for the same project state,
          because one side privately maintains its own copy of the data;
        - LSP build-scheduling/publication logic that should delegate to the semantic store/service
          boundary described in `src/lsp/README.md` instead of owning that orchestration itself;
        - a graph-index or graph-visualization code path (`@gmloop/cli` graph commands,
          `@gmloop/mcp` graph tools, or `@gmloop/ui` graph explorer/bundle) that computes or caches
          projection data itself instead of consuming the semantic-owned export;
        - a missing or stale-cache-permitting request path that silently falls back from a required
          Tier 2 (complete project-wide) result to Tier 1 or a stale snapshot instead of triggering or
          awaiting compatible analysis, violating the "no silent fallback" rule in
          `docs/target-state.md` section 4.2.

        Preserve the two non-negotiable performance contracts documented in this repo while doing so:
        - Non-blocking UI/server startup: semantic-index builds must not block the UI event loop or
          delay first paint. Follow the existing pattern in `src/cli/src/commands/graph.ts`
          (`ensureGraphIndexForServe` spawning a child process for index builds) and
          `src/ui/src/graph/graph-visualization-bundle.ts` (eager, fire-and-forget bundle warm) if the
          unification work touches this path; add a regression test if this behavior is currently
          unverified.
        - Immediate syntax highlighting in VSCode: the `@gmloop/syntax-highlight`/`@gmloop/vscode`
          TextMate grammar must keep coloring `.gml` files on open independent of, and never blocked
          by, semantic/LSP analysis; semantic tokens layer in only once the LSP publishes Tier 1 (or
          Tier 2) results. Do not couple immediate lexical highlighting to semantic-index availability.

        Requirements:
        - Choose exactly one cohesive gap; do not attempt a broad rewrite of the semantic, LSP, or
          graph/UI layers in one PR.
        - Respect existing ownership boundaries: `@gmloop/semantic` owns analysis/graph truth and
          query APIs; `@gmloop/lsp` only translates those results into LSP responses; `@gmloop/cli`
          owns human-facing commands/export lifecycle; `@gmloop/mcp` stays a thin CLI-derived catalog
          layer; `@gmloop/ui` owns only interactive presentation, layout, and accessibility.
        - Do not introduce a second indexing/analysis code path, cache, or parallel graph
          representation to work around the shared contract — delegate to the existing lease/query
          surface, or extend it if it is genuinely missing a capability a consumer needs.
        - Add or extend focused tests (mirrored under each touched workspace's `test/`) that prove:
          the fixed consumer now delegates to shared semantic state instead of duplicating it, tier
          fallback behavior is correct, and startup/highlighting stays non-blocking/immediate where
          relevant.
        - Avoid unrelated cleanup, new configuration surface, or speculative abstractions.

        In the commit description, name the specific duplication or correctness gap between semantic
        analysis and its LSP/graph-visualization consumer(s), explain how the fix routes through the
        shared semantic contract instead of duplicating it, and confirm the non-blocking-startup and
        immediate-syntax-highlighting contracts still hold, with tests to prove it.
