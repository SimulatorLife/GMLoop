name: "Auto-merge PRs"
run-name: "Auto-merge PR #${{ inputs.pr_number }} @ ${{ inputs.expected_head }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request number to validate."
        required: true
        type: string
      expected_head:
        description: "Exact PR head SHA expected by the dispatcher."
        required: true
        type: string
      expected_base:
        description: "Exact main SHA admitted by the trusted coordinator."
        required: true
        type: string
      retry:
        description: "Infrastructure retry generation (0 for normal validation)."
        required: false
        default: "0"
        type: string
      reason:
        description: "Human-readable dispatch reason."
        required: false
        default: "queue"
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: automerge-validation-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Resolve exact validation target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      shard_count: ${{ steps.resolve.outputs.shard_count }}
      shard_watchdog_ms: ${{ steps.resolve.outputs.shard_watchdog_ms }}
      command_watchdog_ms: ${{ steps.resolve.outputs.command_watchdog_ms }}
      trusted_ci_changed: ${{ steps.resolve.outputs.trusted_ci_changed }}
      blocked_reason: ${{ steps.resolve.outputs.blocked_reason }}
      should_validate: ${{ steps.resolve.outputs.should_validate }}
      retry: ${{ steps.resolve.outputs.retry }}
    steps:
      - id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          INPUT_RETRY: ${{ inputs.retry }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.INPUT_PR);
            const expectedHead = String(process.env.EXPECTED_HEAD || '');
            const expectedBase = String(process.env.EXPECTED_BASE || '');
            const retry = Number(process.env.INPUT_RETRY || '0');
            const set = (key, value) => core.setOutput(key, String(value));
            set('pr_number', Number.isInteger(number) ? number : 0);
            set('head_sha', expectedHead);
            set('base_sha', expectedBase);
            set('merge_sha', '');
            set('shard_count', 5);
            set('shard_watchdog_ms', 1500000);
            set('command_watchdog_ms', 1200000);
            set('trusted_ci_changed', 'true');
            set('blocked_reason', 'infrastructure');
            set('should_validate', 'false');
            set('retry', Number.isInteger(retry) && retry >= 0 ? retry : 0);

            if (!Number.isInteger(number) || number <= 0
                || !/^[0-9a-f]{40}$/u.test(expectedHead)
                || !/^[0-9a-f]{40}$/u.test(expectedBase)) {
              core.warning('Dispatch did not provide a valid PR number and exact head/base SHAs.');
              return;
            }
            if (context.sha !== expectedBase) {
              core.warning(`Validation worker executed from ${context.sha}, not admitted main ${expectedBase}.`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== expectedHead) {
              set('blocked_reason', 'not-current');
              core.notice(`PR #${number} is closed, draft, moved, or no longer targets main.`);
              return;
            }

            const { data: baseBranch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (baseBranch.commit.sha !== expectedBase) {
              core.notice(`main advanced from admitted ${expectedBase} to ${baseBranch.commit.sha}; coordinator must admit a fresh generation.`);
              return;
            }
            const baseSha = expectedBase;

            const readJson = async (path) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: baseSha });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) throw new Error(`Unable to read ${path}`);
              return JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
            };
            const policy = await readJson('.github/ci/automerge-policy.json');
            if (policy.schemaVersion !== 2) {
              core.warning(`Unsupported auto-merge policy schema ${policy.schemaVersion}.`);
              return;
            }
            const shardCount = Number(policy.testShardCount);
            const shardWatchdogMs = Number(policy.shardWatchdogMs);
            const commandWatchdogMs = Number(policy.commandWatchdogMs);
            if (!Number.isInteger(shardCount) || shardCount < 1
                || !Number.isInteger(shardWatchdogMs) || shardWatchdogMs < 60000
                || !Number.isInteger(commandWatchdogMs) || commandWatchdogMs < 60000) {
              core.warning('Auto-merge policy contains invalid runtime limits.');
              return;
            }
            set('shard_count', shardCount);
            set('shard_watchdog_ms', shardWatchdogMs);
            set('command_watchdog_ms', commandWatchdogMs);

            const trustedPatterns = (policy.trustedCiPatterns || []).map((value) => new RegExp(value, 'u'));
            const goldenPatterns = (policy.goldenFixturePatterns || []).map((value) => new RegExp(value, 'u'));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const matches = (filename, patterns) =>
              typeof filename === 'string' && patterns.some((pattern) => pattern.test(filename));
            const trusted = files.some((file) =>
              matches(file.filename, trustedPatterns) || matches(file.previous_filename, trustedPatterns));
            set('trusted_ci_changed', trusted ? 'true' : 'false');

            const protectedChanges = files.filter((file) =>
              file.status !== 'added'
              && (matches(file.filename, goldenPatterns) || matches(file.previous_filename, goldenPatterns)));
            if (protectedChanges.length) {
              set('blocked_reason', 'policy-block');
              core.warning(`Protected golden fixtures changed: ${protectedChanges.map((file) => file.filename).join(', ')}`);
              return;
            }
            if (trusted) {
              set('blocked_reason', 'trusted-ci-change');
              core.notice(`PR #${number} changes trusted CI/evaluation infrastructure and is human-merge-only.`);
              return;
            }
            if (!files.length) {
              set('blocked_reason', 'policy-block');
              core.notice(`PR #${number} has no changed files.`);
              return;
            }

            const delays = [0, 1000, 2000, 4000, 8000];
            let mergeSha = '';
            for (const delay of delays) {
              if (delay) await new Promise((resolve) => setTimeout(resolve, delay));
              const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (latest.state !== 'open' || latest.head.sha !== expectedHead) {
                set('blocked_reason', 'not-current');
                return;
              }
              const { data: currentBase } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (currentBase.commit.sha !== expectedBase) {
                core.notice(`main advanced while resolving the synthetic merge; abandoning admitted base ${expectedBase}.`);
                return;
              }
              const mergeableState = String(latest.mergeable_state || '').toLowerCase();
              if (mergeableState === 'dirty') {
                set('blocked_reason', 'conflict');
                core.notice(`PR #${number} has a real merge conflict with current main.`);
                return;
              }
              const candidate = String(latest.merge_commit_sha || '');
              if (!/^[0-9a-f]{40}$/u.test(candidate)) continue;
              try {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: candidate });
                if (commit.parents?.[0]?.sha === baseSha && commit.parents?.[1]?.sha === expectedHead) {
                  mergeSha = candidate;
                  break;
                }
              } catch {
                // GitHub may still be computing refs/pull/N/merge.
              }
            }
            if (!mergeSha) {
              set('blocked_reason', 'infrastructure');
              core.warning(`GitHub did not produce a current synthetic merge for PR #${number}.`);
              return;
            }

            set('merge_sha', mergeSha);
            set('blocked_reason', '');
            set('should_validate', 'true');
            core.notice(`PR #${number}: base=${baseSha}, head=${expectedHead}, merge=${mergeSha}, retry=${retry}.`);
      - name: Write validation target
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
          TRUSTED: ${{ steps.resolve.outputs.trusted_ci_changed }}
          BLOCKED: ${{ steps.resolve.outputs.blocked_reason }}
          RETRY: ${{ steps.resolve.outputs.retry }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const target = {
            schemaVersion: 1,
            prNumber: Number(process.env.PR_NUMBER || 0),
            headSha: process.env.HEAD_SHA || '',
            baseSha: process.env.BASE_SHA || '',
            mergeSha: process.env.MERGE_SHA || '',
            trustedCiChanged: process.env.TRUSTED === 'true',
            blockedReason: process.env.BLOCKED || '',
            retry: Number(process.env.RETRY || 0),
            dispatchReason: process.env.DISPATCH_REASON || 'queue',
          };
          fs.writeFileSync('validation-target.json', `${JSON.stringify(target, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-target
          path: validation-target.json
          retention-days: 1

  restore_base:
    name: Restore trusted base evidence
    needs: gate
    if: ${{ needs.gate.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      usable: ${{ steps.validate.outputs.usable }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: fingerprint
        run: node src/cli/src/commands/ci-automerge-evidence.ts fingerprint --github-output "$GITHUB_OUTPUT"
      - name: Package trusted validation runtime
        run: |
          mkdir -p trusted-runtime/run-validation
          cp src/cli/src/commands/ci-automerge-evidence.ts trusted-runtime/ci-automerge-evidence.ts
          cp .github/actions/run-automerge-validation/action.yml trusted-runtime/run-validation/action.yml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trusted-automerge-runtime
          path: trusted-runtime
          retention-days: 1
      - id: exact
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: report-base
          key: automerge-base-v8-${{ needs.gate.outputs.base_sha }}-${{ steps.fingerprint.outputs.fingerprint }}
      - id: validate
        shell: bash
        run: |
          if [ '${{ steps.exact.outputs.cache-hit }}' != true ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node src/cli/src/commands/ci-automerge-evidence.ts validate \
            --report-dir report-base \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --expected-fingerprint '${{ steps.fingerprint.outputs.fingerprint }}'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf report-base
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore nearest complete trusted ancestor
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: report-ancestor
          key: automerge-baseline-v2-${{ steps.fingerprint.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-baseline-v2-${{ steps.fingerprint.outputs.fingerprint }}-
      - name: Expose cached base evidence
        if: ${{ steps.validate.outputs.usable == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-base
          path: report-base
          retention-days: 1
      - name: Expose complete ancestor evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-ancestor
          path: report-ancestor
          if-no-files-found: ignore
          retention-days: 1

  base_prepare:
    name: Build base fallback and plan tests
    needs: [gate, restore_base]
    if: ${{ needs.gate.outputs.should_validate == 'true' && needs.restore_base.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build_succeeded: ${{ steps.build.outputs.succeeded }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - id: build
        uses: ./.github/actions/run-automerge-validation
        with:
          mode: build
          evidence-tool: src/cli/src/commands/ci-automerge-evidence.ts
          report-dir: base-build
          timeout-ms: ${{ needs.gate.outputs.command_watchdog_ms }}
          target-sha: ${{ needs.gate.outputs.base_sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: base-build
          path: base-build
          retention-days: 1
      - name: Restore trusted timing history
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-history
          key: automerge-timing-v3-${{ needs.restore_base.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-timing-v3-${{ needs.restore_base.outputs.fingerprint }}-
      - name: Stage compiled runtime
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: node src/cli/src/commands/ci-automerge-evidence.ts stage-compiled --output compiled-runtime
      - id: plan
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: |
          node src/cli/src/commands/ci-automerge-evidence.ts manifest \
            --output test-manifest.json \
            --history .ci-history/test-durations.json \
            --shards '${{ needs.gate.outputs.shard_count }}' \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: compiled-base
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: base-test-plan
          path: test-manifest.json
          retention-days: 1

  base_lint:
    name: Lint base fallback
    needs: [gate, restore_base, base_prepare]
    if: ${{ needs.gate.outputs.should_validate == 'true' && needs.restore_base.outputs.usable != 'true' && needs.base_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - name: Capture comparable lint evidence
        uses: ./.automerge-trusted/run-validation
        with:
          mode: lint
          evidence-tool: .automerge-trusted/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.gate.outputs.command_watchdog_ms }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: base-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_tests:
    name: Base tests (${{ matrix.shard }})
    needs: [gate, restore_base, base_prepare]
    if: ${{ needs.gate.outputs.should_validate == 'true' && needs.restore_base.outputs.usable != 'true' && needs.base_prepare.outputs.build_succeeded == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.base_prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: compiled-base, path: compiled-runtime }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-test-plan, path: . }
      - run: cp -R compiled-runtime/. .
      - name: Run bounded test shard
        uses: ./.automerge-trusted/run-validation
        with:
          mode: test
          evidence-tool: .automerge-trusted/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.gate.outputs.shard_watchdog_ms }}
          manifest: test-manifest.json
          shard: ${{ matrix.shard }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: base-test-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_assemble:
    name: Assemble fallback base evidence
    needs: [gate, restore_base, base_prepare, base_lint, base_tests]
    if: ${{ always() && needs.gate.outputs.should_validate == 'true' && needs.restore_base.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.gate.outputs.base_sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-build, path: build }
      - name: Package build-only or full base evidence
        shell: bash
        run: |
          mkdir -p reports
          cp build/build-evidence.json reports/build-evidence.json
          if [ '${{ needs.base_prepare.outputs.build_succeeded }}' = true ]; then
            test '${{ needs.base_lint.result }}' = success
            test '${{ needs.base_tests.result }}' = success
          fi
      - name: Download base lint
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-lint, path: reports }
      - name: Download base test shards
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: base-test-shard-*
          merge-multiple: true
          path: reports
      - name: Download base test plan
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-test-plan, path: . }
      - name: Assemble full base report
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        run: |
          node .automerge-trusted/ci-automerge-evidence.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.base_sha }}' \
            --fingerprint '${{ needs.restore_base.outputs.fingerprint }}'
      - name: Validate packaged base evidence
        run: |
          node .automerge-trusted/ci-automerge-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --expected-fingerprint '${{ needs.restore_base.outputs.fingerprint }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-base
          path: reports
          retention-days: 1

  merge_prepare:
    name: Build synthetic merge and plan tests
    needs: [gate, restore_base]
    if: ${{ needs.gate.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build_succeeded: ${{ steps.build.outputs.succeeded }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - id: build
        uses: ./.automerge-trusted/run-validation
        with:
          mode: build
          evidence-tool: .automerge-trusted/ci-automerge-evidence.ts
          report-dir: merge-build
          timeout-ms: ${{ needs.gate.outputs.command_watchdog_ms }}
          target-sha: ${{ needs.gate.outputs.merge_sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: merge-build
          path: merge-build
          retention-days: 1
      - name: Restore timing history
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-history
          key: automerge-timing-v3-${{ needs.restore_base.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-timing-v3-${{ needs.restore_base.outputs.fingerprint }}-
      - name: Stage compiled runtime
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: node .automerge-trusted/ci-automerge-evidence.ts stage-compiled --output compiled-runtime
      - id: plan
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: |
          node .automerge-trusted/ci-automerge-evidence.ts manifest \
            --output test-manifest.json \
            --history .ci-history/test-durations.json \
            --shards '${{ needs.gate.outputs.shard_count }}' \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with: { name: compiled-merge, path: compiled-runtime, retention-days: 1 }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with: { name: merge-test-plan, path: test-manifest.json, retention-days: 1 }

  merge_lint:
    name: Lint synthetic merge
    needs: [gate, restore_base, merge_prepare]
    if: ${{ needs.gate.outputs.should_validate == 'true' && needs.merge_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.gate.outputs.merge_sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - name: Capture comparable lint evidence
        uses: ./.automerge-trusted/run-validation
        with:
          mode: lint
          evidence-tool: .automerge-trusted/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.gate.outputs.command_watchdog_ms }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with: { name: merge-lint, path: reports, if-no-files-found: error, retention-days: 1 }

  merge_tests:
    name: Merge tests (${{ matrix.shard }})
    needs: [gate, restore_base, merge_prepare]
    if: ${{ needs.gate.outputs.should_validate == 'true' && needs.merge_prepare.outputs.build_succeeded == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.merge_prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.gate.outputs.merge_sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: compiled-merge, path: compiled-runtime }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: merge-test-plan, path: . }
      - run: cp -R compiled-runtime/. .
      - name: Run bounded test shard
        uses: ./.automerge-trusted/run-validation
        with:
          mode: test
          evidence-tool: .automerge-trusted/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.gate.outputs.shard_watchdog_ms }}
          manifest: test-manifest.json
          shard: ${{ matrix.shard }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: merge-test-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_assemble:
    name: Assemble synthetic-merge evidence
    needs: [gate, restore_base, merge_prepare, merge_lint, merge_tests]
    if: ${{ always() && needs.gate.outputs.should_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.gate.outputs.base_sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: trusted-automerge-runtime, path: .automerge-trusted }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: merge-build, path: build }
      - name: Package build-only or full merge evidence
        shell: bash
        run: |
          mkdir -p reports
          cp build/build-evidence.json reports/build-evidence.json
          if [ '${{ needs.merge_prepare.outputs.build_succeeded }}' = true ]; then
            test '${{ needs.merge_lint.result }}' = success
            test '${{ needs.merge_tests.result }}' = success
          fi
      - name: Download merge lint
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: merge-lint, path: reports }
      - name: Download merge test shards
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: merge-test-shard-*
          merge-multiple: true
          path: reports
      - name: Download merge test plan
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: merge-test-plan, path: . }
      - name: Assemble full merge report
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        run: |
          node .automerge-trusted/ci-automerge-evidence.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.merge_sha }}' \
            --fingerprint '${{ needs.restore_base.outputs.fingerprint }}'
      - name: Validate packaged merge evidence
        run: |
          node .automerge-trusted/ci-automerge-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.merge_sha }}' \
            --expected-fingerprint '${{ needs.restore_base.outputs.fingerprint }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-merge
          path: reports
          retention-days: 1

  validation_complete:
    name: Validation evidence complete
    needs: [gate, restore_base, base_prepare, base_assemble, merge_prepare, merge_assemble]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete comparable evidence
        shell: bash
        run: |
          test '${{ needs.gate.result }}' = success
          if [ '${{ needs.gate.outputs.should_validate }}' != true ]; then
            echo "No unattended validation required: ${{ needs.gate.outputs.blocked_reason }}"
            exit 0
          fi
          test '${{ needs.merge_assemble.result }}' = success
          if [ '${{ needs.restore_base.outputs.usable }}' = true ]; then
            test '${{ needs.restore_base.result }}' = success
          else
            test '${{ needs.base_assemble.result }}' = success
          fi

  terminal_handoff:
    name: Persist validation run and wake trusted coordinator
    needs: [gate, validation_complete]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Persist exact run identity and dispatch coordinator
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          INPUT_RETRY: ${{ inputs.retry }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER || 0);
            const head = String(process.env.EXPECTED_HEAD || '');
            const base = String(process.env.EXPECTED_BASE || '');
            const retry = Number(process.env.INPUT_RETRY || 0);
            const runId = Number(process.env.VALIDATION_RUN_ID || 0);
            const runAttempt = Number(process.env.VALIDATION_RUN_ATTEMPT || 0);
            if (!Number.isInteger(number) || number <= 0
                || !/^[0-9a-f]{40}$/u.test(head)
                || !/^[0-9a-f]{40}$/u.test(base)
                || !Number.isInteger(retry) || retry < 0
                || !Number.isInteger(runId) || runId <= 0
                || runAttempt !== 1
                || context.sha !== base) {
              core.warning('Terminal handoff refused invalid or non-first-attempt validation identity.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== head) {
              core.notice(`PR #${number} changed before terminal handoff; no coordinator wake-up is needed.`);
              return;
            }

            const stateModule = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'src/cli/src/commands/ci-automerge-state.ts',
            )).href);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = stateModule.findBotAutoMergeSummaryComment(comments);
            const pendingState = {
              pr: number,
              head,
              base,
              green: false,
              trusted: false,
              reason: 'pending',
              retry,
              validationRunId: runId,
              handoffRetry: 0,
              runId: 0,
            };
            const render = (state, summary) => stateModule.renderAutoMergeStateComment(state, summary);
            const upsert = async (state, summary) => {
              const body = render(state, summary);
              if (existing?.id) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            };
            const targetUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            try {
              await upsert(pendingState,
                `### Trusted auto-merge evaluation\n\n⏳ Validation run ${runId} reached terminal handoff; trusted finalization is being coordinated.`);
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head,
                state: 'pending',
                context: 'automerge/trusted-validation',
                description: 'Trusted finalization queued',
                target_url: targetUrl,
              });
            } catch (error) {
              // Finalization can repair the durable surface, so do not strand a completed
              // worker solely because the pre-handoff status/comment update was transient.
              core.warning(`Could not persist terminal handoff state for PR #${number}: ${error.message}`);
            }

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'automerge-reconcile.yml',
                ref: 'main',
                inputs: {
                  source_validation_run_id: String(runId),
                  source_pr_number: String(number),
                  source_head: head,
                },
              });
              core.notice(`Dispatched trusted coordinator for terminal validation run ${runId}.`);
            } catch (error) {
              const policy = JSON.parse(fs.readFileSync('.github/ci/automerge-policy.json', 'utf8'));
              const maxRetries = Number(policy.maxInfrastructureRetries || 1);
              const handoffRetry = 1;
              const canRetry = Number.isInteger(maxRetries) && handoffRetry <= maxRetries;
              try {
                await upsert({
                  ...pendingState,
                  reason: 'infrastructure',
                  handoffRetry,
                }, `### Trusted auto-merge evaluation\n\n⚠️ Terminal coordinator dispatch failed: ${error.message}`);
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: head,
                  state: canRetry ? 'pending' : 'failure',
                  context: 'automerge/trusted-validation',
                  description: canRetry ? 'Finalizer handoff retry pending' : 'Finalizer handoff retry exhausted',
                  target_url: targetUrl,
                });
              } catch (stateError) {
                core.warning(`Could not persist terminal dispatch failure for PR #${number}: ${stateError.message}`);
              }
              core.warning(`Could not wake trusted coordinator for validation run ${runId}: ${error.message}`);
            }
