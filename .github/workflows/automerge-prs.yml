name: "Auto-merge PRs"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.decide.outputs.should_run_tests }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.pull_request?.number;
            if (!n) {
              core.setOutput('should_run_tests', 'false');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: n,
              per_page: 100,
            });
            const protectedGoldenFixturePatterns = [
              /^test\/fixtures\/plugin-integration\/.*\.gml$/u,
              /^src\/parser\/test\/input\/.*\.gml$/u,
              /^src\/lint\/test\/fixtures\/.*\.gml$/u,
            ];
            const isProtectedGoldenFixture = (filename) =>
              typeof filename === 'string' &&
              protectedGoldenFixturePatterns.some((pattern) => pattern.test(filename));
            const changedFixtures = files.filter((file) => {
              if (file.status === 'added') return false;
              return isProtectedGoldenFixture(file.filename) || isProtectedGoldenFixture(file.previous_filename);
            });

            if (changedFixtures.length > 0) {
              core.setFailed(`Golden .gml test fixtures cannot be modified or removed! Found: ${changedFixtures.map((file) => file.filename).join(', ')}`);
              return;
            }

            core.notice(`PR changed files: ${files.length}`);
            core.setOutput('should_run_tests', files.length > 0 ? 'true' : 'false');

  tests:
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    name: Generate reports (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [base, head, merge]

    steps:
      - name: Resolve ref for ${{ matrix.target }}
        id: ref
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "base" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.target }}" = "head" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (${{ matrix.target }})
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Restore cached base report
        id: base-cache
        if: ${{ matrix.target == 'base' }}
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: automerge-base-report-v2-${{ github.event.pull_request.base.sha }}

      - name: Setup pnpm (${{ matrix.target }})
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node (${{ matrix.target }})
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --recursive --force

      - name: Generate quality reports (${{ matrix.target }})
        id: report
        if: ${{ matrix.target != 'base' || steps.base-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p reports

          pnpm run build:ts || status=$?
          if [ "$status" -eq 0 ]; then
            pnpm exec eslint . \
              --format ./scripts/eslint-checkstyle-formatter.mjs \
              --output-file reports/eslint-checkstyle.xml &
            lint_pid=$!

            pnpm run test:report:gate:compiled &
            test_pid=$!

            wait "$lint_pid" || status=$?
            wait "$test_pid" || status=$?
          fi

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize JUnit report
        if: ${{ always() }}
        shell: bash
        env:
          TEST_STATUS: ${{ steps.report.outputs.exit_code || 'unknown' }}
        run: pnpm -s test:ensure-junit

      - name: Validate generated report
        id: validate
        if: ${{ always() }}
        shell: bash
        run: |
          complete=true
          if [ ! -s reports/tests.xml ] || ! grep -q '</testsuites>' reports/tests.xml; then
            echo "::error::Missing or incomplete reports/tests.xml for ${{ matrix.target }}."
            complete=false
          fi
          if [ ! -s reports/eslint-checkstyle.xml ] || ! grep -q '</checkstyle>' reports/eslint-checkstyle.xml; then
            echo "::error::Missing or incomplete reports/eslint-checkstyle.xml for ${{ matrix.target }}."
            complete=false
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Save successful base report
        if: >-
          ${{
            always() &&
            matrix.target == 'base' &&
            steps.base-cache.outputs.cache-hit != 'true' &&
            steps.report.outputs.exit_code == '0' &&
            steps.validate.outputs.complete == 'true'
          }}
        uses: actions/cache/save@v4
        with:
          path: reports
          key: automerge-base-report-v2-${{ github.event.pull_request.base.sha }}

      - name: Publish test summary (${{ matrix.target }})
        if: ${{ always() && steps.validate.outputs.complete == 'true' }}
        uses: dorny/test-reporter@v3
        with:
          name: Publish test summary (${{ matrix.target }})
          path: reports/tests.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: false

      - name: Upload report artifacts (${{ matrix.target }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ matrix.target }}
          path: |
            reports/*.xml
            reports/lcov.info
            reports/jscpd-report.json
            reports/project-health.json
          if-no-files-found: warn
          retention-days: 7

  summarize:
    name: Summarize & comment table
    needs: [gate, tests]
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        needs.gate.outputs.should_run_tests == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      all_green: ${{ steps.summarize.outputs.all_green }}
    env:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}

    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive --force

      - name: Build CLI
        run: pnpm run ensure:cli

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: report-*
          merge-multiple: false

      - name: Detect regressions
        id: regress
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p reports

          missing=()
          for target in base head merge; do
            dir="report-$target"
            if [ ! -s "$dir/tests.xml" ] || ! grep -q '</testsuites>' "$dir/tests.xml"; then
              missing+=("$dir/tests.xml")
            fi
            if [ ! -s "$dir/eslint-checkstyle.xml" ] || ! grep -q '</checkstyle>' "$dir/eslint-checkstyle.xml"; then
              missing+=("$dir/eslint-checkstyle.xml")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo '<!-- automerge-pr-test-summary -->'
              echo '### Quality Report Summary'
              echo
              echo '❌ Auto-merge validation could not produce a complete report set.'
              echo
              echo 'Missing or incomplete artifacts:'
              for path in "${missing[@]}"; do
                echo "- \`$path\`"
              done
              echo
              echo 'This is treated as a CI failure, not as a passing or silently skipped validation.'
            } > reports/summary-report.md
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=missing_reports" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm run cli:compiled generate-quality-report \
            --base report-base \
            --head report-head \
            --merge report-merge \
            --report-file reports/summary-report.md
          code=$?

          if [ "$code" -eq 0 ]; then
            echo "all_green=true" >> "$GITHUB_OUTPUT"
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 11 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=lint_errors" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=regressions" >> "$GITHUB_OUTPUT"
          else
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Summarize and comment
        id: summarize
        uses: actions/github-script@v8
        env:
          REGRESSION_ALL_GREEN: ${{ steps.regress.outputs.all_green }}
        with:
          script: |
            const fs = require('node:fs');
            const MARKER = '<!-- automerge-pr-test-summary -->';
            const reportFile = 'reports/summary-report.md';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;

            let body = `${MARKER}\n### Quality Report Summary\n\n⚠️ Report generation failed. Check the action logs for details.`;
            if (fs.existsSync(reportFile)) body = fs.readFileSync(reportFile, 'utf8');

            if (number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              }
            }

            core.setOutput('all_green', process.env.REGRESSION_ALL_GREEN === 'true' ? 'true' : 'false');

      - name: Request Agent help for lint errors
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.regress.outputs.status == 'lint_errors' &&
            env.GH_USER_TOKEN != ''
          }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const marker = '<!-- automerge-pr-lint-agent -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const body = [
              marker,
              '',
              '@mini-max The auto-merge workflow detected lint regressions on this PR. Please fix the lint errors without weakening the checks.',
              '',
              `Push fixes to **${pr.head.ref}** for PR #${number}; do not open a new PR.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });

      - name: Request Agent help for test regressions
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.regress.outputs.status == 'regressions' &&
            env.GH_USER_TOKEN != ''
          }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- automerge-pr-regression-agent -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            let agent = 'copilot';
            try {
              const config = JSON.parse(fs.readFileSync('.github/workflows/weights.json', 'utf8'));
              const candidates = (config?.agentPools?.followUps?.agents ?? [])
                .filter((item) => Number(item?.weight) > 0 && typeof item?.name === 'string')
                .sort((left, right) => right.weight - left.weight || left.name.localeCompare(right.name));
              if (candidates.length > 0) agent = candidates[0].name;
              else if (typeof config?.agentPools?.followUps?.default === 'string') agent = config.agentPools.followUps.default;
            } catch (error) {
              core.warning(`Unable to read follow-up agent weights: ${error.message}`);
            }
            const body = [
              marker,
              '',
              `@${agent} The auto-merge workflow detected a Base → Merged test regression on this PR. Please reproduce it, identify the root cause, and make the smallest correct fix without removing tests or weakening performance requirements.`,
              '',
              `Push fixes to **${pr.head.ref}** for PR #${number}; do not open a new PR.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });

  auto-merge:
    name: Auto-merge when green
    needs: summarize
    if: ${{ github.event_name == 'pull_request' && needs.summarize.outputs.all_green == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR and verify validation is current
        id: prepare
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setOutput('proceed', 'false');
              return;
            }

            const validatedHead = context.payload.pull_request.head.sha;
            const validatedBase = context.payload.pull_request.base.sha;
            const loadPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let pr = await loadPr();

            if (pr.draft) {
              core.notice(`Skip merge #${number}: draft.`);
              core.setOutput('proceed', 'false');
              return;
            }
            if (pr.head.sha !== validatedHead) {
              core.notice(`Skip merge #${number}: head moved after validation (${validatedHead} -> ${pr.head.sha}).`);
              core.setOutput('proceed', 'false');
              return;
            }

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const state = String(pr.mergeable_state || '').toLowerCase();
              if (pr.mergeable !== null && state && state !== 'unknown') break;
              if (attempt === 6) {
                core.notice(`Skip merge #${number}: mergeability remained unresolved.`);
                core.setOutput('proceed', 'false');
                return;
              }
              await wait(5000);
              pr = await loadPr();
            }

            const state = String(pr.mergeable_state || '').toLowerCase();
            if (pr.mergeable !== true || state === 'dirty') {
              core.notice(`Skip merge #${number}: mergeable=${pr.mergeable}, state=${pr.mergeable_state}.`);
              core.setOutput('proceed', 'false');
              return;
            }

            core.setOutput('proceed', 'true');
            core.setOutput('pr', JSON.stringify(pr));
            core.setOutput('validated_head', validatedHead);
            core.setOutput('validated_base', validatedBase);

      - name: Ensure PR branch is current with base
        id: update
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        uses: actions/github-script@v8
        env:
          PREPARE_PR: ${{ steps.prepare.outputs.pr }}
          VALIDATED_BASE: ${{ steps.prepare.outputs.validated_base }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const pr = JSON.parse(process.env.PREPARE_PR || '{}');
            const validatedBase = process.env.VALIDATED_BASE;
            const state = String(pr.mergeable_state || '').toLowerCase();
            const baseAdvanced = Boolean(pr.base?.sha && validatedBase && pr.base.sha !== validatedBase);
            const needsUpdate = state === 'behind' || baseAdvanced;

            if (!needsUpdate) {
              core.setOutput('ready_to_merge', 'true');
              return;
            }

            core.notice(`PR #${number} needs a base update before merge (state=${state}, baseAdvanced=${baseAdvanced}). Updating the branch and requiring a fresh synchronize validation.`);
            try {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number: number, expected_head_sha: pr.head.sha });
              core.setOutput('ready_to_merge', 'false');
              core.setOutput('revalidation_required', 'true');
              return;
            } catch (updateError) {
              const message = String(updateError?.message || '');
              if (message.toLowerCase().includes('already up to date')) {
                core.setOutput('ready_to_merge', 'true');
                return;
              }
              core.warning(`pulls.updateBranch failed: ${message}`);
            }

            try {
              const { status } = await github.rest.repos.merge({
                owner,
                repo,
                base: pr.head.ref,
                head: pr.base.ref,
                commit_message: `chore: sync ${pr.head.ref} with ${pr.base.ref}`,
              });
              if (status === 204) core.setOutput('ready_to_merge', 'true');
              else {
                core.setOutput('ready_to_merge', 'false');
                core.setOutput('revalidation_required', 'true');
              }
            } catch (error) {
              core.warning(`Unable to update PR branch: ${error?.message || error}`);
              core.setOutput('ready_to_merge', 'false');
            }

      - name: Attempt merge
        id: attempt
        if: ${{ steps.prepare.outputs.proceed == 'true' && steps.update.outputs.ready_to_merge == 'true' }}
        uses: actions/github-script@v8
        env:
          VALIDATED_HEAD: ${{ steps.prepare.outputs.validated_head }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const validatedHead = process.env.VALIDATED_HEAD;
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (current.head.sha !== validatedHead) {
              core.notice(`Skip merge #${number}: head changed after validation (${validatedHead} -> ${current.head.sha}).`);
              core.setOutput('merged', 'false');
              return;
            }

            try {
              const response = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: number,
                merge_method: 'squash',
                sha: validatedHead,
              });
              if (response.data.merged) {
                core.notice(`Auto-merged PR #${number}.`);
                core.setOutput('merged', 'true');
              } else {
                core.warning(`Merge rejected for PR #${number}: ${response.data.message}`);
                core.setOutput('merged', 'false');
              }
            } catch (error) {
              core.warning(`Merge attempt failed: ${error?.message || error}`);
              core.setOutput('merged', 'false');
            }

      - name: Delete head branch (if merged)
        if: ${{ steps.attempt.outputs.merged == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const headRef = pr.head?.ref;
            const headRepo = pr.head?.repo?.full_name?.toLowerCase() || '';
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            if (!headRef || headRepo !== thisRepo) return;

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            if (headRef === repoInfo.default_branch) return;

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
              core.notice(`Deleted branch ${headRef} after merge.`);
            } catch (error) {
              core.warning(`Unable to delete head branch: ${error.message}`);
            }
