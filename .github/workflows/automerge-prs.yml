name: "Auto-merge PRs"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: automerge-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Resolve validation target
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.decide.outputs.should_run_tests }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      merge_sha: ${{ steps.decide.outputs.merge_sha }}
      trusted_ci_changed: ${{ steps.decide.outputs.trusted_ci_changed }}
      shard_count: ${{ steps.decide.outputs.shard_count }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setOutput('should_run_tests', 'false');
              core.setOutput('trusted_ci_changed', 'true');
              core.setOutput('shard_count', '5');
              return;
            }

            const mergeSha = context.sha;
            const headSha = context.payload.pull_request?.head?.sha;
            const { data: mergeCommit } = await github.rest.repos.getCommit({ owner, repo, ref: mergeSha });
            const baseSha = mergeCommit.parents?.[0]?.sha;
            const mergeHeadSha = mergeCommit.parents?.[1]?.sha;
            if (!baseSha || !headSha || !mergeHeadSha || mergeHeadSha !== headSha) {
              core.setFailed(`Unable to resolve the exact synthetic merge for PR #${number}.`);
              core.setOutput('should_run_tests', 'false');
              core.setOutput('trusted_ci_changed', 'true');
              core.setOutput('shard_count', '5');
              return;
            }

            const fallbackPolicy = {
              testShardCount: 5,
              goldenFixturePatterns: [
                '^test/fixtures/.*\\.gml$',
                '^src/parser/test/.*\\.gml$',
                '^src/refactor/test/fixtures/.*\\.gml$',
                '^src/format/test/fixtures/.*\\.gml$',
                '^src/lint/test/.*\\.gml$',
              ],
              trustedCiPatterns: [
                '^\\.github/workflows/.*\\.ya?ml$',
                '^\\.github/actions/',
                '^\\.github/ci/automerge-policy\\.json$',
                '^src/cli/src/commands/ci-report\\.ts$',
                '^src/cli/src/commands/ci-build-evidence\\.ts$',
                '^src/cli/src/commands/generate-quality-report\\.ts$',
                '^src/cli/src/modules/quality-report/',
                '^src/cli/src/cli-command-registration\\.ts$',
                '^package\\.json$',
                '^pnpm-lock\\.yaml$',
                '^pnpm-workspace\\.yaml$',
                '^eslint\\.config\\.js$',
                '^\\.nvmrc$',
                '^tsconfig(?:\\..+)?\\.json$',
                '^src/[^/]+/tsconfig\\.json$',
              ],
            };

            let policy = fallbackPolicy;
            let policyFromBase = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/ci/automerge-policy.json',
                ref: baseSha,
              });
              if (!Array.isArray(data) && data.type === 'file' && data.content) {
                policy = JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
                policyFromBase = true;
              }
            } catch (error) {
              core.warning(`Base does not yet provide the auto-merge policy; using conservative bootstrap policy: ${error.message}`);
            }

            const shardCount = Number(policy.testShardCount);
            if (!Number.isInteger(shardCount) || shardCount < 1) {
              core.setFailed(`Invalid testShardCount in auto-merge policy: ${policy.testShardCount}`);
              return;
            }
            const goldenPatterns = (policy.goldenFixturePatterns || []).map((value) => new RegExp(value, 'u'));
            const trustedPatterns = (policy.trustedCiPatterns || []).map((value) => new RegExp(value, 'u'));
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const matches = (filename, patterns) =>
              typeof filename === 'string' && patterns.some((pattern) => pattern.test(filename));

            const changedGoldenFixtures = files.filter((file) => {
              if (file.status === 'added') return false;
              return matches(file.filename, goldenPatterns) || matches(file.previous_filename, goldenPatterns);
            });
            if (changedGoldenFixtures.length > 0) {
              core.setFailed(`Protected golden .gml fixtures cannot be modified, renamed, or removed: ${changedGoldenFixtures.map((file) => file.filename).join(', ')}`);
              core.setOutput('should_run_tests', 'false');
              return;
            }

            const trustedCiChanged = !policyFromBase || files.some((file) =>
              matches(file.filename, trustedPatterns) || matches(file.previous_filename, trustedPatterns));
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);
            core.setOutput('merge_sha', mergeSha);
            core.setOutput('trusted_ci_changed', trustedCiChanged ? 'true' : 'false');
            core.setOutput('shard_count', String(shardCount));
            core.setOutput('should_run_tests', files.length > 0 ? 'true' : 'false');
            core.notice(`Validating base ${baseSha}, head ${headSha}, merge ${mergeSha}; shards=${shardCount}; trusted CI changed=${trustedCiChanged}.`);

  base_cache:
    name: Restore trusted base evidence
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      usable: ${{ steps.restored.outputs.usable }}
      fingerprint: ${{ steps.tooling.outputs.fingerprint }}
      cache_key: ${{ steps.tooling.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Compute trusted-report fingerprint
        id: tooling
        shell: bash
        run: |
          fingerprint="$({
            printf '%s\0' 'src/cli/src/commands/ci-report.ts'
            cat src/cli/src/commands/ci-report.ts
            printf '\0%s\0' 'src/cli/src/commands/ci-build-evidence.ts'
            cat src/cli/src/commands/ci-build-evidence.ts
            printf '\0%s\0' '.github/ci/automerge-policy.json'
            cat .github/ci/automerge-policy.json
          } | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_key=automerge-base-report-v7-${{ needs.gate.outputs.base_sha }}-$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore cached base evidence
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: ${{ steps.tooling.outputs.cache_key }}
      - name: Validate restored base evidence
        id: restored
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set +e
          if [ -f reports/auto-merge-report.json ]; then
            node src/cli/src/commands/ci-report.ts validate \
              --report-dir reports \
              --expected-sha '${{ needs.gate.outputs.base_sha }}' \
              --expected-fingerprint '${{ steps.tooling.outputs.fingerprint }}'
          elif [ -f reports/build-evidence.json ]; then
            node src/cli/src/commands/ci-build-evidence.ts validate \
              --report-dir reports \
              --expected-sha '${{ needs.gate.outputs.base_sha }}' \
              --require-failure
          else
            false
          fi
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            rm -rf reports
          fi
          exit 0
      - name: Mark cache miss
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: miss
        run: echo "usable=false" >> "$GITHUB_OUTPUT"
      - name: Expose trusted base evidence
        if: ${{ steps.restored.outputs.usable == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: report-base
          path: reports
          retention-days: 1

  head_diagnostic:
    name: Head build diagnostic
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Record non-gating head build result
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-build-evidence.ts run \
            --target-sha '${{ needs.gate.outputs.head_sha }}' \
            --report-dir head-build
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Head build diagnostic could not complete; this diagnostic does not gate the exact synthetic merge."
          elif [ "$(node -p "require('./head-build/build-evidence.json').succeeded")" != true ]; then
            echo "::warning::PR head does not build standalone. The exact synthetic merge remains authoritative."
          fi
          exit 0

  base_prepare:
    name: Build base fallback and plan tests
    needs: [gate, base_cache]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_completed: ${{ steps.build.outputs.completed }}
      build_succeeded: ${{ steps.build.outputs.succeeded }}
      build_status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions/stage-ci-report/action.yml
            src/cli/src/commands/ci-report.ts
            src/cli/src/commands/ci-build-evidence.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Stage head-side CI tooling outside base tree
        id: ci
        uses: ./.ci-tools/.github/actions/stage-ci-report
        with:
          source: .ci-tools/src/cli/src/commands/ci-report.ts
          build-source: .ci-tools/src/cli/src/commands/ci-build-evidence.ts
      - name: Record exact base build evidence
        id: build
        run: |
          node '${{ steps.ci.outputs.build-tool }}' run \
            --target-sha '${{ needs.gate.outputs.base_sha }}' \
            --report-dir build-evidence \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: base-build-evidence
          path: build-evidence/build-evidence.json
          retention-days: 1
      - name: Restore trusted timing history when available
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-
      - name: Stage lean compiled runtime
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: node '${{ steps.ci.outputs.tool }}' stage-compiled --output compiled-runtime
      - name: Create exact timing-balanced base manifest
        id: plan
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: |
          node '${{ steps.ci.outputs.tool }}' manifest \
            --output test-manifest.json \
            --history .ci-history/test-durations.json \
            --shards '${{ needs.gate.outputs.shard_count }}' \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: compiled-base-${{ needs.gate.outputs.base_sha }}
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: base-test-plan
          path: test-manifest.json
          retention-days: 1

  base_lint:
    name: Lint base fallback
    needs: [gate, base_cache, base_prepare]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' && needs.base_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions/stage-ci-report/action.yml
            src/cli/src/commands/ci-report.ts
            src/cli/src/commands/ci-build-evidence.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Stage head-side CI tooling outside base tree
        id: ci
        uses: ./.ci-tools/.github/actions/stage-ci-report
        with:
          source: .ci-tools/src/cli/src/commands/ci-report.ts
          build-source: .ci-tools/src/cli/src/commands/ci-build-evidence.ts
      - name: Generate base lint report
        shell: bash
        run: |
          set +e
          node '${{ steps.ci.outputs.tool }}' lint --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_tests:
    name: Base tests (${{ matrix.shard }})
    needs: [gate, base_cache, base_prepare]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' && needs.base_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.base_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions/stage-ci-report/action.yml
            src/cli/src/commands/ci-report.ts
            src/cli/src/commands/ci-build-evidence.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Stage head-side CI tooling outside base tree
        id: ci
        uses: ./.ci-tools/.github/actions/stage-ci-report
        with:
          source: .ci-tools/src/cli/src/commands/ci-report.ts
          build-source: .ci-tools/src/cli/src/commands/ci-build-evidence.ts
      - uses: actions/download-artifact@v7
        with:
          name: compiled-base-${{ needs.gate.outputs.base_sha }}
          path: compiled-runtime
      - uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - run: cp -R compiled-runtime/. .
      - name: Run base test shard
        shell: bash
        run: |
          set +e
          node '${{ steps.ci.outputs.tool }}' run-shard \
            --manifest test-manifest.json \
            --shard '${{ matrix.shard }}' \
            --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_assemble:
    name: Assemble ephemeral base evidence
    needs: [gate, base_cache, base_prepare, base_lint, base_tests]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Require complete base execution
        run: |
          test '${{ needs.base_prepare.result }}' = success
          if [ '${{ needs.base_prepare.outputs.build_succeeded }}' = true ]; then
            test '${{ needs.base_lint.result }}' = success
            test '${{ needs.base_tests.result }}' = success
          fi
      - uses: actions/download-artifact@v7
        with:
          name: base-build-evidence
          path: build-evidence
      - name: Download base lint report
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: base-report-lint
          path: reports
      - name: Download base test reports
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          pattern: base-report-shard-*
          merge-multiple: true
          path: reports
      - name: Download base test plan
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - name: Assemble healthy base report
        if: ${{ needs.base_prepare.outputs.build_succeeded == 'true' }}
        run: |
          node src/cli/src/commands/ci-report.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.base_sha }}' \
            --fingerprint '${{ needs.base_cache.outputs.fingerprint }}' \
            --build-status 0
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --expected-fingerprint '${{ needs.base_cache.outputs.fingerprint }}'
      - name: Package deterministic broken-base evidence
        if: ${{ needs.base_prepare.outputs.build_succeeded != 'true' }}
        run: |
          mkdir -p reports
          cp build-evidence/build-evidence.json reports/build-evidence.json
          node src/cli/src/commands/ci-build-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --require-failure
      - uses: actions/upload-artifact@v6
        with:
          name: report-base
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_prepare:
    name: Build synthetic merge and plan tests
    needs: [gate, base_cache]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build_completed: ${{ steps.build.outputs.completed }}
      build_succeeded: ${{ steps.build.outputs.succeeded }}
      build_status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Record exact synthetic-merge build evidence
        id: build
        run: |
          node src/cli/src/commands/ci-build-evidence.ts run \
            --target-sha '${{ needs.gate.outputs.merge_sha }}' \
            --report-dir build-evidence \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: merge-build-evidence
          path: build-evidence/build-evidence.json
          retention-days: 1
      - name: Restore trusted timing history
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-
      - name: Stage lean compiled runtime
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: node src/cli/src/commands/ci-report.ts stage-compiled --output compiled-runtime
      - name: Download exact base timing when cache hit
        if: ${{ steps.build.outputs.succeeded == 'true' && needs.base_cache.outputs.usable == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: report-base
          path: report-base
      - name: Create exact timing-balanced merge manifest
        id: plan
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        shell: bash
        run: |
          history=.ci-history/test-durations.json
          if [ -f report-base/test-durations.json ]; then history=report-base/test-durations.json; fi
          node src/cli/src/commands/ci-report.ts manifest \
            --output test-manifest.json \
            --history "$history" \
            --shards '${{ needs.gate.outputs.shard_count }}' \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: compiled-merge-${{ needs.gate.outputs.merge_sha }}
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with:
          name: merge-test-plan
          path: test-manifest.json
          retention-days: 1

  merge_lint:
    name: Lint synthetic merge
    needs: [gate, merge_prepare]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.merge_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Generate merge lint report
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts lint --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: merge-report-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_tests:
    name: Merge tests (${{ matrix.shard }})
    needs: [gate, merge_prepare]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.merge_prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.merge_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          name: compiled-merge-${{ needs.gate.outputs.merge_sha }}
          path: compiled-runtime
      - uses: actions/download-artifact@v7
        with:
          name: merge-test-plan
          path: .
      - run: cp -R compiled-runtime/. .
      - name: Run merge test shard
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts run-shard \
            --manifest test-manifest.json \
            --shard '${{ matrix.shard }}' \
            --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: merge-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_assemble:
    name: Assemble synthetic-merge evidence
    needs: [gate, base_cache, merge_prepare, merge_lint, merge_tests]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Require complete synthetic-merge execution
        run: |
          test '${{ needs.merge_prepare.result }}' = success
          if [ '${{ needs.merge_prepare.outputs.build_succeeded }}' = true ]; then
            test '${{ needs.merge_lint.result }}' = success
            test '${{ needs.merge_tests.result }}' = success
          fi
      - uses: actions/download-artifact@v7
        with:
          name: merge-build-evidence
          path: build-evidence
      - name: Download merge lint report
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: merge-report-lint
          path: reports
      - name: Download merge test reports
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          pattern: merge-report-shard-*
          merge-multiple: true
          path: reports
      - name: Download merge test plan
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: merge-test-plan
          path: .
      - name: Assemble and validate healthy merge evidence
        if: ${{ needs.merge_prepare.outputs.build_succeeded == 'true' }}
        run: |
          node src/cli/src/commands/ci-report.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.merge_sha }}' \
            --fingerprint '${{ needs.base_cache.outputs.fingerprint }}' \
            --build-status 0
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.merge_sha }}' \
            --expected-fingerprint '${{ needs.base_cache.outputs.fingerprint }}'
      - name: Package deterministic merge build failure
        if: ${{ needs.merge_prepare.outputs.build_succeeded != 'true' }}
        run: |
          mkdir -p reports
          cp build-evidence/build-evidence.json reports/build-evidence.json
          node src/cli/src/commands/ci-build-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.merge_sha }}' \
            --require-failure
      - name: Publish timing profile
        if: ${{ always() && !cancelled() }}
        run: test ! -f reports/test-durations.md || cat reports/test-durations.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: report-merge
          path: reports
          if-no-files-found: error
          retention-days: 1

  validation_complete:
    name: Validation evidence complete
    needs: [gate, base_cache, base_assemble, head_diagnostic, merge_prepare, merge_lint, merge_tests, merge_assemble]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete comparable evidence
        env:
          SHOULD_RUN: ${{ needs.gate.outputs.should_run_tests }}
          GATE_RESULT: ${{ needs.gate.result }}
          BASE_CACHE_USABLE: ${{ needs.base_cache.outputs.usable }}
          BASE_ASSEMBLE_RESULT: ${{ needs.base_assemble.result }}
          MERGE_PREPARE_RESULT: ${{ needs.merge_prepare.result }}
          MERGE_BUILD_SUCCEEDED: ${{ needs.merge_prepare.outputs.build_succeeded }}
          MERGE_LINT_RESULT: ${{ needs.merge_lint.result }}
          MERGE_TEST_RESULT: ${{ needs.merge_tests.result }}
          MERGE_ASSEMBLE_RESULT: ${{ needs.merge_assemble.result }}
          TRUSTED_CI_CHANGED: ${{ needs.gate.outputs.trusted_ci_changed }}
        run: |
          if [ "$GATE_RESULT" != success ]; then
            echo "Gate failed."
            exit 1
          fi
          if [ "$SHOULD_RUN" != true ]; then
            exit 0
          fi
          if [ "$BASE_CACHE_USABLE" != true ] && [ "$BASE_ASSEMBLE_RESULT" != success ]; then
            echo "No complete base evidence was available."
            exit 1
          fi
          for result in "$MERGE_PREPARE_RESULT" "$MERGE_ASSEMBLE_RESULT"; do
            if [ "$result" != success ]; then
              echo "Synthetic-merge evidence component failed: $result"
              exit 1
            fi
          done
          if [ "$MERGE_BUILD_SUCCEEDED" = true ]; then
            if [ "$MERGE_LINT_RESULT" != success ] || [ "$MERGE_TEST_RESULT" != success ]; then
              echo "Synthetic merge built successfully but lint/test evidence did not complete."
              exit 1
            fi
          fi
          if [ "$TRUSTED_CI_CHANGED" = true ]; then
            echo "::notice::This PR changes trusted CI/evaluation files. Validation may complete, but unattended merge is disabled."
          fi
