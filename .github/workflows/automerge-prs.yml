name: "Auto-merge PRs"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.decide.outputs.should_run_tests }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.pull_request?.number;
            if (!n) { core.setOutput('should_run_tests', 'false'); return; }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: n, per_page: 100
            });

            const protectedGoldenFixturePatterns = [
              /^test\/fixtures\/plugin-integration\/.*\.gml$/u,
              /^src\/parser\/test\/input\/.*\.gml$/u,
              /^src\/lint\/test\/fixtures\/.*\.gml$/u
            ];

            const isProtectedGoldenFixture = (filename) =>
              typeof filename === 'string' &&
              protectedGoldenFixturePatterns.some((pattern) => pattern.test(filename));

            const changedFixtures = files.filter((f) => {
              if (f.status === 'added') {
                return false;
              }

              return (
                isProtectedGoldenFixture(f.filename) ||
                isProtectedGoldenFixture(f.previous_filename)
              );
            });
            if (changedFixtures.length > 0) {
              core.setFailed(`Golden .gml test fixtures cannot be modified or removed! Found: ${changedFixtures.map(f => f.filename).join(', ')}`);
              return;
            }

            core.notice(`PR changed files: ${files.length}`);
            core.setOutput('should_run_tests', files.length > 0 ? 'true' : 'false');

  tests:
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }} # <- job-level gate (will show Skipped)
    name: Run tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [base, head, merge]

    steps:
      - name: Resolve ref for ${{ matrix.target }}
        id: ref
        run: |
          if [ "${{ matrix.target }}" = "base" ]; then
            # Freeze base to the exact PR-event snapshot so comparisons stay stable
            # even if the base branch advances while this workflow is running.
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.target }}" = "head" ]; then
            # Explicit PR head commit (not the synthetic merge commit).
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Synthetic merge commit captured for this PR event.
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # If the synthetic merge ref doesn't exist, continue so the leg can still upload nothing and be summarized.
      - name: Checkout (${{ matrix.target }})
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
        continue-on-error: ${{ matrix.target == 'merge' }}

      - name: Setup pnpm (${{ matrix.target }})
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node (${{ matrix.target }})
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --recursive
        continue-on-error: ${{ matrix.target == 'merge' }}

      - name: Build typescript (${{ matrix.target }})
        run: |
          mkdir -p reports
          build_status=0
          if pnpm run build:ts; then
            build_status=0
          else
            build_status=$?
            echo "::warning::TypeScript workspace build failed for target '${{ matrix.target }}'; continuing workflow."
          fi

          failures=0
          if [ "$build_status" -ne 0 ]; then
            failures=1
          fi

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<testsuites>'
            echo "  <testsuite name=\"build\" tests=\"1\" failures=\"$failures\" errors=\"0\" skipped=\"0\">"
            echo '    <testcase name="pnpm run build:ts" classname="quality.build">'
            if [ "$build_status" -ne 0 ]; then
              echo "      <failure message=\"TypeScript workspace build failed\">pnpm run build:ts exited with status $build_status for ${{ matrix.target }}.</failure>"
            fi
            echo '    </testcase>'
            echo '  </testsuite>'
            echo '</testsuites>'
          } > reports/build.xml

      # Runs tests once, generating both JUnit XML and LCOV coverage
      - name: Run tests & coverage (${{ matrix.target }})
        id: run-tests
        run: pnpm run test:ci
        continue-on-error: true

      - name: Ensure valid JUnit XML (${{ matrix.target }})
        if: ${{ always() }}
        run: |
          mkdir -p reports
          TEST_STATUS="${{ steps.run-tests.outcome }}" pnpm -s test:ensure-junit

      - name: Run performance regression tests (${{ matrix.target }})
        if: ${{ matrix.target == 'head' }}
        continue-on-error: true
        run: pnpm run test:performance

      - name: Publish test summary (${{ matrix.target }})
        if: ${{ always() }}
        uses: dorny/test-reporter@v2
        with:
          name: Publish test summary (${{ matrix.target }})
          path: reports/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: false

      - name: Run lint (${{ matrix.target }})
        run: pnpm run lint:report
        continue-on-error: true

      - name: Run duplicates check (${{ matrix.target }})
        run: pnpm run lint:duplicates:report
        continue-on-error: true

      - name: Collect project stats (${{ matrix.target }})
        run: pnpm run stats:report
        continue-on-error: true

      - name: Upload report artifacts (${{ matrix.target }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.target }}
          path: |
            reports/*.xml
            reports/lcov.info
            reports/jscpd-report.json
            reports/project-health.json
          retention-days: 7

  summarize:
    name: Summarize & comment table
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      all_green: ${{ steps.summarize.outputs.all_green }}
    env:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Build typescript
        run: |
          if ! pnpm run build:ts; then
            echo "::warning::TypeScript workspace build failed during summary job; continuing workflow."
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: false

      # Use your repo’s logic to compute regressions (allows legacy failures)
      - name: Detect regressions
        id: regress
        run: |
          set +e
          set -o pipefail

          # Create reports directory if it doesn't exist
          mkdir -p reports

          # Run the CLI command with explicit paths to the downloaded artifacts
          pnpm run cli generate-quality-report \
            --base report-base \
            --head report-head \
            --merge report-merge \
            --report-file reports/summary-report.md

          code=$?

          if [ $code -eq 0 ]; then
            echo "all_green=true" >> "$GITHUB_OUTPUT"
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 11 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=lint_errors" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 10 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=regressions" >> "$GITHUB_OUTPUT"
          else
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Summarize and comment
        id: summarize
        uses: actions/github-script@v8
        env:
          REGRESSION_ALL_GREEN: ${{ steps.regress.outputs.all_green }}
          REGRESSION_STATUS: ${{ steps.regress.outputs.status }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const MARKER = '<!-- automerge-pr-test-summary -->';
            const reportFile = 'reports/summary-report.md';

            let body = '';
            if (fs.existsSync(reportFile)) {
              body = fs.readFileSync(reportFile, 'utf8');
            } else {
              body = `${MARKER}\n### Quality Report Summary\n\n⚠️ Report generation failed. Check the action logs for details.`;
            }

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) { core.notice('No PR number; skipping comment.'); return; }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

            // Set output for auto-merge gate
            const allGreen = process.env.REGRESSION_ALL_GREEN === 'true';
            core.setOutput('all_green', allGreen ? 'true' : 'false');

      - name: Request Agent help for lint errors
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'lint_errors' && env.GH_USER_TOKEN != '' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- automerge-pr-lint-agent -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.notice('No PR number; skipping Agent lint comment.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            const body = [
              marker,
              '',
              '@mini-max The auto-merge workflow detected lint errors on this PR gate target. Please prioritize lint-error fixes before test regression triage.',
              '',
              'Suggested next steps:',
              '1. Run `pnpm run lint:quiet` and apply deterministic fixes first.',
              '2. Re-run `pnpm run build:ts` and `pnpm run lint:quiet` until lint errors are fully resolved.',
              '',
              `Once done, push fixes to **${pr.head.ref}** on base **${pr.base.ref}** (PR #${number}).`
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            core.notice(`Requested Agent assistance for lint errors on PR #${number}.`);

      - name: Request Agent help for regressions
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'regressions' && env.GH_USER_TOKEN != '' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- automerge-pr-regression-agent -->';
            const FOLLOW_UP_AGENT_POOL = 'followUps';
            const DEFAULT_FOLLOW_UP_AGENT = 'codex';
            const WEIGHT_SCALE = 1000;
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.notice('No PR number; skipping Agent regression comment.');
              return;
            }

            const normalize = (value) => {
              const trimmed = (value || '').trim();
              if (!trimmed) return '';
              return trimmed
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                || '';
            };

            const getRunNumber = () => {
              const raw = (process.env.GITHUB_RUN_NUMBER || '').trim();
              const parsed = Number.parseInt(raw, 10);
              return Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
            };

            const toSlots = (weight) => Math.max(1, Math.round(weight * WEIGHT_SCALE));

            const buildInterleavedCycle = (items) => {
              const maxSlots = Math.max(...items.map((item) => item.slots));
              const cycle = [];
              for (let slot = 1; slot <= maxSlots; slot += 1) {
                for (const item of items) {
                  if (item.slots >= slot) {
                    cycle.push(item);
                  }
                }
              }
              return cycle;
            };

            const chooseDeterministicWeighted = (items, runNumber) => {
              if (items.length === 0) return null;
              const sortedItems = [...items].sort((left, right) => left.slug.localeCompare(right.slug));
              const cycle = buildInterleavedCycle(sortedItems);
              if (cycle.length === 0) return null;
              const cycleIndex = (runNumber - 1) % cycle.length;
              return {
                selected: cycle[cycleIndex],
                cycleIndex,
                cycleLength: cycle.length,
                totalWeight: sortedItems.reduce((sum, item) => sum + item.weight, 0),
              };
            };

            const parseAgentCandidates = (pool) => {
              if (!pool || !Array.isArray(pool.agents)) {
                return [];
              }

              return pool.agents
                .map((agent) => ({
                  name: typeof agent?.name === 'string' ? agent.name : '',
                  weight: Number(agent?.weight),
                }))
                .filter((agent) => agent.name && Number.isFinite(agent.weight) && agent.weight > 0)
                .map((agent) => ({
                  name: agent.name,
                  weight: agent.weight,
                  slug: normalize(agent.name),
                  slots: toSlots(agent.weight),
                }))
                .filter((agent) => agent.slug);
            };

            const loadWeightsConfig = () => {
              const weightsPath = path.resolve(process.cwd(), '.github/workflows/weights.json');
              const raw = fs.readFileSync(weightsPath, 'utf8');
              return JSON.parse(raw);
            };

            const selectAgent = (poolName, requestedAgent) => {
              if (requestedAgent) {
                return {
                  agent: requestedAgent,
                  reason: 'manual override',
                };
              }

              let poolDefault = DEFAULT_FOLLOW_UP_AGENT;
              let candidates = [];
              try {
                const parsed = loadWeightsConfig();
                const pool = parsed?.agentPools?.[poolName] ?? null;
                const configuredDefault = normalize(pool?.default);
                if (configuredDefault) {
                  poolDefault = configuredDefault;
                }
                candidates = parseAgentCandidates(pool);
              } catch (error) {
                core.warning(`Falling back to default follow-up agent due to configuration error: ${error.message}`);
              }

              if (!candidates.length) {
                return {
                  agent: poolDefault,
                  reason: `${poolName} pool default fallback`,
                };
              }

              const runNumber = getRunNumber();
              const chosen = chooseDeterministicWeighted(candidates, runNumber);
              if (!chosen || !chosen.selected) {
                return {
                  agent: poolDefault,
                  reason: `${poolName} deterministic weighted selection fallback`,
                };
              }

              const { slug, name, weight, slots } = chosen.selected;
              const cyclePosition = chosen.cycleIndex + 1;
              core.info(
                `Deterministic weighted selection picked agent "${name}" from ${poolName} pool ` +
                `(slug=${slug}, weight=${weight}, slots=${slots}) for run #${runNumber} ` +
                `at cycle position ${cyclePosition}/${chosen.cycleLength} from total weight ${chosen.totalWeight.toFixed(6)}.`
              );
              return {
                agent: slug,
                reason: `${poolName} deterministic weighted selection`,
              };
            };

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const selection = selectAgent(FOLLOW_UP_AGENT_POOL, '');
            const agentMention = `@${selection.agent}`;
            core.info(`Using follow-up agent "${selection.agent}" (${selection.reason}).`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            const reportFile = 'reports/summary-report.md';
            let regressionSummaryLine = '';
            try {
              const reportBody = fs.readFileSync(reportFile, 'utf8');
              const matchingLine = reportBody
                .split(/\r?\n/u)
                .find((line) => line.trim().startsWith('❌ Test regressions detected.'));
              regressionSummaryLine = matchingLine ? matchingLine.trim() : '';
            } catch (error) {
              if (error?.code !== 'ENOENT') {
                core.warning(`Unable to read regression summary from ${reportFile}: ${error.message}`);
              }
            }

            const lines = [
              marker,
              '',
              `${agentMention} The auto-merge workflow detected test regressions on this PR ` +
                `while comparing the base results with the merged results ` +
                `(or with PR head results when merged results are unavailable). ` +
                "Please review the failing suites, identify the root cause, and provide the fixes so this change can be merged. Do not remove tests or relax performance requirements without a clear, well-reasoned justification, as doing so can harm the overall health of the project.",
            ];

            if (regressionSummaryLine) {
              lines.push('', `Regression summary from the Quality Report: ${regressionSummaryLine}`);
            }

            lines.push(
              '',
              'Suggested next steps:',
              '1. Reproduce the failures locally (for example, `pnpm run test:report` and `pnpm run test:coverage`) to confirm the regression.',
              '2. Deliver the smallest possible fix—or a precise explanation of the required follow-up—that resolves the regression blocking auto-merge.'
            );

            const normalizedAgent = agentMention.replace(/^@/, '').trim().toLowerCase();
            if (normalizedAgent !== 'copilot') {
              lines.push(
                '',
                `Once done, ensure all changes are pushed to remote branch **${pr.head.ref}** on base **${pr.base.ref}** and keep all commits tied to PR #${number}; do not open new branches or PRs. As the final step (even after running 'make_pr'), run the following exact command(s) to guarantee your changes are pushed:`,
                '',
                '```bash',
                `git push "https://github.com/${owner}/${repo}.git" "HEAD:${pr.head.ref}"`,
                '```'
              );
            }

            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

            core.notice(`Requested Agent assistance for regressions on PR #${number}.`);

      - name: Warn when Agent user token missing for lint errors
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'lint_errors' && env.GH_USER_TOKEN == '' }}
        run: |
          echo "::warning::GH_USER_TOKEN secret is not configured; skipping Agent lint comment."

      - name: Warn when Agent user token missing
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'regressions' && env.GH_USER_TOKEN == '' }}
        run: |
          echo "::warning::GH_USER_TOKEN secret is not configured; skipping Agent regression comment."

  auto-merge:
    name: Auto-merge when green
    needs: summarize
    if: ${{ github.event_name == 'pull_request' && needs.summarize.outputs.all_green == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR & wait for mergeability
        id: prepare
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) { core.setOutput('proceed', 'false'); return; }
            const loadPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

            const allowedStates = new Set(['clean','unstable','blocked','has_hooks']);

            let pr = await loadPr();
            if (pr.draft) { core.notice(`Skip merge #${number}: draft.`); core.setOutput('proceed','false'); return; }

            const maxAttempts = 6;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const state = String(pr.mergeable_state || '').toLowerCase();
              const mergeableKnown = pr.mergeable !== null && state && state !== 'unknown';
              if (mergeableKnown) break;

              if (attempt === maxAttempts) {
                core.notice(`Skip merge #${number}: mergeability unresolved after ${maxAttempts} attempts (mergeable=${pr.mergeable}, state=${pr.mergeable_state}).`);
                core.setOutput('proceed','false');
                return;
              }

              core.info(`Mergeability pending for #${number} (attempt ${attempt}/${maxAttempts}): mergeable=${pr.mergeable}, state=${pr.mergeable_state}. Retrying in 5s...`);
              await wait(5000);
              pr = await loadPr();
            }

            const state = String(pr.mergeable_state || '').toLowerCase();
            const ok = pr.mergeable === true && allowedStates.has(state);
            if (!ok) { core.notice(`Skip merge #${number}: mergeable=${pr.mergeable}, state=${pr.mergeable_state}.`); core.setOutput('proceed','false'); return; }

            core.setOutput('proceed','true');
            core.setOutput('pr', JSON.stringify(pr));

      - name: Update PR branch from base (attempt updateBranch, fallback to server-side merge)
        id: update
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const pr = JSON.parse(process.env.PREPARE_PR || '{}');
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const MARKER = '<!-- automerge-branch-update -->';

            const upsert = async (text) => {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
                const existing = comments.find(c => c.body && c.body.includes(MARKER));
                const body = [MARKER, text].join('\n\n');
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
                }
              } catch (err) {
                core.warning(`Failed to upsert branch-update comment: ${err?.message || err}`);
              }
            };

            await upsert('Auto-merge preparing: ensuring PR branch is up-to-date with base branch.');

            try {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number: number });
              await upsert('Requested branch update via GitHub API (pulls.updateBranch). Waiting for the update to apply...');
              core.info('Requested branch update via pulls.updateBranch()');
              await wait(5000);
              core.setOutput('updated','true');
              return;
            } catch (ubErr) {
              const msg = String(ubErr?.message || '').toLowerCase();
              if (msg.includes('already up to date')) {
                core.info('PR branch is already up to date.');
                await upsert('PR branch is already up to date.');
                core.setOutput('updated','true');
                return;
              }
              core.warning(`pulls.updateBranch failed: ${ubErr?.message || ubErr}`);
              await upsert(`pulls.updateBranch failed: ${ubErr?.message || ubErr}. Attempting fallback server-side merge of base into PR branch.`);
            }

            try {
              const baseRef = pr.base.ref;
              const headRef = pr.head.ref;
              core.info(`Attempting server-side merge of base '${baseRef}' into head '${headRef}' via repos.merge()`);
              const { status } = await github.rest.repos.merge({ owner, repo, base: headRef, head: baseRef, commit_message: `chore: sync ${headRef} with ${baseRef}` });
              
              if (status === 204) {
                core.info('PR branch is already up to date (repos.merge returned 204).');
                await upsert('PR branch is already up to date.');
              } else {
                await upsert('Fallback server-side merge performed: base was merged into the PR branch. Waiting for refs to update...');
                await wait(3000);
              }
              core.setOutput('updated','true');
              return;
            } catch (srvErr) {
              const msg = String(srvErr?.message || '').toLowerCase();
              if (msg.includes('nothing to merge') || srvErr.status === 204) {
                 core.info('PR branch is already up to date (repos.merge caught 204/nothing to merge).');
                 await upsert('PR branch is already up to date.');
                 core.setOutput('updated','true');
                 return;
              }
              core.warning(`Server-side repos.merge fallback failed: ${srvErr?.message || srvErr}`);
              await upsert(`Fallback server-side merge failed: ${srvErr?.message || srvErr}. Manual intervention required.`);
              core.setOutput('updated','false');
              core.setOutput('update_error', String(srvErr?.message || srvErr));
              return;
            }
        env:
          PREPARE_PR: ${{ steps.prepare.outputs.pr }}

      - name: Attempt merge
        id: attempt
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash' });
              core.notice(`Auto-merged PR #${number}.`);
              core.setOutput('merged','true');
            } catch (e) {
              core.warning(`Merge attempt failed: ${e?.message || e}`);
              core.setOutput('merged','false');
              core.setOutput('merge_error', String(e?.message || ''));
            }

      - name: Delete head branch (if merged)
        if: ${{ steps.attempt.outputs.merged == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            try {
              const headRef = pr.head?.ref;
              const headRepoFull = pr.head?.repo?.full_name?.toLowerCase() || '';
              const thisFull = `${owner}/${repo}`.toLowerCase();
              if (!headRef || headRepoFull !== thisFull) {
                core.info(`Not deleting branch: different repo or missing ref (head=${headRepoFull}, this=${thisFull}, ref=${headRef}).`);
                return;
              }
              const { data: rinfo } = await github.rest.repos.get({ owner, repo });
              const defaultBranch = rinfo.default_branch;
              if (headRef === defaultBranch) {
                core.info(`Not deleting branch: ${headRef} is the default branch.`);
                return;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
              core.notice(`Deleted branch ${headRef} after merge.`);
            } catch (e) {
              core.warning(`Unable to delete head branch: ${e.message}`);
            }
