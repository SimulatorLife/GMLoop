name: "Auto-merge PRs"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: automerge-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Resolve validation target
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.decide.outputs.should_run_tests }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      merge_sha: ${{ steps.decide.outputs.merge_sha }}
      trusted_ci_changed: ${{ steps.decide.outputs.trusted_ci_changed }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setOutput('should_run_tests', 'false');
              core.setOutput('trusted_ci_changed', 'true');
              return;
            }

            const mergeSha = context.sha;
            const headSha = context.payload.pull_request?.head?.sha;
            const { data: mergeCommit } = await github.rest.repos.getCommit({ owner, repo, ref: mergeSha });
            const baseSha = mergeCommit.parents?.[0]?.sha;
            const mergeHeadSha = mergeCommit.parents?.[1]?.sha;
            if (!baseSha || !headSha || !mergeHeadSha || mergeHeadSha !== headSha) {
              core.setFailed(`Unable to resolve the exact synthetic merge for PR #${number}.`);
              core.setOutput('should_run_tests', 'false');
              core.setOutput('trusted_ci_changed', 'true');
              return;
            }

            const fallbackPolicy = {
              goldenFixturePatterns: [
                '^test/fixtures/.*\\.gml$',
                '^src/parser/test/.*\\.gml$',
                '^src/refactor/test/fixtures/.*\\.gml$',
                '^src/format/test/fixtures/.*\\.gml$',
                '^src/lint/test/.*\\.gml$',
              ],
              trustedCiPatterns: [
                '^\\.github/workflows/.*\\.ya?ml$',
                '^\\.github/actions/',
                '^\\.github/ci/automerge-policy\\.json$',
                '^src/cli/src/commands/ci-report\\.ts$',
                '^src/cli/src/commands/generate-quality-report\\.ts$',
                '^src/cli/src/modules/quality-report/',
                '^src/cli/src/cli-command-registration\\.ts$',
                '^src/cli/src/commands/index\\.ts$',
                '^package\\.json$',
                '^pnpm-lock\\.yaml$',
                '^pnpm-workspace\\.yaml$',
                '^eslint\\.config\\.js$',
                '^\\.nvmrc$',
                '^tsconfig(?:\\..+)?\\.json$',
                '^src/[^/]+/tsconfig\\.json$',
              ],
            };

            let policy = fallbackPolicy;
            let policyFromBase = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/ci/automerge-policy.json',
                ref: baseSha,
              });
              if (!Array.isArray(data) && data.type === 'file' && data.content) {
                policy = JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
                policyFromBase = true;
              }
            } catch (error) {
              core.warning(`Base does not yet provide the auto-merge policy; using the conservative bootstrap policy: ${error.message}`);
            }

            const goldenPatterns = (policy.goldenFixturePatterns || []).map((value) => new RegExp(value, 'u'));
            const trustedPatterns = (policy.trustedCiPatterns || []).map((value) => new RegExp(value, 'u'));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const matches = (filename, patterns) =>
              typeof filename === 'string' && patterns.some((pattern) => pattern.test(filename));

            const changedGoldenFixtures = files.filter((file) => {
              if (file.status === 'added') return false;
              return matches(file.filename, goldenPatterns) || matches(file.previous_filename, goldenPatterns);
            });
            if (changedGoldenFixtures.length > 0) {
              core.setFailed(`Protected golden .gml fixtures cannot be modified, renamed, or removed: ${changedGoldenFixtures.map((file) => file.filename).join(', ')}`);
              core.setOutput('should_run_tests', 'false');
              return;
            }

            const trustedCiChanged = !policyFromBase || files.some((file) =>
              matches(file.filename, trustedPatterns) || matches(file.previous_filename, trustedPatterns));
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);
            core.setOutput('merge_sha', mergeSha);
            core.setOutput('trusted_ci_changed', trustedCiChanged ? 'true' : 'false');
            core.setOutput('should_run_tests', files.length > 0 ? 'true' : 'false');
            core.notice(`Validating base ${baseSha}, head ${headSha}, merge ${mergeSha}; trusted CI changed=${trustedCiChanged}.`);

  base_cache:
    name: Restore trusted base report
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      usable: ${{ steps.restored.outputs.usable }}
      fingerprint: ${{ steps.tooling.outputs.fingerprint }}
      cache_key: ${{ steps.tooling.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Compute trusted-report fingerprint
        id: tooling
        shell: bash
        run: |
          fingerprint="$(sha256sum src/cli/src/commands/ci-report.ts | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_key=automerge-base-report-v6-${{ needs.gate.outputs.base_sha }}-$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore cached base report
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: ${{ steps.tooling.outputs.cache_key }}
      - name: Validate restored base report
        id: restored
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --expected-fingerprint '${{ steps.tooling.outputs.fingerprint }}'
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            rm -rf reports
          fi
          exit 0
      - name: Mark cache miss
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: miss
        run: echo "usable=false" >> "$GITHUB_OUTPUT"
      - name: Expose trusted base report
        if: ${{ steps.restored.outputs.usable == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: report-base
          path: reports
          retention-days: 1

  head_diagnostic:
    name: Head build diagnostic
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - run: pnpm exec tsc -b

  base_build:
    name: Build base fallback and plan tests
    needs: [gate, base_cache]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI command
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: src/cli/src/commands/ci-report.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Restore trusted timing history when available
        uses: actions/cache/restore@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-
      - run: pnpm exec tsc -b
      - name: Stage lean compiled runtime
        run: node .ci-tools/src/cli/src/commands/ci-report.ts stage-compiled --output compiled-runtime
      - name: Create exact base test manifest
        id: plan
        run: node .ci-tools/src/cli/src/commands/ci-report.ts manifest --output test-manifest.json --history .ci-history/test-durations.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: compiled-base-${{ needs.gate.outputs.base_sha }}
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: base-test-plan
          path: test-manifest.json
          retention-days: 1

  base_lint:
    name: Lint base fallback
    needs: [gate, base_cache]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI command
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: src/cli/src/commands/ci-report.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Generate base lint report
        shell: bash
        run: |
          set +e
          node .ci-tools/src/cli/src/commands/ci-report.ts lint --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_tests:
    name: Base tests (${{ matrix.shard }})
    needs: [gate, base_cache, base_build]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' && needs.base_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.base_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - name: Checkout current CI command
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          persist-credentials: false
          sparse-checkout: src/cli/src/commands/ci-report.ts
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          name: compiled-base-${{ needs.gate.outputs.base_sha }}
          path: compiled-runtime
      - uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - run: cp -R compiled-runtime/. .
      - name: Run base test shard
        shell: bash
        run: |
          set +e
          node .ci-tools/src/cli/src/commands/ci-report.ts run-shard \
            --manifest test-manifest.json \
            --shard '${{ matrix.shard }}' \
            --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  base_assemble:
    name: Assemble ephemeral base fallback
    needs: [gate, base_cache, base_build, base_lint, base_tests]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run_tests == 'true' && needs.base_cache.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          pattern: base-report-*
          merge-multiple: true
          path: reports
      - uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - name: Assemble and validate base evidence
        run: |
          node src/cli/src/commands/ci-report.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.base_sha }}' \
            --fingerprint '${{ needs.base_cache.outputs.fingerprint }}' \
            --build-status 0
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.base_sha }}' \
            --expected-fingerprint '${{ needs.base_cache.outputs.fingerprint }}'
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: report-base
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_build:
    name: Build synthetic merge and plan tests
    needs: [gate, base_cache]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Restore trusted timing history
        uses: actions/cache/restore@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-${{ needs.gate.outputs.base_sha }}
          restore-keys: |
            automerge-test-timing-v1-${{ needs.base_cache.outputs.fingerprint }}-
      - run: pnpm exec tsc -b
      - name: Stage lean compiled runtime
        run: node src/cli/src/commands/ci-report.ts stage-compiled --output compiled-runtime
      - name: Download trusted timing history from exact base report when available
        if: ${{ needs.base_cache.outputs.usable == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: report-base
          path: report-base
      - name: Create timing-balanced exact merge manifest
        id: plan
        shell: bash
        run: |
          history=.ci-history/test-durations.json
          if [ -f report-base/test-durations.json ]; then history=report-base/test-durations.json; fi
          node src/cli/src/commands/ci-report.ts manifest \
            --output test-manifest.json \
            --history "$history" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: compiled-merge-${{ needs.gate.outputs.merge_sha }}
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: merge-test-plan
          path: test-manifest.json
          retention-days: 1

  merge_lint:
    name: Lint synthetic merge
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Generate merge lint report
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts lint --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: merge-report-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_tests:
    name: Merge tests (${{ matrix.shard }})
    needs: [gate, merge_build]
    if: ${{ needs.gate.outputs.should_run_tests == 'true' && needs.merge_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.merge_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          name: compiled-merge-${{ needs.gate.outputs.merge_sha }}
          path: compiled-runtime
      - uses: actions/download-artifact@v7
        with:
          name: merge-test-plan
          path: .
      - run: cp -R compiled-runtime/. .
      - name: Run merge test shard
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts run-shard \
            --manifest test-manifest.json \
            --shard '${{ matrix.shard }}' \
            --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: merge-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  merge_assemble:
    name: Assemble synthetic-merge report
    needs: [gate, base_cache, merge_build, merge_lint, merge_tests]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          pattern: merge-report-*
          merge-multiple: true
          path: reports
      - uses: actions/download-artifact@v7
        with:
          name: merge-test-plan
          path: .
      - name: Assemble and validate merge evidence
        run: |
          node src/cli/src/commands/ci-report.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ needs.gate.outputs.merge_sha }}' \
            --fingerprint '${{ needs.base_cache.outputs.fingerprint }}' \
            --build-status 0
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ needs.gate.outputs.merge_sha }}' \
            --expected-fingerprint '${{ needs.base_cache.outputs.fingerprint }}'
      - name: Publish timing profile
        if: ${{ always() && !cancelled() }}
        run: test ! -f reports/test-durations.md || cat reports/test-durations.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: report-merge
          path: reports
          if-no-files-found: error
          retention-days: 1

  validation_complete:
    name: Validation evidence complete
    needs: [gate, base_cache, base_assemble, head_diagnostic, merge_build, merge_lint, merge_tests, merge_assemble]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete comparable evidence
        env:
          SHOULD_RUN: ${{ needs.gate.outputs.should_run_tests }}
          GATE_RESULT: ${{ needs.gate.result }}
          BASE_CACHE_USABLE: ${{ needs.base_cache.outputs.usable }}
          BASE_ASSEMBLE_RESULT: ${{ needs.base_assemble.result }}
          HEAD_RESULT: ${{ needs.head_diagnostic.result }}
          MERGE_BUILD_RESULT: ${{ needs.merge_build.result }}
          MERGE_LINT_RESULT: ${{ needs.merge_lint.result }}
          MERGE_TEST_RESULT: ${{ needs.merge_tests.result }}
          MERGE_ASSEMBLE_RESULT: ${{ needs.merge_assemble.result }}
          TRUSTED_CI_CHANGED: ${{ needs.gate.outputs.trusted_ci_changed }}
        run: |
          if [ "$GATE_RESULT" != success ]; then
            echo "Gate failed."
            exit 1
          fi
          if [ "$SHOULD_RUN" != true ]; then
            exit 0
          fi
          if [ "$BASE_CACHE_USABLE" != true ] && [ "$BASE_ASSEMBLE_RESULT" != success ]; then
            echo "No complete base report was available."
            exit 1
          fi
          for result in "$HEAD_RESULT" "$MERGE_BUILD_RESULT" "$MERGE_LINT_RESULT" "$MERGE_TEST_RESULT" "$MERGE_ASSEMBLE_RESULT"; do
            if [ "$result" != success ]; then
              echo "Synthetic-merge validation component failed: $result"
              exit 1
            fi
          done
          if [ "$TRUSTED_CI_CHANGED" = true ]; then
            echo "::notice::This PR changes trusted CI/evaluation files. Validation may complete, but the trusted finalizer will require human merge."
          fi
