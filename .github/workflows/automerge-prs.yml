name: "Auto-merge PRs"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.decide.outputs.should_run_tests }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      merge_sha: ${{ steps.decide.outputs.merge_sha }}
    steps:
      - id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setOutput('should_run_tests', 'false');
              return;
            }

            const mergeSha = context.sha;
            const headSha = context.payload.pull_request?.head?.sha;
            const { data: mergeCommit } = await github.rest.repos.getCommit({ owner, repo, ref: mergeSha });
            const baseSha = mergeCommit.parents?.[0]?.sha;
            const mergeHeadSha = mergeCommit.parents?.[1]?.sha;
            if (!baseSha || !headSha || !mergeHeadSha || mergeHeadSha !== headSha) {
              core.setFailed(`Unable to resolve a current synthetic merge for PR #${number}. merge=${mergeSha}, base=${baseSha || 'missing'}, eventHead=${headSha || 'missing'}, mergeHead=${mergeHeadSha || 'missing'}`);
              core.setOutput('should_run_tests', 'false');
              return;
            }

            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);
            core.setOutput('merge_sha', mergeSha);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const protectedGoldenFixturePatterns = [
              /^test\/fixtures\/plugin-integration\/.*\.gml$/u,
              /^src\/parser\/test\/input\/.*\.gml$/u,
              /^src\/lint\/test\/fixtures\/.*\.gml$/u,
            ];
            const isProtectedGoldenFixture = (filename) =>
              typeof filename === 'string' &&
              protectedGoldenFixturePatterns.some((pattern) => pattern.test(filename));
            const changedFixtures = files.filter((file) => {
              if (file.status === 'added') return false;
              return isProtectedGoldenFixture(file.filename) || isProtectedGoldenFixture(file.previous_filename);
            });

            if (changedFixtures.length > 0) {
              core.setFailed(`Golden .gml test fixtures cannot be modified or removed! Found: ${changedFixtures.map((file) => file.filename).join(', ')}`);
              return;
            }

            core.notice(`PR changed files: ${files.length}; validating base ${baseSha}, head ${headSha}, merge ${mergeSha}.`);
            core.setOutput('should_run_tests', files.length > 0 ? 'true' : 'false');

  tests:
    needs: gate
    if: ${{ needs.gate.outputs.should_run_tests == 'true' }}
    name: Generate reports (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [base, head, merge]

    steps:
      - name: Resolve ref for ${{ matrix.target }}
        id: ref
        shell: bash
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          MERGE_SHA: ${{ needs.gate.outputs.merge_sha }}
        run: |
          case "${{ matrix.target }}" in
            base) echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT" ;;
            head) echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT" ;;
            merge) echo "ref=$MERGE_SHA" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout (${{ matrix.target }})
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Checkout current CI report tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: .ci-tools
          sparse-checkout: |
            scripts/eslint-checkstyle-formatter.js
            scripts/lint-report.js
            scripts/run-auto-merge-report.js
            scripts/validate-auto-merge-report.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compute report tooling fingerprint
        id: tooling
        shell: bash
        run: |
          files=(
            .ci-tools/scripts/eslint-checkstyle-formatter.js
            .ci-tools/scripts/lint-report.js
            .ci-tools/scripts/run-auto-merge-report.js
            .ci-tools/scripts/validate-auto-merge-report.js
          )
          fingerprint="$({
            for file in "${files[@]}"; do
              logical="${file#.ci-tools/}"
              printf '%s\0' "$logical"
              cat "$file"
              printf '\0'
            done
          } | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_key=automerge-base-report-v4-${{ needs.gate.outputs.base_sha }}-$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore cached base report
        id: base-cache
        if: ${{ matrix.target == 'base' }}
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: ${{ steps.tooling.outputs.cache_key }}

      - name: Stage CI report tooling outside the target checkout
        id: ci-tools
        shell: bash
        env:
          CI_TOOLS_DIR: ${{ runner.temp }}/gmloop-ci-tools
        run: |
          rm -rf "$CI_TOOLS_DIR"
          mkdir -p "$CI_TOOLS_DIR"
          cp .ci-tools/scripts/eslint-checkstyle-formatter.js "$CI_TOOLS_DIR/"
          cp .ci-tools/scripts/lint-report.js "$CI_TOOLS_DIR/"
          cp .ci-tools/scripts/run-auto-merge-report.js "$CI_TOOLS_DIR/"
          cp .ci-tools/scripts/validate-auto-merge-report.js "$CI_TOOLS_DIR/"
          printf '%s\n' '{"type":"module"}' > "$CI_TOOLS_DIR/package.json"
          rm -rf .ci-tools
          echo "dir=$CI_TOOLS_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate restored base report
        id: restored-base
        if: ${{ matrix.target == 'base' && steps.base-cache.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          CI_TOOLS_DIR: ${{ steps.ci-tools.outputs.dir }}
          GMLOOP_REPORT_DIR: reports
          GMLOOP_REPORT_EXPECTED_SHA: ${{ steps.ref.outputs.ref }}
          GMLOOP_REPORT_EXPECTED_TOOL_FINGERPRINT: ${{ steps.tooling.outputs.fingerprint }}
        run: |
          set +e
          node "$CI_TOOLS_DIR/validate-auto-merge-report.js"
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            rm -rf reports
          fi
          exit 0

      - name: Setup pnpm (${{ matrix.target }})
        if: ${{ matrix.target != 'base' || steps.restored-base.outputs.usable != 'true' }}
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node (${{ matrix.target }})
        if: ${{ matrix.target != 'base' || steps.restored-base.outputs.usable != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install deps
        if: ${{ matrix.target != 'base' || steps.restored-base.outputs.usable != 'true' }}
        run: pnpm install --frozen-lockfile --recursive --force

      - name: Generate quality reports (${{ matrix.target }})
        id: report
        if: ${{ matrix.target != 'base' || steps.restored-base.outputs.usable != 'true' }}
        shell: bash
        env:
          CI_TOOLS_DIR: ${{ steps.ci-tools.outputs.dir }}
          GMLOOP_ESLINT_CHECKSTYLE_FORMATTER: ${{ steps.ci-tools.outputs.dir }}/eslint-checkstyle-formatter.js
          GMLOOP_REPORT_TARGET_SHA: ${{ steps.ref.outputs.ref }}
          GMLOOP_REPORT_TOOL_FINGERPRINT: ${{ steps.tooling.outputs.fingerprint }}
        run: |
          set +e
          node "$CI_TOOLS_DIR/run-auto-merge-report.js"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize JUnit report
        if: ${{ always() && !cancelled() && (matrix.target != 'base' || steps.restored-base.outputs.usable != 'true') }}
        shell: bash
        env:
          TEST_STATUS: ${{ steps.report.outputs.exit_code || 'unknown' }}
        run: pnpm -s test:ensure-junit

      - name: Validate generated report
        id: validate
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          CI_TOOLS_DIR: ${{ steps.ci-tools.outputs.dir }}
          GMLOOP_REPORT_DIR: reports
          GMLOOP_REPORT_EXPECTED_SHA: ${{ steps.ref.outputs.ref }}
          GMLOOP_REPORT_EXPECTED_TOOL_FINGERPRINT: ${{ steps.tooling.outputs.fingerprint }}
        run: |
          set +e
          node "$CI_TOOLS_DIR/validate-auto-merge-report.js"
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Save complete base report
        if: >-
          ${{
            always() &&
            !cancelled() &&
            matrix.target == 'base' &&
            steps.base-cache.outputs.cache-hit != 'true' &&
            steps.validate.outputs.complete == 'true'
          }}
        uses: actions/cache/save@v4
        with:
          path: reports
          key: ${{ steps.tooling.outputs.cache_key }}

      - name: Publish test summary (${{ matrix.target }})
        if: ${{ always() && !cancelled() && steps.validate.outputs.complete == 'true' }}
        uses: dorny/test-reporter@v3
        with:
          name: Publish test summary (${{ matrix.target }})
          path: reports/tests.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          use-actions-summary: false

      - name: Upload report artifacts (${{ matrix.target }})
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ matrix.target }}
          path: |
            reports/*.xml
            reports/auto-merge-report.json
            reports/lcov.info
            reports/jscpd-report.json
            reports/project-health.json
          if-no-files-found: warn
          retention-days: 1

  summarize:
    name: Summarize & comment table
    needs: [gate, tests]
    if: >-
      ${{
        always() &&
        needs.gate.result == 'success' &&
        needs.gate.outputs.should_run_tests == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      all_green: ${{ steps.summarize.outputs.all_green }}
    env:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}

    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.merge_sha }}

      - name: Compute report tooling fingerprint
        id: tooling
        shell: bash
        run: |
          files=(
            scripts/eslint-checkstyle-formatter.js
            scripts/lint-report.js
            scripts/run-auto-merge-report.js
            scripts/validate-auto-merge-report.js
          )
          fingerprint="$({
            for file in "${files[@]}"; do
              printf '%s\0' "$file"
              cat "$file"
              printf '\0'
            done
          } | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive --force

      - name: Build CLI
        run: pnpm run ensure:cli

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: report-*
          merge-multiple: false

      - name: Detect regressions
        id: regress
        shell: bash
        env:
          TOOLING_FINGERPRINT: ${{ steps.tooling.outputs.fingerprint }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          MERGE_SHA: ${{ needs.gate.outputs.merge_sha }}
        run: |
          set +e
          set -o pipefail
          mkdir -p reports

          invalid=()
          for target in base head merge; do
            case "$target" in
              base) expected_sha="$BASE_SHA" ;;
              head) expected_sha="$HEAD_SHA" ;;
              merge) expected_sha="$MERGE_SHA" ;;
            esac
            if ! GMLOOP_REPORT_DIR="report-$target" \
              GMLOOP_REPORT_EXPECTED_SHA="$expected_sha" \
              GMLOOP_REPORT_EXPECTED_TOOL_FINGERPRINT="$TOOLING_FINGERPRINT" \
              node scripts/validate-auto-merge-report.js; then
              invalid+=("$target")
            fi
          done

          if [ "${#invalid[@]}" -gt 0 ]; then
            {
              echo '<!-- automerge-pr-test-summary -->'
              echo '### Quality Report Summary'
              echo
              echo '❌ Auto-merge validation could not produce a complete, comparable report set.'
              echo
              echo 'Invalid or incomplete report targets:'
              for target in "${invalid[@]}"; do
                echo "- \`$target\`"
              done
              echo
              echo 'Cancelled runs, synthesized JUnit output, infrastructure failures, stale SHAs, and mismatched reporting-tool versions are treated as CI failures and are never accepted as baseline evidence.'
            } > reports/summary-report.md
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=missing_reports" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm run cli:compiled generate-quality-report \
            --base report-base \
            --head report-head \
            --merge report-merge \
            --report-file reports/summary-report.md
          code=$?

          if [ "$code" -eq 0 ]; then
            echo "all_green=true" >> "$GITHUB_OUTPUT"
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 11 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=lint_errors" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=regressions" >> "$GITHUB_OUTPUT"
          else
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Summarize and comment
        id: summarize
        uses: actions/github-script@v8
        env:
          REGRESSION_ALL_GREEN: ${{ steps.regress.outputs.all_green }}
          REGRESSION_STATUS: ${{ steps.regress.outputs.status }}
        with:
          script: |
            const fs = require('node:fs');
            const MARKER = '<!-- automerge-pr-test-summary -->';
            const reportFile = 'reports/summary-report.md';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;

            let body = `${MARKER}\n### Quality Report Summary\n\n⚠️ Report generation failed. Check the action logs for details.`;
            if (fs.existsSync(reportFile)) body = fs.readFileSync(reportFile, 'utf8');

            if (number) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              }
            }

            core.setOutput('all_green', process.env.REGRESSION_ALL_GREEN === 'true' ? 'true' : 'false');

      - name: Request Agent help for lint errors
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'lint_errors' && env.GH_USER_TOKEN != '' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const marker = '<!-- automerge-pr-lint-agent -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.notice('No PR number; skipping Agent lint comment.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            const body = [
              marker,
              '',
              '@mini-max The auto-merge workflow detected lint errors on this PR gate target. Please prioritize lint-error fixes before test regression triage.',
              '',
              'Suggested next steps:',
              '1. Run `pnpm run lint:quiet` and apply deterministic fixes first.',
              '2. Re-run `pnpm run build:ts` and `pnpm run lint:quiet` until lint errors are fully resolved.',
              '',
              `Once done, push fixes to **${pr.head.ref}** on base **${pr.base.ref}** (PR #${number}).`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            core.notice(`Requested Agent assistance for lint errors on PR #${number}.`);

      - name: Request Agent help for regressions
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'regressions' && env.GH_USER_TOKEN != '' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- automerge-pr-regression-agent -->';
            const FOLLOW_UP_AGENT_POOL = 'followUps';
            const DEFAULT_FOLLOW_UP_AGENT = 'codex';
            const WEIGHT_SCALE = 1000;
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.notice('No PR number; skipping Agent regression comment.');
              return;
            }

            const normalize = (value) => {
              const trimmed = (value || '').trim();
              if (!trimmed) return '';
              return trimmed.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || '';
            };
            const getRunNumber = () => {
              const parsed = Number.parseInt((process.env.GITHUB_RUN_NUMBER || '').trim(), 10);
              return Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
            };
            const toSlots = (weight) => Math.max(1, Math.round(weight * WEIGHT_SCALE));
            const buildInterleavedCycle = (items) => {
              const maxSlots = Math.max(...items.map((item) => item.slots));
              const cycle = [];
              for (let slot = 1; slot <= maxSlots; slot += 1) {
                for (const item of items) {
                  if (item.slots >= slot) cycle.push(item);
                }
              }
              return cycle;
            };
            const parseAgentCandidates = (pool) =>
              Array.isArray(pool?.agents)
                ? pool.agents
                    .map((agent) => ({ name: typeof agent?.name === 'string' ? agent.name : '', weight: Number(agent?.weight) }))
                    .filter((agent) => agent.name && Number.isFinite(agent.weight) && agent.weight > 0)
                    .map((agent) => ({ ...agent, slug: normalize(agent.name), slots: toSlots(agent.weight) }))
                    .filter((agent) => agent.slug)
                : [];
            const selectAgent = () => {
              let poolDefault = DEFAULT_FOLLOW_UP_AGENT;
              let candidates = [];
              try {
                const config = JSON.parse(fs.readFileSync(path.resolve('.github/workflows/weights.json'), 'utf8'));
                const pool = config?.agentPools?.[FOLLOW_UP_AGENT_POOL] ?? null;
                poolDefault = normalize(pool?.default) || poolDefault;
                candidates = parseAgentCandidates(pool);
              } catch (error) {
                core.warning(`Falling back to default follow-up agent due to configuration error: ${error.message}`);
              }
              if (candidates.length === 0) return poolDefault;
              const sorted = [...candidates].sort((left, right) => left.slug.localeCompare(right.slug));
              const cycle = buildInterleavedCycle(sorted);
              return cycle[(getRunNumber() - 1) % cycle.length]?.slug || poolDefault;
            };

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const agentMention = `@${selectAgent()}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            const reportFile = 'reports/summary-report.md';
            let regressionSummaryLine = '';
            try {
              const reportBody = fs.readFileSync(reportFile, 'utf8');
              const matchingLine = reportBody
                .split(/\r?\n/u)
                .find((line) => line.trim().startsWith('❌ Test regressions detected.'));
              regressionSummaryLine = matchingLine ? matchingLine.trim() : '';
            } catch (error) {
              if (error?.code !== 'ENOENT') core.warning(`Unable to read regression summary from ${reportFile}: ${error.message}`);
            }

            const lines = [
              marker,
              '',
              `${agentMention} The auto-merge workflow detected test regressions on this PR while comparing the base results with the merged results (or with PR head results when merged results are unavailable). Please review the failing suites, identify the root cause, and provide the fixes so this change can be merged. Do not remove tests or relax performance requirements without a clear, well-reasoned justification, as doing so can harm the overall health of the project.`,
            ];
            if (regressionSummaryLine) lines.push('', `Regression summary from the Quality Report: ${regressionSummaryLine}`);
            lines.push(
              '',
              'Suggested next steps:',
              '1. Reproduce the failures locally (for example, `pnpm run test:report` and `pnpm run test:coverage`) to confirm the regression.',
              '2. Deliver the smallest possible fix—or a precise explanation of the required follow-up—that resolves the regression blocking auto-merge.'
            );
            if (agentMention.replace(/^@/, '').trim().toLowerCase() !== 'copilot') {
              lines.push(
                '',
                `Once done, ensure all changes are pushed to remote branch **${pr.head.ref}** on base **${pr.base.ref}** and keep all commits tied to PR #${number}; do not open new branches or PRs. As the final step (even after running 'make_pr'), run the following exact command(s) to guarantee your changes are pushed:`,
                '',
                '```bash',
                `git push "https://github.com/${owner}/${repo}.git" "HEAD:${pr.head.ref}"`,
                '```'
              );
            }
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            core.notice(`Requested Agent assistance for regressions on PR #${number}.`);

      - name: Warn when Agent user token missing for lint errors
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'lint_errors' && env.GH_USER_TOKEN == '' }}
        run: echo "::warning::GH_USER_TOKEN secret is not configured; skipping Agent lint comment."

      - name: Warn when Agent user token missing for regressions
        if: ${{ github.event_name == 'pull_request' && steps.regress.outputs.status == 'regressions' && env.GH_USER_TOKEN == '' }}
        run: echo "::warning::GH_USER_TOKEN secret is not configured; skipping Agent regression comment."

  auto-merge:
    name: Auto-merge when green
    needs: [gate, summarize]
    if: ${{ github.event_name == 'pull_request' && needs.summarize.outputs.all_green == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR and verify validation is current
        id: prepare
        uses: actions/github-script@v8
        env:
          VALIDATED_HEAD: ${{ needs.gate.outputs.head_sha }}
          VALIDATED_BASE: ${{ needs.gate.outputs.base_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setOutput('proceed', 'false');
              return;
            }

            const validatedHead = process.env.VALIDATED_HEAD;
            const validatedBase = process.env.VALIDATED_BASE;
            const loadPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let pr = await loadPr();

            if (pr.draft) {
              core.notice(`Skip merge #${number}: draft.`);
              core.setOutput('proceed', 'false');
              return;
            }
            if (pr.head.sha !== validatedHead) {
              core.notice(`Skip merge #${number}: head moved after validation (${validatedHead} -> ${pr.head.sha}).`);
              core.setOutput('proceed', 'false');
              return;
            }

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const state = String(pr.mergeable_state || '').toLowerCase();
              if (pr.mergeable !== null && state && state !== 'unknown') break;
              if (attempt === 6) {
                core.notice(`Skip merge #${number}: mergeability remained unresolved.`);
                core.setOutput('proceed', 'false');
                return;
              }
              await wait(5000);
              pr = await loadPr();
            }

            const state = String(pr.mergeable_state || '').toLowerCase();
            if (pr.mergeable !== true || state === 'dirty') {
              core.notice(`Skip merge #${number}: mergeable=${pr.mergeable}, state=${pr.mergeable_state}.`);
              core.setOutput('proceed', 'false');
              return;
            }

            const { data: baseBranch } = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
            const liveBaseSha = baseBranch.commit.sha;
            core.setOutput('proceed', 'true');
            core.setOutput('pr', JSON.stringify(pr));
            core.setOutput('validated_head', validatedHead);
            core.setOutput('validated_base', validatedBase);
            core.setOutput('live_base', liveBaseSha);

      - name: Ensure PR branch is current with base
        id: update
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        uses: actions/github-script@v8
        env:
          PREPARE_PR: ${{ steps.prepare.outputs.pr }}
          VALIDATED_BASE: ${{ steps.prepare.outputs.validated_base }}
          LIVE_BASE: ${{ steps.prepare.outputs.live_base }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const pr = JSON.parse(process.env.PREPARE_PR || '{}');
            const validatedBase = process.env.VALIDATED_BASE;
            const liveBase = process.env.LIVE_BASE;
            const state = String(pr.mergeable_state || '').toLowerCase();
            const baseAdvanced = Boolean(liveBase && validatedBase && liveBase !== validatedBase);
            const needsUpdate = state === 'behind' || baseAdvanced;

            if (!needsUpdate) {
              core.setOutput('ready_to_merge', 'true');
              return;
            }

            core.notice(`PR #${number} needs a base update before merge (state=${state}, validatedBase=${validatedBase}, liveBase=${liveBase}). Updating the branch and requiring a fresh synchronize validation.`);
            try {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number: number, expected_head_sha: pr.head.sha });
              core.setOutput('ready_to_merge', 'false');
              core.setOutput('revalidation_required', 'true');
              return;
            } catch (updateError) {
              const message = String(updateError?.message || '');
              if (!message.toLowerCase().includes('already up to date')) {
                core.warning(`pulls.updateBranch failed: ${message}`);
              }
            }

            try {
              const { status } = await github.rest.repos.merge({
                owner,
                repo,
                base: pr.head.ref,
                head: pr.base.ref,
                commit_message: `chore: sync ${pr.head.ref} with ${pr.base.ref}`,
              });
              if (status === 204) {
                core.notice(`Updated ${pr.head.ref} from ${pr.base.ref}; fresh validation is required before merge.`);
              }
            } catch (error) {
              core.warning(`Unable to update PR branch: ${error?.message || error}`);
            }
            core.setOutput('ready_to_merge', 'false');
            core.setOutput('revalidation_required', 'true');

      - name: Attempt merge
        id: attempt
        if: ${{ steps.prepare.outputs.proceed == 'true' && steps.update.outputs.ready_to_merge == 'true' }}
        uses: actions/github-script@v8
        env:
          VALIDATED_HEAD: ${{ steps.prepare.outputs.validated_head }}
          VALIDATED_BASE: ${{ steps.prepare.outputs.validated_base }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const validatedHead = process.env.VALIDATED_HEAD;
            const validatedBase = process.env.VALIDATED_BASE;
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const { data: baseBranch } = await github.rest.repos.getBranch({ owner, repo, branch: current.base.ref });
            const liveBaseSha = baseBranch.commit.sha;

            if (current.head.sha !== validatedHead) {
              core.notice(`Skip merge #${number}: head changed after validation (${validatedHead} -> ${current.head.sha}).`);
              core.setOutput('merged', 'false');
              return;
            }
            if (liveBaseSha !== validatedBase) {
              core.notice(`Skip merge #${number}: base changed after validation (${validatedBase} -> ${liveBaseSha}). Requesting a branch update and fresh validation.`);
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: number,
                  expected_head_sha: current.head.sha,
                });
              } catch (error) {
                core.warning(`Unable to update PR #${number} after base advanced: ${error?.message || error}`);
              }
              core.setOutput('merged', 'false');
              return;
            }

            try {
              const response = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: number,
                merge_method: 'squash',
                sha: validatedHead,
              });
              if (response.data.merged) {
                core.notice(`Auto-merged PR #${number}.`);
                core.setOutput('merged', 'true');
              } else {
                core.warning(`Merge rejected for PR #${number}: ${response.data.message}`);
                core.setOutput('merged', 'false');
              }
            } catch (error) {
              core.warning(`Merge attempt failed: ${error?.message || error}`);
              core.setOutput('merged', 'false');
            }

      - name: Delete head branch (if merged)
        if: ${{ steps.attempt.outputs.merged == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const headRef = pr.head?.ref;
            const headRepo = pr.head?.repo?.full_name?.toLowerCase() || '';
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            if (!headRef || headRepo !== thisRepo) return;

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            if (headRef === repoInfo.default_branch) return;

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
              core.notice(`Deleted branch ${headRef} after merge.`);
            } catch (error) {
              core.warning(`Unable to delete head branch: ${error.message}`);
            }
