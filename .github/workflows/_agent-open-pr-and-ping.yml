name: "Agent - Open PR and Ping"

on:
  workflow_call:
    inputs:
      pr_title:
        required: true
        type: string
      prompt:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: "main"
      author_name:
        required: false
        type: string
        default: ${{ vars.GH_USER_NAME }}
      author_email:
        required: false
        type: string
        default: ${{ vars.GH_USER_EMAIL }}
      agent:
        required: false
        type: string
        default: "" # Optional override; blank => deterministic scheduled-agent selection
    outputs:
      pr_number:
        value: ${{ jobs.open_and_ping.outputs.pr_number }}
      branch:
        value: ${{ jobs.open_and_ping.outputs.branch }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open_and_ping:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ fromJSON(steps.pr.outputs.result).number }}
      branch: ${{ env.BRANCH_NAME }}
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      BASE_BRANCH: ${{ inputs.base_branch }}
      REQUESTED_AGENT: ${{ inputs.agent }}
      BRANCH_SUFFIX: ${{ format('task-{0}-{1}', github.run_id, github.run_attempt) }}
      AGENT: ${{ inputs.agent }}
      BRANCH_NAME: ""

    steps:
      - name: Validate GH_USER_TOKEN
        run: |
          set -e
          test -n "${GH_USER_TOKEN}" || { echo "GH_USER_TOKEN is empty"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GH_USER_TOKEN}" https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "Token cannot access /user (HTTP $code). Check scopes, repo access, and SSO."; exit 1;
          fi
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}

      - name: Checkout (with your token so pushes are yours)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_USER_TOKEN }}

      - name: Select agent (deterministic weighted)
        id: select_agent
        uses: actions/github-script@v8
        env:
          REQUESTED_AGENT: ${{ env.REQUESTED_AGENT }}
          BRANCH_SUFFIX: ${{ env.BRANCH_SUFFIX }}
          WEIGHTS_PATH: .github/workflows/weights.json
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const WEIGHT_SCALE = 1000;

            const normalize = (value) => {
              const trimmed = (value || '').trim();
              if (!trimmed) return '';
              return trimmed
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                || '';
            };

            const ensureBranchSuffix = () => {
              const fromEnv = (process.env.BRANCH_SUFFIX || '').trim();
              if (fromEnv) return fromEnv;
              return `task-${Date.now()}`;
            };

            const getRunNumber = () => {
              const raw = (process.env.GITHUB_RUN_NUMBER || '').trim();
              const parsed = Number.parseInt(raw, 10);
              return Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
            };

            const toSlots = (weight) => Math.max(1, Math.round(weight * WEIGHT_SCALE));

            const buildInterleavedCycle = (items) => {
              const maxSlots = Math.max(...items.map((item) => item.slots));
              const cycle = [];
              for (let slot = 1; slot <= maxSlots; slot += 1) {
                for (const item of items) {
                  if (item.slots >= slot) {
                    cycle.push(item);
                  }
                }
              }
              return cycle;
            };

            const chooseDeterministicWeighted = (items, runNumber) => {
              if (items.length === 0) return null;
              const sortedItems = [...items].sort((left, right) => left.slug.localeCompare(right.slug));
              const cycle = buildInterleavedCycle(sortedItems);
              if (cycle.length === 0) return null;
              const cycleIndex = (runNumber - 1) % cycle.length;
              return {
                selected: cycle[cycleIndex],
                cycleIndex,
                cycleLength: cycle.length,
                totalWeight: sortedItems.reduce((sum, item) => sum + item.weight, 0),
              };
            };

            const loadWeightsConfig = () => {
              const weightsPath = path.resolve(process.cwd(), process.env.WEIGHTS_PATH || '.github/workflows/weights.json');
              const raw = fs.readFileSync(weightsPath, 'utf8');
              return JSON.parse(raw);
            };

            const parseScheduledAgentCandidates = (agents) => {
              if (!Array.isArray(agents)) {
                throw new Error('weights.json must define a top-level agents array.');
              }

              const seenNames = new Set();
              const candidates = [];

              for (const [index, agent] of agents.entries()) {
                const name = typeof agent?.name === 'string' ? agent.name.trim() : '';
                const weight = Number(agent?.weight);
                const rawCadenceTicks = agent?.cadenceTicks;
                const cadenceTicks = rawCadenceTicks === undefined ? 1 : Number(rawCadenceTicks);

                if (!name) {
                  throw new Error(`agents[${index}] must define a non-empty name.`);
                }

                if (seenNames.has(name)) {
                  throw new Error(`Scheduled agent names must be unique. Duplicate: ${name}`);
                }
                seenNames.add(name);

                if (!Number.isFinite(weight)) {
                  throw new Error(`agents[${index}].weight must be a finite number.`);
                }

                if (rawCadenceTicks !== undefined && (!Number.isInteger(cadenceTicks) || cadenceTicks <= 0)) {
                  throw new Error(`agents[${index}].cadenceTicks must be a positive integer.`);
                }

                if (weight <= 0) {
                  continue;
                }

                const slug = normalize(name);
                if (!slug) {
                  continue;
                }

                candidates.push({
                  name,
                  weight,
                  slug,
                  slots: toSlots(weight),
                });
              }

              return candidates;
            };

            const selectAgent = (requestedAgent) => {
              if (requestedAgent) {
                return {
                  agent: requestedAgent,
                  reason: 'manual override',
                };
              }

              const parsed = loadWeightsConfig();
              const candidates = parseScheduledAgentCandidates(parsed?.agents);

              if (candidates.length === 0) {
                throw new Error('No positive-weight scheduled agents are configured for blank manual dispatch.');
              }

              const runNumber = getRunNumber();
              const chosen = chooseDeterministicWeighted(candidates, runNumber);
              if (!chosen || !chosen.selected) {
                throw new Error('Unable to compute deterministic scheduled-agent selection.');
              }

              const { slug, name, weight, slots } = chosen.selected;
              const cyclePosition = chosen.cycleIndex + 1;
              core.info(
                `Deterministic weighted selection picked scheduled agent "${name}" ` +
                `(slug=${slug}, weight=${weight}, slots=${slots}) for run #${runNumber} ` +
                `at cycle position ${cyclePosition}/${chosen.cycleLength} from total weight ${chosen.totalWeight.toFixed(6)}.`
              );
              return {
                agent: slug,
                reason: 'scheduled deterministic weighted selection',
              };
            };

            const requested = normalize(process.env.REQUESTED_AGENT);
            const suffix = ensureBranchSuffix();

            const finalize = (agent, reason) => {
              const agentSlug = agent;
              const branchName = `${agentSlug}/${suffix}`;

              core.info(`Using agent "${agentSlug}" (${reason}). Branch name: ${branchName}`);

              core.exportVariable('AGENT', agentSlug);
              core.exportVariable('BRANCH_NAME', branchName);
              core.setOutput('agent', agentSlug);
              core.setOutput('branch', branchName);
            };

            const selection = selectAgent(requested);
            finalize(selection.agent, selection.reason);

      - name: Create empty commit on new branch (from latest base)
        run: |
          # Prefer user-provided identity; otherwise leave Git defaults (will still push with your PAT)
          if [ -n "${AUTHOR_NAME}" ]; then git config user.name  "${AUTHOR_NAME}"; fi
          if [ -n "${AUTHOR_EMAIL}" ]; then git config user.email "${AUTHOR_EMAIL}"; fi

          git fetch origin "$BASE_BRANCH"
          git switch -c "$BRANCH_NAME" "origin/$BASE_BRANCH"

          git commit --allow-empty -m "${{ inputs.pr_title }}"
          git push -u origin "$BRANCH_NAME"
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_EMAIL: ${{ inputs.author_email }}

      - name: Open PR (authored by your user)
        id: pr
        uses: actions/github-script@v8
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PROMPT: ${{ inputs.prompt }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          STANDARD_BODY: "Seed PR to request agent to implement a requested improvement."
        with:
          github-token: ${{ secrets.GH_USER_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: process.env.PR_TITLE,
              head:  process.env.BRANCH_NAME,
              base:  process.env.BASE_BRANCH,
              body:  process.env.STANDARD_BODY,
              maintainer_can_modify: true,
            });
            return {
              number: pr.number,
              head_sha: pr.head.sha,
            };

      - name: (Optional) Label the PR (as your user)
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ fromJSON(steps.pr.outputs.result).number }}
          AGENT: ${{ env.AGENT }}
        with:
          github-token: ${{ secrets.GH_USER_TOKEN }}
          script: |
            try {
              const agent = ((process.env.AGENT || '').trim() || 'copilot').toLowerCase();
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                labels: [agent],
              });
            } catch (e) {
              core.info('Label add skipped: ' + e.message);
            }

      - name: Comment to trigger AI agent (as your user)
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          PROMPT: ${{ inputs.prompt }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          PR_NUMBER: ${{ fromJSON(steps.pr.outputs.result).number }}
          HEAD_SHA: ${{ fromJSON(steps.pr.outputs.result).head_sha }}
          AGENT: ${{ env.AGENT }}
        with:
          github-token: ${{ secrets.GH_USER_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const branch = process.env.BRANCH_NAME;
            const agent = (process.env.AGENT || '').trim() || 'copilot';
            const mention = `@${agent}`;

            const preInstruction = "Start a new task: briefly survey the codebase before narrowing to this task.";
            const postInstruction = "Ensure changes are self-contained, tested, and documented as needed, with no reduction in test coverage or test regressions. For tests, ensure any newly added tests pass and that tests or suites already passing at the start of the task remain passing; unrelated pre-existing failures may remain if your changes do not cause them. Run `pnpm run build:ts` and `pnpm run lint:quiet`, fix any issues properly, and finish with both passing. Do not modify golden `.gml` fixtures or add compatibility shims. All changes must align with and not violate the architectural guidelines defined in `docs/target-state.md`. Ensure the diff is minimal, readable, and well-commented; never sacrifice clarity for cleverness. There is no time constraint or specific allotted time for this task; prioritize quality and correctness over speed and take as much time as needed. You may **NOT** respond with \"no issues found\", \"didn't find any major issues\", or similar—if no obvious implementation exists, choose the most plausible area and apply a singular, safe improvement.";
            const lines = [
              `${mention} ${preInstruction} ${process.env.PROMPT} ${postInstruction}`,
              ""
            ];

            if (agent === 'codex') {
              lines.push(
                `Once done, ensure all changes are pushed to remote branch **${branch}** on base **${process.env.BASE_BRANCH}** and keep all commits tied to PR #${prNumber}; do not open new branches or PRs. As the final step (even after running 'make_pr'), run the following exact command(s) to guarantee your changes are pushed:`,
                "",
                "```bash",
                `git push "https://github.com/${owner}/${repo}.git" "HEAD:${branch}"`,
                "```",
                ""
              );
            }

            const body = lines.join("\n");

            await github.rest.issues.createComment({ 
              owner, 
              repo, 
              issue_number: prNumber, 
              body 
            });
