name: "Cache auto-merge base report"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: automerge-base-report
  cancel-in-progress: false

jobs:
  cache_state:
    name: Restore trusted base evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      usable: ${{ steps.validate.outputs.usable }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      shard_count: ${{ steps.policy.outputs.shard_count }}
      shard_watchdog_ms: ${{ steps.policy.outputs.shard_watchdog_ms }}
      command_watchdog_ms: ${{ steps.policy.outputs.command_watchdog_ms }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: fingerprint
        run: node src/cli/src/commands/ci-automerge-evidence.ts fingerprint --github-output "$GITHUB_OUTPUT"
      - id: policy
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const p = require('./.github/ci/automerge-policy.json');
          console.log(`shard_count=${p.testShardCount}`);
          console.log(`shard_watchdog_ms=${p.shardWatchdogMs}`);
          console.log(`command_watchdog_ms=${p.commandWatchdogMs}`);
          NODE
      - id: exact
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports
          key: automerge-base-v8-${{ github.sha }}-${{ steps.fingerprint.outputs.fingerprint }}
      - id: validate
        shell: bash
        run: |
          if [ '${{ steps.exact.outputs.cache-hit }}' != true ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node src/cli/src/commands/ci-automerge-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ github.sha }}' \
            --expected-fingerprint '${{ steps.fingerprint.outputs.fingerprint }}'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf reports
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Build main and plan tests
    needs: cache_state
    if: ${{ needs.cache_state.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build_succeeded: ${{ steps.build.outputs.succeeded }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - id: build
        uses: ./.github/actions/run-automerge-validation
        with:
          mode: build
          evidence-tool: src/cli/src/commands/ci-automerge-evidence.ts
          report-dir: build
          timeout-ms: ${{ needs.cache_state.outputs.command_watchdog_ms }}
          target-sha: ${{ github.sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: base-build-evidence, path: build, retention-days: 1 }
      - name: Restore timing history
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-history
          key: automerge-timing-v3-${{ needs.cache_state.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            automerge-timing-v3-${{ needs.cache_state.outputs.fingerprint }}-
      - name: Stage compiled runtime
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: node src/cli/src/commands/ci-automerge-evidence.ts stage-compiled --output compiled-runtime
      - id: plan
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        run: |
          node src/cli/src/commands/ci-automerge-evidence.ts manifest \
            --output test-manifest.json \
            --history .ci-history/test-durations.json \
            --shards '${{ needs.cache_state.outputs.shard_count }}' \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with: { name: compiled-base, path: compiled-runtime, retention-days: 1 }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        with: { name: base-test-plan, path: test-manifest.json, retention-days: 1 }

  lint:
    name: Lint main
    needs: [cache_state, prepare]
    if: ${{ needs.cache_state.outputs.usable != 'true' && needs.prepare.outputs.build_succeeded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: ./.github/actions/run-automerge-validation
        with:
          mode: lint
          evidence-tool: src/cli/src/commands/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.cache_state.outputs.command_watchdog_ms }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with: { name: base-lint, path: reports, if-no-files-found: error, retention-days: 1 }

  tests:
    name: Base tests (${{ matrix.shard }})
    needs: [cache_state, prepare]
    if: ${{ needs.cache_state.outputs.usable != 'true' && needs.prepare.outputs.build_succeeded == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: compiled-base, path: compiled-runtime }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-test-plan, path: . }
      - run: cp -R compiled-runtime/. .
      - uses: ./.github/actions/run-automerge-validation
        with:
          mode: test
          evidence-tool: src/cli/src/commands/ci-automerge-evidence.ts
          report-dir: reports
          timeout-ms: ${{ needs.cache_state.outputs.shard_watchdog_ms }}
          manifest: test-manifest.json
          shard: ${{ matrix.shard }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: base-test-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and cache trusted main evidence
    needs: [cache_state, prepare, lint, tests]
    if: ${{ always() && needs.cache_state.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-build-evidence, path: build }
      - name: Package build-only or full evidence
        run: |
          mkdir -p reports
          cp build/build-evidence.json reports/build-evidence.json
          if [ '${{ needs.prepare.outputs.build_succeeded }}' = true ]; then
            test '${{ needs.lint.result }}' = success
            test '${{ needs.tests.result }}' = success
          fi
      - name: Download lint evidence
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-lint, path: reports }
      - name: Download test evidence
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: base-test-shard-*
          merge-multiple: true
          path: reports
      - name: Download test plan
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: base-test-plan, path: . }
      - name: Assemble full report
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        run: |
          node src/cli/src/commands/ci-automerge-evidence.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ github.sha }}' \
            --fingerprint '${{ needs.cache_state.outputs.fingerprint }}'
      - name: Validate evidence
        run: |
          node src/cli/src/commands/ci-automerge-evidence.ts validate \
            --report-dir reports \
            --expected-sha '${{ github.sha }}' \
            --expected-fingerprint '${{ needs.cache_state.outputs.fingerprint }}'
      - name: Save exact immutable base evidence
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports
          key: automerge-base-v8-${{ github.sha }}-${{ needs.cache_state.outputs.fingerprint }}
      - name: Save complete ancestor baseline
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports
          key: automerge-baseline-v2-${{ needs.cache_state.outputs.fingerprint }}-${{ github.sha }}
      - name: Stage timing cache
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        run: |
          mkdir -p .ci-history
          cp reports/test-durations.json .ci-history/test-durations.json
      - name: Save timing history
        if: ${{ needs.prepare.outputs.build_succeeded == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-history
          key: automerge-timing-v3-${{ needs.cache_state.outputs.fingerprint }}-${{ github.sha }}
