name: "Cache auto-merge base report"

on:
  push:
    branches: [main, master, mainline]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: automerge-base-report-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cache_state:
    name: Restore trusted base report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      usable: ${{ steps.restored.outputs.usable }}
      fingerprint: ${{ steps.tooling.outputs.fingerprint }}
      cache_key: ${{ steps.tooling.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Compute report tooling fingerprint
        id: tooling
        shell: bash
        run: |
          fingerprint="$(sha256sum src/cli/src/commands/ci-report.ts | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_key=automerge-base-report-v6-${{ github.sha }}-$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore existing trusted base report
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: ${{ steps.tooling.outputs.cache_key }}
      - name: Validate restored trusted base report
        id: restored
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ github.sha }}' \
            --expected-fingerprint '${{ steps.tooling.outputs.fingerprint }}'
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Delete invalid immutable cache entry
        if: ${{ steps.cache.outputs.cache-hit == 'true' && steps.restored.outputs.usable != 'true' }}
        uses: actions/github-script@v8
        env:
          CACHE_KEY: ${{ steps.tooling.outputs.cache_key }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.request('DELETE /repos/{owner}/{repo}/actions/caches', {
              owner,
              repo,
              key: process.env.CACHE_KEY,
              ref: context.ref,
            });
            core.notice(`Deleted invalid cache ${process.env.CACHE_KEY}.`);
      - name: Remove invalid restored files
        if: ${{ steps.cache.outputs.cache-hit == 'true' && steps.restored.outputs.usable != 'true' }}
        run: rm -rf reports
      - name: Mark cache miss
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: miss
        run: echo "usable=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build default branch and plan tests
    needs: cache_state
    if: ${{ needs.cache_state.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Restore prior trusted timing history
        uses: actions/cache/restore@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.cache_state.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            automerge-test-timing-v1-${{ needs.cache_state.outputs.fingerprint }}-
      - run: pnpm exec tsc -b
      - run: node src/cli/src/commands/ci-report.ts stage-compiled --output compiled-runtime
      - name: Create timing-balanced canonical manifest
        id: plan
        run: |
          node src/cli/src/commands/ci-report.ts manifest \
            --output test-manifest.json \
            --history .ci-history/test-durations.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: compiled-base-${{ github.sha }}
          path: compiled-runtime
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: base-test-plan
          path: test-manifest.json
          retention-days: 1

  lint:
    name: Lint default branch
    needs: cache_state
    if: ${{ needs.cache_state.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - name: Generate lint report
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts lint --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-lint
          path: reports
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Base tests (${{ matrix.shard }})
    needs: [cache_state, build]
    if: ${{ needs.cache_state.outputs.usable != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          name: compiled-base-${{ github.sha }}
          path: compiled-runtime
      - uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - run: cp -R compiled-runtime/. .
      - name: Run test shard
        shell: bash
        run: |
          set +e
          node src/cli/src/commands/ci-report.ts run-shard \
            --manifest test-manifest.json \
            --shard '${{ matrix.shard }}' \
            --report-dir reports
          exit 0
      - uses: actions/upload-artifact@v6
        if: ${{ always() && !cancelled() }}
        with:
          name: base-report-${{ matrix.shard }}
          path: reports
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and cache trusted base report
    needs: [cache_state, build, lint, tests]
    if: ${{ always() && !cancelled() && needs.cache_state.outputs.usable != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --recursive --force
      - uses: actions/download-artifact@v7
        with:
          pattern: base-report-*
          merge-multiple: true
          path: reports
      - uses: actions/download-artifact@v7
        with:
          name: base-test-plan
          path: .
      - name: Assemble trusted base report
        run: |
          node src/cli/src/commands/ci-report.ts assemble \
            --manifest test-manifest.json \
            --report-dir reports \
            --target-sha '${{ github.sha }}' \
            --fingerprint '${{ needs.cache_state.outputs.fingerprint }}' \
            --build-status 0
          node src/cli/src/commands/ci-report.ts validate \
            --report-dir reports \
            --expected-sha '${{ github.sha }}' \
            --expected-fingerprint '${{ needs.cache_state.outputs.fingerprint }}'
      - name: Save trusted base report
        uses: actions/cache/save@v4
        with:
          path: reports
          key: ${{ needs.cache_state.outputs.cache_key }}
      - name: Save timing history for future balancing
        shell: bash
        run: |
          mkdir -p .ci-history
          cp reports/test-durations.json .ci-history/test-durations.json
      - uses: actions/cache/save@v4
        with:
          path: .ci-history
          key: automerge-test-timing-v1-${{ needs.cache_state.outputs.fingerprint }}-${{ github.sha }}
      - name: Publish timing summary
        run: test ! -f reports/test-durations.md || cat reports/test-durations.md >> "$GITHUB_STEP_SUMMARY"
