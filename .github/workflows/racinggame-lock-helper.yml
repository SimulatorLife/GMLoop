name: Temporary RacingGame lockfile helper

on:
  push:
    branches:
      - agent/racinggame-lockfile-helper

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write RacingGame dependency manifest
        shell: bash
        run: |
          mkdir -p /tmp/racinggame-lock
          cat > /tmp/racinggame-lock/package.json <<'JSON'
          {
            "name": "racinggame-lock-helper",
            "private": true,
            "packageManager": "pnpm@10.32.1",
            "dependencies": {
              "cannon-es": "^0.20.0",
              "pixi.js": "^8.19.0",
              "three": "^0.185.1"
            },
            "devDependencies": {
              "@eslint/compat": "^1.2.9",
              "@eslint/js": "^9.28.0",
              "@playwright/test": "^1.55.0",
              "@types/node": "^24.10.1",
              "@types/three": "^0.185.1",
              "@vitest/eslint-plugin": "^1.6.24",
              "eslint": "^9.28.0",
              "eslint-config-prettier": "^10.1.5",
              "eslint-import-resolver-typescript": "^4.4.3",
              "eslint-plugin-boundaries": "^7.2.0",
              "eslint-plugin-de-morgan": "^2.0.0",
              "eslint-plugin-eslint-comments": "^3.2.0",
              "eslint-plugin-import-x": "^4.15.1",
              "eslint-plugin-no-secrets": "^2.2.1",
              "eslint-plugin-playwright": "^2.11.0",
              "eslint-plugin-promise": "^7.2.1",
              "eslint-plugin-regexp": "^3.1.1",
              "eslint-plugin-security": "^4.0.0",
              "eslint-plugin-simple-import-sort": "^13.0.0",
              "eslint-plugin-sonarjs": "^3.0.5",
              "eslint-plugin-unicorn": "^62.0.0",
              "eslint-plugin-unused-imports": "^4.1.4",
              "globals": "^17.0.0",
              "husky": "^9.1.7",
              "jsdom": "^29.1.1",
              "lsp-mcp-server": "^1.1.20",
              "prettier": "^3.5.3",
              "stylelint": "^17.14.1",
              "stylelint-config-recess-order": "^7.7.0",
              "stylelint-config-standard": "^40.0.0",
              "stylelint-high-performance-animation": "^2.0.0",
              "stylelint-order": "^8.1.1",
              "stylelint-plugin-defensive-css": "^2.9.4",
              "stylelint-value-no-unknown-custom-properties": "^6.1.1",
              "typescript": "^7.0.2",
              "typescript-eslint": "^8.34.0",
              "typescript-js": "npm:typescript@5.9.3",
              "typescript-language-server": "^5.3.0",
              "vite": "^8.1.5",
              "vitest": "^4.1.10"
            },
            "pnpm": {
              "onlyBuiltDependencies": ["fsevents", "unrs-resolver"],
              "overrides": {
                "cannon-es": "0.20.0",
                "pixi.js": "8.19.0",
                "three": "0.185.1",
                "@eslint/compat": "1.4.1",
                "@eslint/js": "9.39.5",
                "@playwright/test": "1.62.1",
                "@types/node": "24.13.3",
                "@types/three": "0.185.3",
                "@vitest/eslint-plugin": "1.6.24",
                "eslint": "9.39.5",
                "eslint-config-prettier": "10.1.8",
                "eslint-import-resolver-typescript": "4.4.5",
                "eslint-plugin-boundaries": "7.2.0",
                "eslint-plugin-de-morgan": "2.1.3",
                "eslint-plugin-eslint-comments": "3.2.0",
                "eslint-plugin-import-x": "4.17.1",
                "eslint-plugin-no-secrets": "2.3.3",
                "eslint-plugin-playwright": "2.11.0",
                "eslint-plugin-promise": "7.3.0",
                "eslint-plugin-regexp": "3.1.1",
                "eslint-plugin-security": "4.0.1",
                "eslint-plugin-simple-import-sort": "13.0.0",
                "eslint-plugin-sonarjs": "3.0.7",
                "eslint-plugin-unicorn": "62.0.0",
                "eslint-plugin-unused-imports": "4.4.1",
                "globals": "17.9.0",
                "husky": "9.1.7",
                "jsdom": "29.1.1",
                "lsp-mcp-server": "1.1.20",
                "prettier": "3.9.6",
                "stylelint": "17.14.1",
                "stylelint-config-recess-order": "7.7.0",
                "stylelint-config-standard": "40.0.0",
                "stylelint-high-performance-animation": "2.0.0",
                "stylelint-order": "8.1.1",
                "stylelint-plugin-defensive-css": "2.9.6",
                "stylelint-value-no-unknown-custom-properties": "6.1.1",
                "typescript-eslint": "8.66.0",
                "typescript-language-server": "5.3.0",
                "vite": "8.2.0",
                "vitest": "4.1.10",
                "@rolldown/binding-darwin-arm64": "1.2.2",
                "@rolldown/binding-darwin-x64": "1.2.2",
                "@typescript/typescript-darwin-arm64": "7.0.2",
                "@typescript/typescript-darwin-x64": "7.0.2"
              }
            },
            "optionalDependencies": {
              "@rolldown/binding-darwin-arm64": "^1.2.0",
              "@rolldown/binding-darwin-x64": "^1.1.5",
              "@typescript/typescript-darwin-arm64": "^7.0.2",
              "@typescript/typescript-darwin-x64": "^7.0.2"
            }
          }
          JSON

      - name: Activate RacingGame pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Generate lockfile
        working-directory: /tmp/racinggame-lock
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: racinggame-pnpm-lock
          path: /tmp/racinggame-lock/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
