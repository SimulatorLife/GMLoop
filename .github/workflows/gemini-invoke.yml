name: '▶️ Gemini Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@gemini') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: gemini
      agent_package: ${{ vars.GEMINI_CLI_PACKAGE || '@google/gemini-cli@latest' }}
      max_agent_retries: ${{ fromJSON(vars.GEMINI_AGENT_MAX_RETRIES || '1') }}
      validate_local_endpoint: false
      agent_setup_command: |
        set -euo pipefail

        if [ -z "${API_KEY:-}" ]; then
          echo "❌ Missing GEMINI_API_KEY secret (mapped to API_KEY)."
          exit 1
        fi

        if ! command -v gemini >/dev/null 2>&1; then
          echo "❌ Gemini CLI is not available after install step."
          exit 1
        fi

        export GEMINI_API_KEY="${API_KEY}"
        default_ci_model="${GEMINI_CI_MODEL:-gemini-2.5-flash-lite}"

        configured_model=""
        if [ -f .gemini/settings.json ] && command -v jq >/dev/null 2>&1; then
          configured_model="$({
            jq -er '.model.name | select(type == "string" and length > 0)' .gemini/settings.json
          } 2>/dev/null || true)"
        fi

        effective_model="${default_ci_model}"
        if [ -n "${configured_model}" ]; then
          if [[ "${configured_model}" =~ (preview|experimental|latest) ]]; then
            echo "Configured model '${configured_model}' is preview/experimental. Using stable CI model: ${default_ci_model}"
          else
            effective_model="${configured_model}"
          fi
        else
          echo "No explicit .gemini/settings.json model.name found; using stable CI model: ${default_ci_model}"
        fi

        echo "GEMINI_MODEL=${effective_model}" >> "$GITHUB_ENV"
        echo "Using Gemini model for CI: ${effective_model}"
      agent_command: |
        set -euo pipefail

        if [ -z "${ADDITIONAL_CONTEXT:-}" ]; then
          echo "❌ Missing prompt context from PR comment."
          exit 1
        fi

        if ! command -v gemini >/dev/null 2>&1; then
          echo "❌ Gemini CLI is not installed."
          exit 1
        fi

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${API_KEY}"
        export GEMINI_MODEL="${GEMINI_MODEL:-gemini-2.5-flash-lite}"

        if [ -z "${AGENT_TASK_PROMPT:-}" ]; then
          echo "❌ Missing shared AGENT_TASK_PROMPT from parent workflow."
          exit 1
        fi

        REPOSITORY_ROOT="$(pwd)"
        GEMINI_AGENT_PROMPT="$(printf 'Repository root: %s\n\n%s\n\nUser task from PR comment:\n%s\n' "${REPOSITORY_ROOT}" "${AGENT_TASK_PROMPT}" "${ADDITIONAL_CONTEXT}")"
        export 
        
        echo "=== Gemini policies ==="
        find ~/.gemini/policies -maxdepth 1 -type f -name '*.toml' -print -exec sed -n '1,220p' {} \; 2>/dev/null || true

        echo "=== Linux admin policies ==="
        find /etc/gemini-cli/policies -maxdepth 1 -type f -name '*.toml' -print -exec sed -n '1,220p' {} \; 2>/dev/null || true

        max_api_attempts="${GEMINI_API_MAX_ATTEMPTS:-4}"
        if ! [[ "${max_api_attempts}" =~ ^[0-9]+$ ]] || [ "${max_api_attempts}" -lt 1 ]; then
          echo "❌ GEMINI_API_MAX_ATTEMPTS must be a positive integer."
          exit 1
        fi

        attempt=1
        while [ "${attempt}" -le "${max_api_attempts}" ]; do
          set +e
          stdbuf -oL -eL gemini \
            --approval-mode=yolo \
            --policy=.gemini/policy \
            --skip-trust \
            --model "${GEMINI_MODEL}" \
            --prompt "${GEMINI_AGENT_PROMPT}" 2>&1 | tee "$RUNNER_TEMP/gemini.log"
          gemini_status="${PIPESTATUS[0]}"
          set -e

          if [ "${gemini_status}" -eq 0 ]; then
            break
          fi

          if ! grep -Eiq '(RESOURCE_EXHAUSTED|429|quota exceeded|rate.?limit)' "$RUNNER_TEMP/gemini.log"; then
            exit "${gemini_status}"
          fi

          if [ "${attempt}" -eq "${max_api_attempts}" ]; then
            exit "${gemini_status}"
          fi

          retry_delay="$(grep -Eo 'Please retry in [0-9]+(\.[0-9]+)?s' "$RUNNER_TEMP/gemini.log" | tail -n 1 | awk '{print $4}' | sed 's/s$//' || true)"
          if [ -z "${retry_delay}" ]; then
            retry_delay="$((2 ** (attempt - 1)))"
          fi
          jitter_ms=$((RANDOM % 1000))
          sleep_seconds="$(awk -v base="${retry_delay}" -v jitter_ms="${jitter_ms}" 'BEGIN { printf "%.3f", base + (jitter_ms / 1000) }')"
          echo "Gemini API quota/rate-limited (attempt ${attempt}/${max_api_attempts}). Retrying in ${sleep_seconds}s..."
          sleep "${sleep_seconds}"
          attempt=$((attempt + 1))
        done
