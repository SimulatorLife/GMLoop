name: '▶️ Gemini Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && (github.event.comment.body == '@gemini' || startsWith(github.event.comment.body || '', '@gemini ')) }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: gemini
      agent_package: ${{ vars.GEMINI_CLI_PACKAGE || '@google/gemini-cli@latest' }}
      max_agent_retries: ${{ fromJSON(vars.LOCAL_AGENT_MAX_RETRIES || '2') }}
      validate_local_endpoint: false
      agent_setup_command: |
        set -euo pipefail

        if [ -z "${API_KEY:-}" ]; then
          echo "❌ Missing GEMINI_API_KEY secret (mapped to API_KEY)."
          exit 1
        fi

        if ! command -v gemini >/dev/null 2>&1; then
          echo "❌ Gemini CLI is not available after install step."
          exit 1
        fi

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${API_KEY}"

        configured_model=""
        if [ -f .gemini/settings.json ] && command -v jq >/dev/null 2>&1; then
          configured_model="$({
            jq -er '.model.name | select(type == "string" and length > 0)' .gemini/settings.json
          } 2>/dev/null || true)"
        fi

        if [ -n "${configured_model}" ]; then
          echo "Using configured Gemini model from .gemini/settings.json: ${configured_model}"
        else
          echo "No explicit .gemini/settings.json model.name found; Gemini CLI default routing/model selection will be used."
        fi
      agent_command: |
        set -euo pipefail

        if [ -z "${ADDITIONAL_CONTEXT:-}" ]; then
          echo "❌ Missing prompt context from PR comment."
          exit 1
        fi

        if ! command -v gemini >/dev/null 2>&1; then
          echo "❌ Gemini CLI is not installed."
          exit 1
        fi

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${API_KEY}"

        GEMINI_TASK_PROMPT="$(cat <<'PROMPT'
        You are Gemini CLI running in GitHub Actions as an autonomous coding agent.
        Inspect the repository and make the requested code changes.
        Start with the first validation or inspection command requested by the user, then base file selection only on command output or repository files you actually read.
        If the task asks for lint fixes, run `pnpm run lint` first, choose one deterministic ESLint issue from the real output, edit the actual source file that produced it, then re-run `pnpm run lint`, `pnpm run build:ts`, and `pnpm run lint:quiet`.
        Do not speculate about likely files, helper names, or rule failures before command output identifies them.
        Do not finish with only analysis or a plan. Leave a concrete repository diff in the worktree unless a real command or file-access blocker prevents edits.
        Do not edit golden .gml fixtures, generated files, dist files, workflow files, or configuration files unless the user explicitly asks for those files.
        For non-documentation code changes, run `pnpm run build:ts` and `pnpm run lint:quiet` after edits unless a real blocker prevents validation.
        PROMPT
        )"
        export GEMINI_TASK_PROMPT

        REPOSITORY_ROOT="$(pwd)"
        GEMINI_AGENT_PROMPT="$(printf 'Repository root: %s\n\n%s\n\nUser task from PR comment:\n%s\n' "${REPOSITORY_ROOT}" "${GEMINI_TASK_PROMPT}" "${ADDITIONAL_CONTEXT}")"
        export GEMINI_AGENT_PROMPT

        set +e
        stdbuf -oL -eL gemini \
          --approval-mode yolo \
          --skip-trust \
          --prompt "${GEMINI_AGENT_PROMPT}" 2>&1 | tee "$RUNNER_TEMP/gemini.log"
        gemini_status="${PIPESTATUS[0]}"
        set -e

        if [ "${gemini_status}" -ne 0 ]; then
          exit "${gemini_status}"
        fi
