name: '▶️ Gemini Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@gemini') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: gemini
      agent_package: '@google/gemini-cli@latest'
      validate_local_endpoint: false
      agent_setup_command: |
        set -euo pipefail

        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi

        if ! command -v rg >/dev/null 2>&1; then
          echo "❌ ripgrep is unavailable after install attempt."
          exit 1
        fi

        gemini_package_root="$(pnpm root -g)/@google/gemini-cli"
        if [ ! -d "${gemini_package_root}" ]; then
          echo "❌ Could not locate globally installed @google/gemini-cli package."
          exit 1
        fi

        ripgrep_binary_name="$(
          node --input-type=module -e 'import os from "node:os"; const platform = os.platform(); const arch = os.arch(); process.stdout.write(`rg-${platform}-${arch}${platform === "win32" ? ".exe" : ""}`);'
        )"
        gemini_vendor_directory="${gemini_package_root}/bundle/vendor/ripgrep"
        mkdir -p "${gemini_vendor_directory}"
        ln -sf "$(command -v rg)" "${gemini_vendor_directory}/${ripgrep_binary_name}"
      agent_command: |
        set -euo pipefail

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${API_KEY}"

        set +e
        stdbuf -oL -eL gemini \
          --approval-mode=yolo \
          --policy=.gemini/policy \
          --skip-trust \
          --prompt "" < "${AGENT_PROMPT_FILE}" 2>&1 | tee "$RUNNER_TEMP/gemini.log"
        gemini_status="${PIPESTATUS[0]}"
        set -e

        if [ "${gemini_status}" -ne 0 ]; then
          exit "${gemini_status}"
        fi
