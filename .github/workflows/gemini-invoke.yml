name: '▶️ Gemini Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@gemini') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: gemini
      agent_package: '@google/gemini-cli@latest'
      validate_local_endpoint: false
      agent_command: |
        set -euo pipefail

        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi

        if ! command -v rg >/dev/null 2>&1; then
          echo "❌ ripgrep is unavailable after install attempt."
          exit 1
        fi

        rg_path="$(command -v rg)"
        rg_dir="$(dirname "${rg_path}")"

        echo "rg path: ${rg_path}"
        rg --version

        # Persist rg's directory for later GitHub Actions steps.
        echo "${rg_dir}" >> "$GITHUB_PATH"

        # Some Gemini CLI builds look here for rg, so mirror it explicitly.
        mkdir -p "$HOME/.gemini/tmp/bin"
        ln -sf "${rg_path}" "$HOME/.gemini/tmp/bin/rg"

        # Persist Gemini's tmp bin for later steps too.
        echo "$HOME/.gemini/tmp/bin" >> "$GITHUB_PATH"

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${API_KEY}"
        export NODE_OPTIONS="--max-old-space-size=4096"

        echo "PATH=${PATH}"
        echo "rg path: $(command -v rg || true)"

        rg --version || {
          echo "❌ rg is unavailable in agent_command."
          exit 1
        }

        set +e
        stdbuf -oL -eL gemini \
          --approval-mode=yolo \
          --policy=.gemini/policy \
          --skip-trust \
          --output-format stream-json \
          --debug \
          --prompt "" < "${AGENT_PROMPT_FILE}" 2>&1 | tee "$RUNNER_TEMP/gemini-stream.jsonl"
        gemini_status="${PIPESTATUS[0]}"
        set -e

        if [ "${gemini_status}" -ne 0 ]; then
          exit "${gemini_status}"
        fi
