name: "▶️ Claude Invoke"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: "${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}"
  cancel-in-progress: false

defaults:
  run:
    shell: "bash"

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@claude') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: claude
      openai_base_url: 'https://api.anthropic.com'
      agent_command: |
        set -euo pipefail

        export CLAUDE_CODE_OAUTH_TOKEN="${OPENAI_API_KEY}"
        export DISABLE_AUTOUPDATER=1
        export DISABLE_TELEMETRY=1
        export NODE_OPTIONS="--max-old-space-size=4096"

        set +e
        stdbuf -oL -eL pnpm --silent dlx @anthropic-ai/claude-code@latest \
          -p \
          --model claude-sonnet-5 \
          --dangerously-skip-permissions \
          --strict-mcp-config \
          --output-format=stream-json \
          --verbose < "${AGENT_PROMPT_FILE}" 2>&1 | tee "$RUNNER_TEMP/agent-stream.jsonl"
        agent_status="${PIPESTATUS[0]}"
        set -e

        if [ "${agent_status}" -ne 0 ]; then
          exit "${agent_status}"
        fi
