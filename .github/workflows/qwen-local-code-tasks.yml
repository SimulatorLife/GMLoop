name: '▶️ Qwen Local Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body || '', '@qwen-local') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: qwen-local
      agent_cli: qwen
      agent_package: '@qwen-code/qwen-code@latest'
      agent_command: |
        set -euo pipefail

        if [ -z "${ADDITIONAL_CONTEXT:-}" ]; then
          echo "❌ Missing prompt context from PR comment."
          exit 1
        fi

        export QWEN_LOCAL_MODEL="${{ vars.QWEN_LOCAL_MODEL || 'qwen2.5-coder:1.5b' }}"
        export QWEN_MAX_SESSION_TURNS="${{ vars.QWEN_MAX_SESSION_TURNS || '40' }}"
        export OPENAI_API_KEY="ollama"
        export OPENAI_BASE_URL="http://127.0.0.1:11434/v1"
        QWEN_CI_SYSTEM_PROMPT="$(cat <<'PROMPT'
        You are running in GitHub Actions as an autonomous coding agent.
        Use real Qwen Code tool calls for shell commands and file edits.
        Do not print JSON objects that describe intended tool calls.
        The token startNewTask is not a tool.
        Leave any code changes in the worktree; the workflow will commit and push them.
        PROMPT
        )"
        export QWEN_CI_SYSTEM_PROMPT

        QWEN_LOCAL_TASK_PROMPT="$(cat <<'PROMPT'
        Find and fix exactly one ESLint warning.
        First, make a shell tool call to run `pnpm run lint`.
        Read the lint output and choose one deterministic, locally fixable warning in one file.
        Edit only the file needed for that warning.
        Do not edit golden `.gml` fixtures, generated files, dist files, workflow files, or configuration files.
        After editing, make shell tool calls to run `pnpm run lint:quiet` and `pnpm run build:ts`.
        Do not output a JSON plan, a fake function call, or `startNewTask`.
        PROMPT
        )"
        export QWEN_LOCAL_TASK_PROMPT

        if ! command -v ollama >/dev/null 2>&1; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi

        if ! curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
          ollama serve > ollama.log 2>&1 &
        fi

        for attempt in {1..30}; do
          if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
            break
          fi

          if [ "${attempt}" -eq 30 ]; then
            echo "❌ Ollama did not start in time"
            cat ollama.log || true
            exit 1
          fi

          sleep 1
        done

        ollama pull "${QWEN_LOCAL_MODEL}"
        curl -fsS "${OPENAI_BASE_URL}/models"

        # qwen-local temporarily avoids inheriting the full scheduled/comment prompt while
        # local model tool-calling is stabilized.
        # printf '%s\n' "${ADDITIONAL_CONTEXT}" | qwen \
        printf '%s\n' "${QWEN_LOCAL_TASK_PROMPT}" | qwen \
          --yolo \
          --channel CI \
          --max-session-turns "${QWEN_MAX_SESSION_TURNS}" \
          --append-system-prompt "${QWEN_CI_SYSTEM_PROMPT}" \
          --auth-type openai \
          --openai-api-key "${OPENAI_API_KEY}" \
          --openai-base-url="${OPENAI_BASE_URL}" \
          --model="${QWEN_LOCAL_MODEL}"
