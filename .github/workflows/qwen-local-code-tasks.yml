name: '▶️ Qwen Local Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body || '', '@qwen-local') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: qwen-local
      agent_cli: qwen
      agent_package: '@qwen-code/qwen-code@latest'
      agent_command: |
        set -euo pipefail

        if [ -z "${ADDITIONAL_CONTEXT:-}" ]; then
          echo "❌ Missing prompt context from PR comment."
          exit 1
        fi

        export QWEN_LOCAL_MODEL="${{ vars.QWEN_LOCAL_MODEL || 'qwen2.5-coder:1.5b' }}"
        export QWEN_MAX_SESSION_TURNS="${{ vars.QWEN_MAX_SESSION_TURNS || '40' }}"
        export OPENAI_API_KEY="ollama"
        export OPENAI_BASE_URL="http://127.0.0.1:11434/v1"
        QWEN_CI_SYSTEM_PROMPT="$(cat <<'PROMPT'
        You are running in GitHub Actions as an autonomous coding agent.
        Use the available repository, shell, and file-editing tools to inspect the codebase.
        Make the requested changes, run validation commands, and leave the worktree changed when the task requires code changes.
        Do not respond with a plan-only answer, standalone JSON, or instructions for another process.
        Keep using tools until the task is complete or a real blocker prevents progress.
        PROMPT
        )"
        export QWEN_CI_SYSTEM_PROMPT

        if ! command -v ollama >/dev/null 2>&1; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi

        if ! curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
          ollama serve > ollama.log 2>&1 &
        fi

        for attempt in {1..30}; do
          if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
            break
          fi

          if [ "${attempt}" -eq 30 ]; then
            echo "❌ Ollama did not start in time"
            cat ollama.log || true
            exit 1
          fi

          sleep 1
        done

        ollama pull "${QWEN_LOCAL_MODEL}"
        curl -fsS "${OPENAI_BASE_URL}/models"

        printf '%s\n' "${ADDITIONAL_CONTEXT}" | qwen \
          --yolo \
          --channel CI \
          --max-session-turns "${QWEN_MAX_SESSION_TURNS}" \
          --append-system-prompt "${QWEN_CI_SYSTEM_PROMPT}" \
          --auth-type openai \
          --openai-api-key "${OPENAI_API_KEY}" \
          --openai-base-url="${OPENAI_BASE_URL}" \
          --model="${QWEN_LOCAL_MODEL}"
