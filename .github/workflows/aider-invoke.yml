name: '▶️ Aider Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@aider') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: aider
      agent_package: aider-chat
      agent_setup_command: |
        set -euo pipefail

        pull_aider_configured_model() {
          local configured_model
          local ollama_model

          if ! command -v ollama >/dev/null 2>&1; then
            echo "❌ Ollama CLI is not available after local endpoint validation."
            return 1
          fi

          configured_model="$(
            awk '
              /^[[:space:]]*model[[:space:]]*:/ {
                value = substr($0, index($0, ":") + 1)
                sub(/#.*/, "", value)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                gsub(/^["\047]|["\047]$/, "", value)
                print value
                exit
              }
            ' .aider.conf.yml
          )"

          if [ -z "${configured_model}" ]; then
            echo "❌ Could not resolve model from .aider.conf.yml."
            return 1
          fi

          ollama_model="${configured_model#openai/}"
          echo "Pulling local Aider model '${ollama_model}' from Ollama..."
          ollama pull "${ollama_model}"
        }

        pull_aider_configured_model
      agent_command: |
        set -euo pipefail

        export NO_PROXY="${NO_PROXY:+${NO_PROXY},}127.0.0.1,localhost"
        export no_proxy="${no_proxy:+${no_proxy},}127.0.0.1,localhost"

        if [ -z "${AGENT_PROMPT:-}" ]; then
          echo "❌ Missing shared AGENT_PROMPT from parent workflow."
          exit 1
        fi

        set +e
        stdbuf -oL -eL aider \
          --yes-always \
          --no-browser \
          --subtree-only \
          --no-auto-commits \
          --no-dirty-commits \
          --message "${AGENT_PROMPT}" 2>&1 | tee "$RUNNER_TEMP/aider.log"
        aider_status="${PIPESTATUS[0]}"
        set -e

        if [ "${aider_status}" -ne 0 ]; then
          exit "${aider_status}"
        fi
