name: "Agent 107 - UI Workspace Advancement"

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Optional agent override."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    uses: ./.github/workflows/_agent-hot-feature-base.yml
    secrets: inherit
    with:
      agent: ${{ inputs.agent }}
      component: "UI workspace (src/ui)"
      extra_context: >
        Improve @gmloop/ui (src/ui) with one small, cohesive change that makes the app more useful, accessible, maintainable, or performant. First review src/ui/README.md, .agents/skills/ui/SKILL.md, and the existing UI architecture. Preserve the contract: Lit + TypeScript, light-DOM components, local bundle assets, UI-only ownership, and no duplicated domain/CLI/server/filesystem logic. Treat core UI principles such as accessibility, responsive layout, and the Gestalt principle of proximity as first-class constraints. Prefer practical incremental work that fills a missing UI feature or closes an obvious gap, such as graph exploration improvements, docs/config/rules browsing, a way to trigger formatting/linting/refactor codemods/fixes through host-provided actions, live-reload status/logs in the UI, better loading/empty/error states, keyboard/focus accessibility, responsive layout, or targeted rendering performance. Keep changes scoped to src/ui unless a minimal tested contract update is required. Avoid broad abstractions, design systems, unrelated config, generated artifacts, or cleanup churn. Add focused tests under src/ui/test, and ensure all controls are accessible, keyboard-friendly, mobile-safe, and grouped with clear visual proximity.
