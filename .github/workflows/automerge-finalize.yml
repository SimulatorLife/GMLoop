name: "Finalize auto-merge"
run-name: "Finalize auto-merge validation run ${{ inputs.validation_run_id }}"

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: "Completed Auto-merge PRs workflow run to finalize."
        required: true
        type: string

permissions: {}

concurrency:
  group: automerge-finalize-${{ inputs.validation_run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Trusted validation finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      green: ${{ steps.publish.outputs.green }}
      reason: ${{ steps.publish.outputs.reason }}
      trusted: ${{ steps.resolve.outputs.trusted }}
      current: ${{ steps.resolve.outputs.current }}
      retry: ${{ steps.resolve.outputs.retry }}
      max_retries: ${{ steps.resolve.outputs.max_retries }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Download validation target
        id: target_download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validation-target
          path: target
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        name: Resolve validation run, current PR, and trust boundary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { owner, repo } = context.repo;
            const runId = Number(process.env.VALIDATION_RUN_ID || 0);
            core.setOutput('validation_conclusion', '');
            core.setOutput('validation_url', '');
            core.setOutput('pr_number', '');
            core.setOutput('head_sha', '');
            core.setOutput('base_sha', '');
            core.setOutput('merge_sha', '');
            core.setOutput('retry', '0');
            core.setOutput('blocked_reason', 'infrastructure');
            core.setOutput('max_retries', '1');
            core.setOutput('current', 'false');
            core.setOutput('trusted', 'false');
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('Finalization requires a positive validation workflow run ID.');
              return;
            }

            const { data: validationRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (validationRun.path !== '.github/workflows/automerge-prs.yml'
                || validationRun.event !== 'workflow_dispatch'
                || validationRun.status !== 'completed') {
              core.setFailed(`Run ${runId} is not a completed trusted Auto-merge PRs workflow_dispatch run.`);
              return;
            }
            core.setOutput('validation_conclusion', String(validationRun.conclusion || ''));
            core.setOutput('validation_url', String(validationRun.html_url || ''));

            let target = null;
            try { target = JSON.parse(fs.readFileSync('target/validation-target.json', 'utf8')); } catch {}
            if (!target) {
              const match = String(validationRun.display_title || '').match(/PR #(\d+) @ ([0-9a-f]{40})/u);
              if (match) {
                target = {
                  prNumber: Number(match[1]),
                  headSha: match[2],
                  baseSha: '',
                  mergeSha: '',
                  retry: 0,
                  blockedReason: 'infrastructure',
                };
              }
            }
            const number = Number(target?.prNumber || 0);
            const head = String(target?.headSha || '');
            const base = String(target?.baseSha || '');
            const merge = String(target?.mergeSha || '');
            const retry = Number(target?.retry || 0);
            core.setOutput('pr_number', Number.isInteger(number) ? String(number) : '');
            core.setOutput('head_sha', head);
            core.setOutput('base_sha', base);
            core.setOutput('merge_sha', merge);
            core.setOutput('retry', Number.isInteger(retry) ? String(retry) : '0');
            core.setOutput('blocked_reason', String(target?.blockedReason || ''));
            if (!Number.isInteger(number) || number <= 0 || !/^[0-9a-f]{40}$/u.test(head)) return;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== head) return;

            const stateModule = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'src/cli/src/commands/ci-automerge-state.ts',
            )).href);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const latest = stateModule.findLatestBotAutoMergeState(comments);
            if (!stateModule.validationRunNeedsFinalization(latest, runId, head)) {
              core.notice(`Validation run ${runId} for PR #${number} is already finalized or superseded.`);
              return;
            }

            const runCreatedAt = new Date(validationRun.created_at || 0).getTime();
            const recentRuns = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'automerge-prs.yml', per_page: 50,
            });
            const superseded = recentRuns.data.workflow_runs.some((run) =>
              run.id !== runId
              && String(run.display_title || '').includes(`PR #${number} @ ${head}`)
              && new Date(run.created_at || 0).getTime() > runCreatedAt);
            if (superseded) {
              core.notice(`Ignoring superseded validation run ${runId} for PR #${number} @ ${head}.`);
              return;
            }
            core.setOutput('current', 'true');

            const policy = JSON.parse(fs.readFileSync('.github/ci/automerge-policy.json', 'utf8'));
            const maxRetries = Number(policy.maxInfrastructureRetries ?? 1);
            if (!Number.isInteger(maxRetries) || maxRetries < 0 || maxRetries > 10) {
              core.setFailed('Invalid maxInfrastructureRetries in trusted auto-merge policy.');
              return;
            }
            core.setOutput('max_retries', String(maxRetries));
            const trustedPatterns = (policy.trustedCiPatterns || []).map((value) => new RegExp(value, 'u'));
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const matches = (filename) =>
              typeof filename === 'string' && trustedPatterns.some((pattern) => pattern.test(filename));
            const trustedChange = files.some((file) => matches(file.filename) || matches(file.previous_filename));
            core.setOutput('trusted', trustedChange ? 'false' : 'true');
            core.notice(`Finalizer resolved validation run ${runId} for PR #${number} at ${head}; trusted=${!trustedChange}, base=${base || 'missing'}.`);
      - name: Revalidate stale trusted product PR without mutating its branch
        id: freshness
        if: ${{ steps.resolve.outputs.current == 'true' && steps.resolve.outputs.trusted == 'true' && steps.resolve.outputs.base_sha != '' && steps.resolve.outputs.blocked_reason == '' }}
        uses: ./.github/actions/reconcile-automerge
        with:
          pr-number: ${{ steps.resolve.outputs.pr_number }}
          validated-head: ${{ steps.resolve.outputs.head_sha }}
          validated-base: ${{ steps.resolve.outputs.base_sha }}
          allow-merge: "false"
          source: "trusted-finalizer-preflight"
      - name: Compute trusted runtime fingerprint
        id: fingerprint
        if: ${{ steps.resolve.outputs.current == 'true' && steps.resolve.outputs.trusted == 'true' && steps.freshness.outputs.status == 'current' }}
        run: node src/cli/src/commands/ci-automerge-evidence.ts fingerprint --github-output "$GITHUB_OUTPUT"
      - name: Download exact base evidence
        id: base_download
        if: ${{ steps.resolve.outputs.current == 'true' && steps.resolve.outputs.trusted == 'true' && steps.freshness.outputs.status == 'current' && steps.resolve.outputs.blocked_reason == '' && steps.resolve.outputs.validation_conclusion == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: report-base
          path: report-base
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact synthetic-merge evidence
        id: merge_download
        if: ${{ steps.resolve.outputs.current == 'true' && steps.resolve.outputs.trusted == 'true' && steps.freshness.outputs.status == 'current' && steps.resolve.outputs.blocked_reason == '' && steps.resolve.outputs.validation_conclusion == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: report-merge
          path: report-merge
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download optional complete ancestor evidence
        id: ancestor_download
        continue-on-error: true
        if: ${{ steps.resolve.outputs.current == 'true' && steps.resolve.outputs.trusted == 'true' && steps.freshness.outputs.status == 'current' && steps.resolve.outputs.blocked_reason == '' && steps.resolve.outputs.validation_conclusion == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: report-ancestor
          path: report-ancestor
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: provenance
        name: Verify exact evidence provenance
        if: ${{ steps.merge_download.outcome == 'success' && steps.base_download.outcome == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD: ${{ steps.resolve.outputs.head_sha }}
          EXPECTED_BASE: ${{ steps.resolve.outputs.base_sha }}
          EXPECTED_MERGE: ${{ steps.resolve.outputs.merge_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const readSha = (dir) => {
              for (const file of ['auto-merge-report.json', 'build-evidence.json']) {
                try {
                  const value = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
                  if (/^[0-9a-f]{40}$/u.test(String(value.targetSha || ''))) return value.targetSha;
                } catch {}
              }
              return '';
            };
            const base = readSha('report-base');
            const merge = readSha('report-merge');
            const expectedBase = process.env.EXPECTED_BASE;
            const expectedHead = process.env.EXPECTED_HEAD;
            const expectedMerge = process.env.EXPECTED_MERGE;
            if (base !== expectedBase || merge !== expectedMerge) {
              core.warning(`Evidence target mismatch: base=${base}, merge=${merge}.`);
              return;
            }
            const { data: mergeCommit } = await github.rest.repos.getCommit({ owner, repo, ref: merge });
            if (mergeCommit.parents?.[0]?.sha !== expectedBase || mergeCommit.parents?.[1]?.sha !== expectedHead) {
              core.warning('Synthetic merge parents do not match the exact trusted base/head pair.');
              return;
            }
            let ancestorValid = false;
            const ancestor = readSha('report-ancestor');
            if (ancestor) {
              try {
                const comparison = await github.rest.repos.compareCommits({ owner, repo, base: ancestor, head: expectedBase });
                ancestorValid = comparison.data.merge_base_commit?.sha === ancestor;
                if (!ancestorValid) core.warning(`Restored complete baseline cache ${ancestor} is not an ancestor of ${expectedBase}; ignoring it.`);
              } catch (error) {
                core.warning(`Could not verify complete ancestor ${ancestor}: ${error.message}`);
              }
            }
            core.setOutput('ancestor_valid', ancestorValid ? 'true' : 'false');
            core.setOutput('ancestor_sha', ancestorValid ? ancestor : '');
            core.setOutput('valid', 'true');
      - id: evidence
        name: Validate trusted evidence with default-branch code
        if: ${{ steps.provenance.outputs.valid == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
          ANCESTOR_SHA: ${{ steps.provenance.outputs.ancestor_sha }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          set +e
          node src/cli/src/commands/ci-automerge-evidence.ts validate \
            --report-dir report-base --expected-sha "$BASE_SHA" --expected-fingerprint "$FINGERPRINT"
          base_status=$?
          node src/cli/src/commands/ci-automerge-evidence.ts validate \
            --report-dir report-merge --expected-sha "$MERGE_SHA" --expected-fingerprint "$FINGERPRINT"
          merge_status=$?
          ancestor_status=0
          if [ -n "$ANCESTOR_SHA" ]; then
            node src/cli/src/commands/ci-automerge-evidence.ts validate \
              --report-dir report-ancestor --expected-sha "$ANCESTOR_SHA" --expected-fingerprint "$FINGERPRINT"
            ancestor_status=$?
          fi
          set -e
          if [ "$base_status" -eq 0 ] && [ "$merge_status" -eq 0 ] && [ "$ancestor_status" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - id: evaluate
        name: Evaluate regression-only quality gate
        if: ${{ steps.evidence.outputs.valid == 'true' }}
        shell: bash
        run: |
          ancestor_args=()
          if [ '${{ steps.provenance.outputs.ancestor_valid }}' = true ]; then
            ancestor_args=(--ancestor report-ancestor)
          fi
          node src/cli/src/commands/ci-automerge-gate.ts evaluate \
            --base report-base \
            --merge report-merge \
            "${ancestor_args[@]}" \
            --output evaluation.json \
            --summary evaluation.md \
            --github-output "$GITHUB_OUTPUT"
      - id: publish
        name: Publish durable trusted state
        if: ${{ always() && steps.resolve.outputs.current == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          RETRY: ${{ steps.resolve.outputs.retry }}
          MAX_RETRIES: ${{ steps.resolve.outputs.max_retries }}
          TRUSTED: ${{ steps.resolve.outputs.trusted }}
          BLOCKED: ${{ steps.resolve.outputs.blocked_reason }}
          FRESHNESS: ${{ steps.freshness.outputs.status }}
          WORKFLOW_CONCLUSION: ${{ steps.resolve.outputs.validation_conclusion }}
          EVAL_GREEN: ${{ steps.evaluate.outputs.green }}
          EVAL_REASON: ${{ steps.evaluate.outputs.reason }}
          RUN_ID: ${{ inputs.validation_run_id }}
          TARGET_URL: ${{ steps.resolve.outputs.validation_url }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const trusted = process.env.TRUSTED === 'true';
            const blocked = process.env.BLOCKED || '';
            const freshness = process.env.FRESHNESS || '';
            const workflowConclusion = process.env.WORKFLOW_CONCLUSION || '';
            let green = trusted && process.env.EVAL_GREEN === 'true';
            let reason = process.env.EVAL_REASON || 'infrastructure';
            let summary = '';
            try { summary = fs.readFileSync('evaluation.md', 'utf8').trim(); } catch {}

            if (!trusted) {
              green = false;
              reason = 'trusted-ci-change';
              summary = '### Trusted auto-merge evaluation\n\n⚠️ This PR changes the trusted CI/evaluation boundary. Automated merge is intentionally disabled; human review and merge are required.';
            } else if (blocked === 'policy-block') {
              green = false;
              reason = 'policy-block';
              summary = '### Trusted auto-merge evaluation\n\n❌ Repository policy blocks unattended merge for this change.';
            } else if (blocked === 'conflict') {
              green = false;
              reason = 'conflict';
              summary = '### Trusted auto-merge evaluation\n\n❌ This PR has a real merge conflict with current `main`. Resolve the conflict; the admission queue will validate the new head.';
            } else if (blocked === 'infrastructure' || workflowConclusion !== 'success') {
              green = false;
              reason = 'infrastructure';
              summary = `### Trusted auto-merge evaluation\n\n⚠️ Validation infrastructure did not complete reliably (${blocked || workflowConclusion}).`;
            } else if (freshness === 'revalidation-requested') {
              green = false;
              reason = 'stale';
              summary = '### Trusted auto-merge evaluation\n\n🔄 `main` advanced after this evidence was produced. Fresh validation was explicitly dispatched without modifying the PR branch.';
            } else if (!summary) {
              green = false;
              reason = 'infrastructure';
              summary = '### Trusted auto-merge evaluation\n\n⚠️ Expected trusted evaluation output was unavailable.';
            }

            const stateModule = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'src/cli/src/commands/ci-automerge-state.ts',
            )).href);
            const state = {
              pr: number,
              head: process.env.HEAD_SHA,
              base: process.env.BASE_SHA || '0'.repeat(40),
              green,
              trusted,
              reason,
              retry: Number(process.env.RETRY || 0),
              runId: Number(process.env.RUN_ID || 0),
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = stateModule.findBotAutoMergeSummaryComment(comments);
            const body = stateModule.renderAutoMergeStateComment(state, summary);
            if (existing?.id) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });

            let status = 'failure';
            let description = `Auto-merge blocked: ${reason}`;
            if (green) {
              status = 'success';
              description = reason === 'recovery' ? 'Recovery validation passed' : 'Trusted validation passed';
            } else if (reason === 'trusted-ci-change') {
              status = 'success';
              description = 'Trusted CI change: human merge required';
            } else if (reason === 'infrastructure' || reason === 'baseline-unavailable') {
              const retry = Number(process.env.RETRY || 0);
              const maxRetries = Number(process.env.MAX_RETRIES || 0);
              if (Number.isInteger(retry) && Number.isInteger(maxRetries) && retry < maxRetries) {
                status = 'pending';
                description = 'Trusted validation retry pending';
              } else {
                status = 'failure';
                description = 'Trusted validation infrastructure retry exhausted';
              }
            } else if (reason === 'stale') {
              status = 'pending';
              description = 'Fresh validation requested';
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: process.env.HEAD_SHA, state: status,
              context: 'automerge/trusted-validation',
              description: description.slice(0, 140),
              target_url: process.env.TARGET_URL || undefined,
            });
            core.setOutput('green', green ? 'true' : 'false');
            core.setOutput('reason', reason);
      - name: Detect Agent token availability
        id: agent_token
        if: ${{ steps.publish.outputs.reason == 'quality-regression' || steps.publish.outputs.reason == 'build-failure' }}
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
        run: |
          if [ -n "$GH_USER_TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Ask Agent to repair actual new regressions
        if: ${{ steps.agent_token.outputs.available == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          REASON: ${{ steps.publish.outputs.reason }}
        with:
          github-token: ${{ env.GH_USER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const marker = '<!-- automerge-pr-regression-agent -->';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const body = `${marker}\n@mini-max Trusted auto-merge found an actual **${process.env.REASON}** introduced by this PR. `
              + `Fix only the newly introduced regression(s) on branch **${pr.head.ref}**, preserving unrelated baseline debt.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });

  merge:
    name: Trusted auto-merge
    needs: analyze
    outputs:
      merged: ${{ steps.reconcile.outputs.merged }}
      merged_sha: ${{ steps.reconcile.outputs.merged_sha }}
    if: ${{ needs.analyze.outputs.current == 'true' && needs.analyze.outputs.trusted == 'true' && needs.analyze.outputs.green == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - id: reconcile
        uses: ./.github/actions/reconcile-automerge
        with:
          pr-number: ${{ needs.analyze.outputs.pr_number }}
          validated-head: ${{ needs.analyze.outputs.head_sha }}
          validated-base: ${{ needs.analyze.outputs.base_sha }}
          allow-merge: "true"
          source: "trusted-finalizer"

  promote:
    name: Promote merged evidence to trusted base cache
    needs: [analyze, merge]
    if: ${{ needs.merge.outputs.merged == 'true' && needs.merge.outputs.merged_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.merge.outputs.merged_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: fingerprint
        name: Recompute trusted contract fingerprint
        run: node src/cli/src/commands/ci-automerge-evidence.ts fingerprint --github-output "$GITHUB_OUTPUT"
      - id: provenance
        name: Verify squash tree matches validated synthetic merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VALIDATED_BASE: ${{ needs.analyze.outputs.base_sha }}
          VALIDATED_MERGE: ${{ needs.analyze.outputs.merge_sha }}
          MERGED_MAIN: ${{ needs.merge.outputs.merged_sha }}
          EXPECTED_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
          ACTUAL_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (process.env.EXPECTED_FINGERPRINT !== process.env.ACTUAL_FINGERPRINT) {
              core.setFailed('Trusted validation fingerprint changed across an ostensibly product-only merge.');
              return;
            }
            const [validated, landed] = await Promise.all([
              github.rest.repos.getCommit({ owner, repo, ref: process.env.VALIDATED_MERGE }),
              github.rest.repos.getCommit({ owner, repo, ref: process.env.MERGED_MAIN }),
            ]);
            if (landed.data.parents?.[0]?.sha !== process.env.VALIDATED_BASE) {
              core.setFailed('Merged main commit does not directly descend from the validated base.');
              return;
            }
            if (validated.data.commit?.tree?.sha !== landed.data.commit?.tree?.sha) {
              core.setFailed('Squash-merged tree differs from the exact synthetic-merge tree; evidence cannot be promoted.');
              return;
            }
            core.setOutput('valid', 'true');
      - name: Download exact synthetic-merge evidence
        if: ${{ steps.provenance.outputs.valid == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: report-merge
          path: report-merge
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retarget validated evidence to the identical landed tree
        if: ${{ steps.provenance.outputs.valid == 'true' }}
        run: |
          node src/cli/src/commands/ci-automerge-evidence.ts promote \
            --source-dir report-merge \
