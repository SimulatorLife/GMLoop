name: "scheduler"

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  plan-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load workflow configuration
        id: cfg
        run: |
          if [ ! -f .github/workflows/weights.json ]; then
            echo "Configuration file .github/workflows/weights.json is missing" >&2
            exit 1
          fi
          echo "cfg=$(jq -c . .github/workflows/weights.json)" >> "$GITHUB_OUTPUT"

      - name: Compute dispatch plan
        id: plan
        uses: actions/github-script@v8
        env:
          CFG_JSON: ${{ steps.cfg.outputs.cfg }}
        with:
          script: |
            const cfgRaw = process.env.CFG_JSON;
            const cfg = cfgRaw ? JSON.parse(cfgRaw) : {};
            const workflows = Array.isArray(cfg.workflows) ? cfg.workflows : [];
            const WEIGHT_SCALE = 1000;

            const getRunNumber = () => {
              const raw = (process.env.GITHUB_RUN_NUMBER || '').trim();
              const parsed = Number.parseInt(raw, 10);
              return Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
            };

            const toSlots = (weight) => Math.max(1, Math.round(weight * WEIGHT_SCALE));

            const buildInterleavedCycle = (items) => {
              const maxSlots = Math.max(...items.map((item) => item.slots));
              const cycle = [];
              for (let slot = 1; slot <= maxSlots; slot += 1) {
                for (const item of items) {
                  if (item.slots >= slot) {
                    cycle.push(item);
                  }
                }
              }
              return cycle;
            };

            const chooseDeterministicWeighted = (items, runNumber) => {
              if (items.length === 0) {
                return null;
              }

              const sortedItems = [...items].sort((left, right) => left.sortKey.localeCompare(right.sortKey));
              const cycle = buildInterleavedCycle(sortedItems);
              if (cycle.length === 0) {
                return null;
              }

              const cycleIndex = (runNumber - 1) % cycle.length;
              return {
                selected: cycle[cycleIndex],
                cycleIndex,
                cycleLength: cycle.length,
              };
            };

            const candidates = [];

            for (const workflow of workflows) {
              if (!workflow || typeof workflow.name !== 'string') {
                continue;
              }

              const workflowName = workflow.name;
              const workflowFileName = workflowName.endsWith('.yml') ? workflowName : `${workflowName}.yml`;
              const workflowPath = workflowFileName.startsWith('.github/workflows/')
                ? workflowFileName
                : `.github/workflows/${workflowFileName}`;

              const weightValue = Number(workflow.weight);
              if (!Number.isFinite(weightValue) || weightValue <= 0) {
                core.warning(`Skipping workflow ${workflowPath} due to invalid weight.`);
                continue;
              }
              candidates.push({
                name: workflowName,
                path: workflowPath,
                weight: weightValue,
                topic: workflow.topic ?? null,
                slots: toSlots(weightValue),
                sortKey: workflowName.toLowerCase(),
              });
            }

            if (candidates.length === 0) {
              core.info('No eligible workflows in configuration.');
              return null;
            }

            const totalWeight = candidates.reduce((sum, item) => sum + item.weight, 0);
            if (!Number.isFinite(totalWeight) || totalWeight <= 0) {
              core.info('Aggregate weight of eligible workflows is zero; nothing to schedule.');
              return null;
            }

            const runNumber = getRunNumber();
            const selection = chooseDeterministicWeighted(candidates, runNumber);
            if (!selection) {
              core.info('No deterministic weighted workflow could be selected.');
              return null;
            }
            const selected = selection.selected;
            const cyclePosition = selection.cycleIndex + 1;

            const baseDir = '.github/workflows/';
            const workflowId = selected.path.startsWith(baseDir)
              ? selected.path.slice(baseDir.length)
              : selected.path;

            core.info(
              `Deterministic weighted selection picked workflow ${selected.path} (weight=${selected.weight}, slots=${selected.slots}) ` +
              `for run #${runNumber} at cycle position ${cyclePosition}/${selection.cycleLength} from total weight ${totalWeight.toFixed(6)}.`
            );

            return {
              workflow_name: selected.name,
              workflow_path: selected.path,
              workflow_id: workflowId,
              run_number: String(runNumber),
              cycle_position: `${cyclePosition}/${selection.cycleLength}`,
              total_weight: totalWeight.toFixed(6),
            };

      - name: Dispatch workflow
        if: ${{ steps.plan.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PLAN_RESULT: ${{ steps.plan.outputs.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.PLAN_RESULT || '';
            const plan = raw ? JSON.parse(raw) : null;

            const workflowId = plan?.workflow_id;
            const workflowPath = plan?.workflow_path || workflowId;

            if (!workflowId) {
              core.info('No workflow selected for dispatch.');
              return;
            }

            let ref = context.ref;
            if (!ref) {
              const { data } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              ref = data?.default_branch;
            }

            if (!ref) {
              throw new Error('Unable to determine reference for workflow dispatch.');
            }

            if (ref.startsWith('refs/heads/')) {
              ref = ref.replace('refs/heads/', '');
            } else if (ref.startsWith('refs/tags/')) {
              ref = ref.replace('refs/tags/', '');
            }

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref,
              });
              core.info(`Dispatched ${workflowPath} via workflow_dispatch on ref ${ref}`);
            } catch (error) {
              core.warning(`Failed to dispatch ${workflowPath}: ${error.message}`);
            }
