name: '▶️ MiniMax Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body || '', '@mini-max') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      openai_base_url: 'https://api.minimax.io'
      agent: mini-max
      agent_package: '@openai/codex'
      agent_command: |
        set -euo pipefail

        set +e
        stdbuf -oL -eL codex exec \
          --ask-for-approval=never \
          --model=MiniMax-M2.7 \
          --profile=simple \
          --config model_provider='"minimax"' \
          --json \
          - < "${AGENT_PROMPT_FILE}" \
          2>&1 | tee "$RUNNER_TEMP/agent-stream.jsonl"
        agent_status="${PIPESTATUS[0]}"
        set -e

        if [ "${agent_status}" -ne 0 ]; then
          exit "${agent_status}"
        fi
