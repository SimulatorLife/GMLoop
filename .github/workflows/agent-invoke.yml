name: '▶️ Agent Invoke (parent)'

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      target_sha:
        type: string
        required: false
      working_branch:
        type: string
        required: false
      additional_context:
        type: string
        required: false
      agent:
        type: string
        required: true
      agent_cli:
        type: string
        required: false
      agent_command:
        type: string
        required: false
      agent_package:
        type: string
        required: false
      local_ollama_model:
        type: string
        required: false
      local_ollama_base_url:
        type: string
        required: false
    secrets:
      api_key: # may contain one key OR multiple newline-separated keys
        required: false
      GH_USER_TOKEN:
        required: true

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.pr_number }}'
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify gh CLI available
        run: gh --version

      - name: Validate GH_USER_TOKEN has repository push permission
        shell: bash
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          test -n "${GH_USER_TOKEN}" || { echo "GH_USER_TOKEN is empty"; exit 1; }

          token_user=$(curl -sS -H "Authorization: token ${GH_USER_TOKEN}" https://api.github.com/user | jq -r '.login // empty')
          if [ -z "${token_user}" ]; then
            echo "Unable to resolve GH_USER_TOKEN user identity via /user." >&2
            exit 1
          fi

          can_push=$(curl -sS -H "Authorization: token ${GH_USER_TOKEN}" "https://api.github.com/repos/${REPOSITORY}" | jq -r '.permissions.push // false')
          if [ "${can_push}" != "true" ]; then
            echo "GH_USER_TOKEN user '${token_user}' does not have push permission to ${REPOSITORY}." >&2
            echo "Grant that account write access or replace GH_USER_TOKEN with a PAT/app token that has contents:write." >&2
            exit 1
          fi

          echo "GH_USER_TOKEN validated for push access as '${token_user}'."

      - name: Validate comment & fetch PR info
        id: validate_pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          RAW_COMMENT: ${{ inputs.additional_context || '' }}
          AGENT_NAME: ${{ inputs.agent }}
        run: |
          set -euo pipefail

          # If a raw comment body was provided, validate it mentions the agent and extract
          # the additional context. We expect callers to pass the raw comment body; the
          # mention token is simply @<agent> (e.g. @gemini, @qwen).
          if [ -n "${RAW_COMMENT}" ]; then
            mention="@${AGENT_NAME}"
            if ! printf '%s' "${RAW_COMMENT}" | grep -qF "${mention}"; then
              echo "Comment does not mention ${mention}; aborting." >&2
              exit 1
            fi
            ADDITIONAL_CTX=$(printf '%s' "${RAW_COMMENT}" | sed -E "s/^.*${mention}[[:space:]]*//")
            echo "additional_context<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s' "$ADDITIONAL_CTX" >> "$GITHUB_OUTPUT"
            echo >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          # Fetch PR metadata directly and emit outputs (avoid temporary files)
          PR_JSON=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json headRefName,headRefOid,title -q '.')
          PR_HEAD_REF=$(jq -r '.headRefName // empty' <<<"$PR_JSON")
          PR_HEAD_SHA=$(jq -r '.headRefOid // empty' <<<"$PR_JSON")
          PR_TITLE=$(jq -r '.title // empty' <<<"$PR_JSON")
          if [ -z "$PR_HEAD_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
            echo "Failed to determine PR head ref/sha for PR #${PR_NUMBER}" >&2
            exit 1
          fi
          echo "pr_title<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "head_ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: ${{ inputs.agent }}
          REPOSITORY: ${{ github.repository }}
          MESSAGE: |-
            **[🤖 ${{ inputs.agent }}]** Hi, I've received your request and will begin working on it now. See the [logs for progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use the SHA fetched by the validate_pr step (prefer step output to inputs)
          ref: ${{ steps.validate_pr.outputs.head_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Create local branch & verify
        shell: bash
        env:
          WORKING_BRANCH: ${{ steps.validate_pr.outputs.head_ref }}
          TARGET_SHA: ${{ steps.validate_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          raw="${WORKING_BRANCH}"
          branch="${raw#refs/heads/}"
          branch="${branch#origin/}"
          git checkout -B "${branch}" "${TARGET_SHA}"
          echo "WORKING_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Configure git identity
        env:
          GH_USER_NAME: ${{ vars.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ vars.GH_USER_EMAIL }}
        run: |
          set -euo pipefail
          git config user.name "${GH_USER_NAME}"
          git config user.email "${GH_USER_EMAIL}"
          git config --global user.name "${GH_USER_NAME}"
          git config --global user.email "${GH_USER_EMAIL}"

      - name: Add PATH shims (return 99 after successful git push)
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/cmd_shims"
          mkdir -p "$shim_dir"
          real_git="$(command -v git)"
          if [ -z "$real_git" ]; then echo "Could not locate real git"; exit 1; fi
          {
            echo '#!/usr/bin/env bash'
            echo "REAL_GIT=\"$real_git\""
            echo 'SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_push_succeeded"'
            echo '"$REAL_GIT" "$@"'
            echo 'code=$?'
            echo 'if [ $code -eq 0 ] && [ "$1" = "push" ]; then'
            echo '  date +"%F %T" > "$SENTINEL"'
            echo '  exit 99'
            echo 'fi'
            echo 'exit $code'
          } > "$shim_dir/git"
          chmod +x "$shim_dir/git"
          echo "PATH=$shim_dir:$PATH" >> "$GITHUB_ENV"

      - name: Use PAT for pushes
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_USER_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Read Node version from .nvmrc
        id: read-node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Read pnpm version from package.json
        id: read-pnpm-version
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager.split('@')[1]")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.read-pnpm-version.outputs.version }}
          run_install: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.read-node-version.outputs.version }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Setup local Ollama endpoint
        if: ${{ inputs.local_ollama_model != '' }}
        shell: bash
        env:
          LOCAL_OLLAMA_MODEL: ${{ inputs.local_ollama_model }}
          LOCAL_OLLAMA_BASE_URL: ${{ inputs.local_ollama_base_url || 'http://127.0.0.1:11434/v1' }}
        run: |
          set -euo pipefail

          if [ -n "${NO_PROXY:-}" ]; then
            NO_PROXY="${NO_PROXY},127.0.0.1,localhost"
          else
            NO_PROXY='127.0.0.1,localhost'
          fi

          if [ -n "${no_proxy:-}" ]; then
            no_proxy="${no_proxy},127.0.0.1,localhost"
          else
            no_proxy='127.0.0.1,localhost'
          fi

          echo "OPENAI_API_KEY=ollama" >> "$GITHUB_ENV"
          echo "OPENAI_BASE_URL=${LOCAL_OLLAMA_BASE_URL}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${NO_PROXY}" >> "$GITHUB_ENV"
          echo "no_proxy=${no_proxy}" >> "$GITHUB_ENV"

          curl_ollama() {
            curl --noproxy '*' -fsS "$@"
          }

          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi

          if ! curl_ollama http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
            ollama serve > ollama.log 2>&1 &
          fi

          for attempt in {1..60}; do
            if curl_ollama http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              break
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "❌ Ollama did not start in time"
              cat ollama.log || true
              exit 1
            fi

            sleep 1
          done

          ollama pull "${LOCAL_OLLAMA_MODEL}"

          if ! curl_ollama http://127.0.0.1:11434/api/tags \
            | jq -e --arg model "${LOCAL_OLLAMA_MODEL}" 'any(.models[]?; .name == $model)' >/dev/null; then
            echo "❌ Ollama did not report the pulled model '${LOCAL_OLLAMA_MODEL}' in /api/tags."
            exit 1
          fi

          for attempt in {1..30}; do
            if curl_ollama "${LOCAL_OLLAMA_BASE_URL}/models" >/dev/null 2>&1; then
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "❌ Ollama OpenAI-compatible endpoint did not become ready."
              cat ollama.log || true
              exit 1
            fi

            sleep 2
          done

          if ! jq -n --arg model "${LOCAL_OLLAMA_MODEL}" '{model: $model, messages: [{role: "user", content: "Reply with ok."}], max_tokens: 8, stream: false}' \
            | curl_ollama --max-time 300 -X POST "${LOCAL_OLLAMA_BASE_URL}/chat/completions" \
              -H "Authorization: Bearer ollama" \
              -H "Content-Type: application/json" \
              -d @- >/dev/null; then
            echo "❌ Ollama OpenAI-compatible chat completion failed for '${LOCAL_OLLAMA_MODEL}'."
            cat ollama.log || true
            exit 1
          fi

      - name: Install dependencies and build (root/workspaces)
        run: |
          set -o pipefail

          run_typescript_build_best_effort() {
            if ! pnpm run build:ts; then
              echo "::warning::TypeScript workspace build failed; continuing agent workflow setup."
            fi
          }

          install_log="$(mktemp)"
          if pnpm install --frozen-lockfile 2>&1 | tee "$install_log"; then
            run_typescript_build_best_effort
            exit 0
          fi

          if grep -q "ERR_PNPM_OUTDATED_LOCKFILE" "$install_log"; then
            echo "::warning::pnpm-lock.yaml is out of date. Retrying install with --no-frozen-lockfile."
            pnpm install --no-frozen-lockfile
            run_typescript_build_best_effort
            exit 0
          fi

          echo "::error::Dependency install failed for a reason other than outdated lockfile."
          exit 1

      - name: Install agent CLI (from child)
        if: ${{ inputs.agent_package != '' }}
        env:
          AGENT_CLI: ${{ inputs.agent_cli || inputs.agent }}
          AGENT_PACKAGE: ${{ inputs.agent_package }}
        run: |
          echo "Checking for CLI: ${AGENT_CLI} (from pnpm package: ${AGENT_PACKAGE})"
          if ! command -v "${AGENT_CLI}" >/dev/null 2>&1; then
            echo "Not found, installing ${AGENT_PACKAGE} via pnpm..."
            pnpm add -g "${AGENT_PACKAGE}"
            echo "Installed ${AGENT_PACKAGE}. CLI location: $(command -v "${AGENT_CLI}")"
          else
            echo "${AGENT_CLI} CLI already installed at: $(command -v "${AGENT_CLI}")"
          fi

      - name: Run agent custom command
        if: ${{ inputs.agent_command != '' }}
        shell: bash
        id: run_agent
        continue-on-error: true
        timeout-minutes: 59
        env:
          TITLE: ${{ steps.validate_pr.outputs.pr_title }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ADDITIONAL_CONTEXT: ${{ steps.validate_pr.outputs.additional_context || '' }}
          API_KEY: ${{ secrets.api_key }}
        run: |
          set -euo pipefail
          echo "Running agent command"

          script="$RUNNER_TEMP/agent_cmd.sh"
          # Write the command exactly as-is (no interpolation)
          cat >"$script" <<'SCRIPT'
          ${{ inputs.agent_command }}
          SCRIPT

          # Normalize CRLF if someone pasted Windows newlines (harmless otherwise)
          sed -i 's/\r$//' "$script"

          chmod 700 "$script"

          # Optional: show the script in debug logs
          echo "---- agent_cmd.sh ----"
          nl -ba "$script"
          echo "----------------------"

          set -x
          bash "$script"

      - name: Auto-commit and push agent changes if needed
        if: ${{ steps.run_agent.outcome == 'success' }}
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: ${{ inputs.agent }}
          WORKING_BRANCH: ${{ env.WORKING_BRANCH }}
        run: |
          set -euo pipefail

          SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_push_succeeded"

          # If the shim already saw a successful git push, don't do anything.
          if [ -f "$SENTINEL" ]; then
            echo "[agent] Push sentinel already present; skipping auto-commit/push."
            exit 0
          fi

          git fetch origin "${WORKING_BRANCH}" || true

          has_worktree_changes=false
          if ! git diff --quiet || ! git diff --cached --quiet; then
            has_worktree_changes=true
          fi

          if [ "${has_worktree_changes}" = true ]; then
            echo "[agent] Changes detected; committing before push."
            git status
            git add -A

            commit_message="chore: apply @${AGENT_NAME} changes for PR #${PR_NUMBER}"
            if git commit -m "$commit_message"; then
              echo "[agent] Created commit: ${commit_message}"
            else
              echo "[agent] git commit failed; aborting auto-push."
              exit 1
            fi
          fi

          remote_ref="origin/${WORKING_BRANCH}"
          has_remote_ref=false
          if git show-ref --verify --quiet "refs/remotes/${remote_ref}"; then
            has_remote_ref=true
          fi

          should_push=false
          if [ "${has_remote_ref}" = false ]; then
            should_push=true
            echo "[agent] Remote ref ${remote_ref} not found; will push branch."
          elif ! git merge-base --is-ancestor "${remote_ref}" HEAD; then
            should_push=true
            echo "[agent] Local branch diverged from ${remote_ref}; will push current HEAD."
          elif [ "${has_worktree_changes}" = true ]; then
            should_push=true
            echo "[agent] New commit created; will push."
          fi

          if [ "${should_push}" = false ]; then
            echo "[agent] No local commits ahead of ${remote_ref}; nothing to push."
            exit 0
          fi

          echo "[agent] Pushing branch ${WORKING_BRANCH}..."

          # Because of the git shim, a successful push returns 99, not 0.
          if git push origin "${WORKING_BRANCH}"; then
            echo "[agent] git push completed with exit 0 (no shim?)."
          else
            code=$?
            if [ "$code" -eq 99 ]; then
              echo "[agent] git push succeeded via shim (exit 99)."
            else
              echo "[agent] git push failed with code $code"
              exit $code
            fi
          fi

      - name: Report outcome
        if: always()
        env:
          RUN_AGENT_OUTCOME: ${{ steps.run_agent.outcome || '' }}
          RUN_AGENT_CONCLUSION: ${{ steps.run_agent.conclusion || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          MESSAGE: |-
            **[🤖 ${{ inputs.agent }}]** I'm sorry, but I was unable to complete the requested action. See [the logs for details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        run: |
          set -euo pipefail
          SENTINEL="${RUNNER_TEMP}/.agent_push_succeeded"
          if [ -f "$SENTINEL" ]; then
            echo "Push detected → SUCCESS."
            exit 0
          fi
          echo "No push sentinel found → FAIL."
          gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}" || true
          exit 1
