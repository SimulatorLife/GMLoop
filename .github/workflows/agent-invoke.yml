name: '▶️ Agent Invoke (parent)'

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      target_sha:
        type: string
        required: false
      working_branch:
        type: string
        required: false
      additional_context:
        type: string
        required: false
      agent:
        type: string
        required: true
      agent_command:
        type: string
        required: false
      agent_setup_command:
        type: string
        required: false
      agent_package:
        type: string
        required: false
      validate_local_endpoint:
        type: boolean
        required: false
        default: true
      max_agent_retries:
        type: number
        required: false
        default: 2
    secrets:
      api_key:
        required: false
      GH_USER_TOKEN:
        required: true

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.pr_number }}'
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_TYPE: openai
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify gh CLI available
        run: gh --version

      - name: Validate GH_USER_TOKEN has repository push permission
        shell: bash
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          test -n "${GH_USER_TOKEN}" || { echo "GH_USER_TOKEN is empty"; exit 1; }

          token_user=$(curl -sS -H "Authorization: token ${GH_USER_TOKEN}" https://api.github.com/user | jq -r '.login // empty')
          if [ -z "${token_user}" ]; then
            echo "Unable to resolve GH_USER_TOKEN user identity via /user." >&2
            exit 1
          fi

          can_push=$(curl -sS -H "Authorization: token ${GH_USER_TOKEN}" "https://api.github.com/repos/${REPOSITORY}" | jq -r '.permissions.push // false')
          if [ "${can_push}" != "true" ]; then
            echo "GH_USER_TOKEN user '${token_user}' does not have push permission to ${REPOSITORY}." >&2
            echo "Grant that account write access or replace GH_USER_TOKEN with a PAT/app token that has contents:write." >&2
            exit 1
          fi

          echo "GH_USER_TOKEN validated for push access as '${token_user}'."

      - name: Validate comment & fetch PR info
        id: validate_pr
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          RAW_COMMENT: ${{ inputs.additional_context || '' }}
          AGENT_NAME: ${{ inputs.agent }}
        run: |
          set -euo pipefail

          # If a raw comment body was provided, validate it mentions the agent and extract
          # the additional context. We expect callers to pass the raw comment body; the
          # mention token is simply @<agent> (e.g. @gemini, @qwen).
          if [ -n "${RAW_COMMENT}" ]; then
            mention="@${AGENT_NAME}"
            if ! printf '%s' "${RAW_COMMENT}" | grep -qF "${mention}"; then
              echo "Comment does not mention ${mention}; aborting." >&2
              exit 1
            fi
            ADDITIONAL_CTX=$(printf '%s' "${RAW_COMMENT}" | sed -E "s/^.*${mention}[[:space:]]*//")
            echo "additional_context<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s' "$ADDITIONAL_CTX" >> "$GITHUB_OUTPUT"
            echo >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          # Fetch PR metadata directly and emit outputs (avoid temporary files)
          PR_JSON=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json headRefName,headRefOid,title -q '.')
          PR_HEAD_REF=$(jq -r '.headRefName // empty' <<<"$PR_JSON")
          PR_HEAD_SHA=$(jq -r '.headRefOid // empty' <<<"$PR_JSON")
          PR_TITLE=$(jq -r '.title // empty' <<<"$PR_JSON")
          if [ -z "$PR_HEAD_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
            echo "Failed to determine PR head ref/sha for PR #${PR_NUMBER}" >&2
            exit 1
          fi
          echo "pr_title<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s' "$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "head_ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.pr_number }}
          AGENT_NAME: ${{ inputs.agent }}
          REPOSITORY: ${{ github.repository }}
          MESSAGE: |-
            **[🤖 ${{ inputs.agent }}]** Hi, I've received your request and will begin working on it now. See the [logs for progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use the SHA fetched by the validate_pr step (prefer step output to inputs)
          ref: ${{ steps.validate_pr.outputs.head_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Create local branch & verify
        shell: bash
        env:
          WORKING_BRANCH: ${{ steps.validate_pr.outputs.head_ref }}
          TARGET_SHA: ${{ steps.validate_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          raw="${WORKING_BRANCH}"
          branch="${raw#refs/heads/}"
          branch="${branch#origin/}"
          git checkout -B "${branch}" "${TARGET_SHA}"
          echo "WORKING_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Configure git identity
        env:
          GH_USER_NAME: ${{ vars.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ vars.GH_USER_EMAIL }}
        run: |
          set -euo pipefail
          git config user.name "${GH_USER_NAME}"
          git config user.email "${GH_USER_EMAIL}"
          git config --global user.name "${GH_USER_NAME}"
          git config --global user.email "${GH_USER_EMAIL}"

      - name: Add PATH shims (return 99 after successful git push)
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/cmd_shims"
          mkdir -p "$shim_dir"
          real_git="$(command -v git)"
          if [ -z "$real_git" ]; then echo "Could not locate real git"; exit 1; fi
          {
            echo '#!/usr/bin/env bash'
            echo "REAL_GIT=\"$real_git\""
            echo 'SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_push_succeeded"'
            echo '"$REAL_GIT" "$@"'
            echo 'code=$?'
            echo 'if [ $code -eq 0 ] && [ "$1" = "push" ]; then'
            echo '  date +"%F %T" > "$SENTINEL"'
            echo '  exit 99'
            echo 'fi'
            echo 'exit $code'
          } > "$shim_dir/git"
          chmod +x "$shim_dir/git"
          echo "PATH=$shim_dir:$PATH" >> "$GITHUB_ENV"

      - name: Use PAT for pushes
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_USER_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Read Node version from .nvmrc
        id: read-node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Read pnpm version from package.json
        id: read-pnpm-version
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager.split('@')[1]")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.read-pnpm-version.outputs.version }}
          run_install: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.read-node-version.outputs.version }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Start and validate local OpenAI-compatible endpoint
        if: ${{ inputs.validate_local_endpoint }}
        shell: bash
        run: |
          set -euo pipefail

          OLLAMA_NATIVE_URL='http://127.0.0.1:11434'
          OPENAI_BASE_URL="${OLLAMA_NATIVE_URL}/v1"
          OPENAI_API_KEY='ollama'

          if [ -n "${NO_PROXY:-}" ]; then
            NO_PROXY="${NO_PROXY},127.0.0.1,localhost"
          else
            NO_PROXY='127.0.0.1,localhost'
          fi

          if [ -n "${no_proxy:-}" ]; then
            no_proxy="${no_proxy},127.0.0.1,localhost"
          else
            no_proxy='127.0.0.1,localhost'
          fi

          echo "OPENAI_BASE_URL=${OPENAI_BASE_URL}" >> "$GITHUB_ENV"
          echo "OPENAI_API_KEY=${OPENAI_API_KEY}" >> "$GITHUB_ENV"
          echo "NO_PROXY=${NO_PROXY}" >> "$GITHUB_ENV"
          echo "no_proxy=${no_proxy}" >> "$GITHUB_ENV"

          curl_local() {
            curl --noproxy '*' -fsS "$@"
          }

          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi

          if ! curl_local "${OLLAMA_NATIVE_URL}/api/version" >/dev/null 2>&1; then
            ollama serve > ollama.log 2>&1 &
          fi

          for attempt in {1..60}; do
            if curl_local "${OLLAMA_NATIVE_URL}/api/version" >/dev/null 2>&1; then
              break
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "❌ Ollama native API did not become ready at ${OLLAMA_NATIVE_URL}."
              cat ollama.log || true
              exit 1
            fi

            sleep 1
          done

          models_response=''
          for attempt in {1..30}; do
            if models_response="$(curl_local "${OPENAI_BASE_URL%/}/models" 2>/dev/null)" \
              && jq -e 'type == "object"' >/dev/null <<<"${models_response}"; then
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "❌ OpenAI-compatible /models endpoint did not return a valid JSON object at ${OPENAI_BASE_URL}."
              if [ -n "${models_response}" ]; then
                printf 'Last /models response:\n%s\n' "${models_response}"
              fi
              cat ollama.log || true
              exit 1
            fi

            sleep 2
          done

      - name: Install dependencies and build (root/workspaces)
        run: |
          set -o pipefail

          run_typescript_build_best_effort() {
            if ! pnpm run build:ts; then
              echo "::warning::TypeScript workspace build failed; continuing agent workflow setup."
            fi
          }

          install_log="$(mktemp)"
          if pnpm install --frozen-lockfile 2>&1 | tee "$install_log"; then
            run_typescript_build_best_effort
            exit 0
          fi

          if grep -q "ERR_PNPM_OUTDATED_LOCKFILE" "$install_log"; then
            echo "::warning::pnpm-lock.yaml is out of date. Retrying install with --no-frozen-lockfile."
            pnpm install --no-frozen-lockfile
            run_typescript_build_best_effort
            exit 0
          fi

          echo "::error::Dependency install failed for a reason other than outdated lockfile."
          exit 1

      - name: Install agent CLI (from child)
        if: ${{ inputs.agent_package != '' }}
        env:
          AGENT_CLI: ${{ inputs.agent }}
          AGENT_PACKAGE: ${{ inputs.agent_package }}
        run: |
          echo "Checking for CLI: ${AGENT_CLI} (from pnpm package: ${AGENT_PACKAGE})"
          if ! command -v "${AGENT_CLI}" >/dev/null 2>&1; then
            echo "Not found, installing ${AGENT_PACKAGE} via pnpm..."
            pnpm add -g "${AGENT_PACKAGE}"
            echo "Installed ${AGENT_PACKAGE}. CLI location: $(command -v "${AGENT_CLI}")"
          else
            echo "${AGENT_CLI} CLI already installed at: $(command -v "${AGENT_CLI}")"
          fi

      - name: Run agent setup command
        if: ${{ inputs.agent_setup_command != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_KEY: ${{ secrets.api_key || '' }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          echo "Running one-time agent setup command"
          echo "[agent] Setup working directory: $(pwd)"
          echo "[agent] Setup git root: $(git rev-parse --show-toplevel)"

          setup_script="$RUNNER_TEMP/agent_setup_cmd.sh"
          # Write the command exactly as-is (no interpolation)
          cat >"$setup_script" <<'SCRIPT'
          ${{ inputs.agent_setup_command }}
          SCRIPT

          sed -i 's/\r$//' "$setup_script"
          chmod 700 "$setup_script"

          echo "---- agent_setup_cmd.sh ----"
          nl -ba "$setup_script"
          echo "----------------------------"

          stdbuf -oL -eL bash "$setup_script" 2>&1 | tee "$RUNNER_TEMP/agent-setup.log"

      - name: Run agent custom command with retries
        if: ${{ inputs.agent_command != '' }}
        shell: bash
        id: run_agent
        continue-on-error: true
        timeout-minutes: 59
        env:
          TITLE: ${{ steps.validate_pr.outputs.pr_title }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ADDITIONAL_CONTEXT: ${{ steps.validate_pr.outputs.additional_context || '' }}
          API_KEY: ${{ secrets.api_key || '' }}
          AGENT_NAME: ${{ inputs.agent }}
          MAX_AGENT_RETRIES: ${{ inputs.max_agent_retries }}
          WORKING_BRANCH: ${{ env.WORKING_BRANCH }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          echo "Running agent command with retry support"
          echo "[agent] Workflow working directory: $(pwd)"
          echo "[agent] Workflow git root: $(git rev-parse --show-toplevel)"
          echo "[agent] Workflow branch: $(git branch --show-current)"

          AGENT_TASK_PROMPT="$(cat <<'PROMPT'
          Make one focused, minimal code change set for the user request.
          Start from real command output and repository files you read; do not speculate.
          If lint is requested: run `pnpm run lint`, fix exactly one deterministic issue, then re-run `pnpm run lint`, `pnpm run build:ts`, and `pnpm run lint:quiet`.
          Do not finish with only analysis or a plan. Leave a concrete repository diff in the worktree.
          When executing user-requested tasks, do not edit golden .gml fixtures, generated files, dist files, workflow files, or configuration files unless explicitly requested.
          PROMPT
          )"
          export AGENT_TASK_PROMPT

          script="$RUNNER_TEMP/agent_cmd.sh"
          # Write the command exactly as-is (no interpolation)
          cat >"$script" <<'SCRIPT'
          ${{ inputs.agent_command }}
          SCRIPT

          # Normalize CRLF if someone pasted Windows newlines (harmless otherwise)
          sed -i 's/\r$//' "$script"

          chmod 700 "$script"

          # Optional: show the script in debug logs
          echo "---- agent_cmd.sh ----"
          nl -ba "$script"
          echo "----------------------"

          retry_prompt_file="$RUNNER_TEMP/agent_retry_prompt.txt"
          cat > "$retry_prompt_file" <<'RETRY_PROMPT'
          The previous attempt was invalid because it completed without producing any pushable repository changes.

          Requirements for this retry:
          - Work in the checked-out repository, not uploaded chat snippets.
          - Run the requested inspection or validation command before selecting files.
          - Do not claim there are no issues unless that claim is grounded in command output from this repository.
          - If this is a lint/ESLint task, run `pnpm run lint` before code selection, quote the exact lint summary line, choose one real warning from the output, edit only the reported source file needed for that warning, then re-run `pnpm run lint`, `pnpm run build:ts`, and `pnpm run lint:quiet`.
          - Leave a concrete diff in the worktree or push changes yourself.
          - If no concrete diff is produced, this retry will fail.
          RETRY_PROMPT

          if ! [[ "${MAX_AGENT_RETRIES}" =~ ^[0-9]+$ ]]; then
            echo "::error::max_agent_retries must be a non-negative integer; got '${MAX_AGENT_RETRIES}'."
            exit 1
          fi

          total_attempts=$((MAX_AGENT_RETRIES + 1))
          original_additional_context="${ADDITIONAL_CONTEXT:-}"

          SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_push_succeeded"
          NO_CHANGE_SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_no_change_retries_exhausted"
          RETRY_COMMENT_SENTINEL="${RUNNER_TEMP:-/tmp}/.agent_retry_comment_posted"
          rm -f "$NO_CHANGE_SENTINEL"
          rm -f "$RETRY_COMMENT_SENTINEL"

          redact_git_remote_credentials() {
            sed -E 's#(https://)[^/@]+@#\1***@#g'
          }

          is_stageable_untracked_path() {
            local candidate="$1"

            if [ -z "${candidate}" ]; then
              return 1
            fi

            if [[ "${candidate}" =~ [[:cntrl:]] ]]; then
              return 1
            fi

            if [[ "${candidate}" =~ [\<\>\{\}\`\$\|] ]]; then
              return 1
            fi

            case "${candidate}" in
              /*|../*|*/../*|*/..|..)
                return 1
                ;;
            esac

            return 0
          }

          cleanup_malformed_untracked_paths() {
            local removed_any=0

            while IFS= read -r path; do
              [ -n "${path}" ] || continue

              if is_stageable_untracked_path "${path}"; then
                continue
              fi

              echo "[agent] Removing malformed untracked path left by agent output: ${path}"
              rm -rf -- "${path}"
              removed_any=1
            done < <(git ls-files --others --exclude-standard)

            if [ "${removed_any}" -eq 1 ]; then
              echo "[agent] Removed malformed untracked paths before staging."
            fi
          }

          stage_pushable_changes() {
            git add -u

            while IFS= read -r path; do
              [ -n "${path}" ] || continue

              if is_stageable_untracked_path "${path}"; then
                git add -- "${path}"
              else
                echo "[agent] Skipping malformed untracked path during staging: ${path}"
              fi
            done < <(git ls-files --others --exclude-standard)
          }

          reset_branch_to_retry_baseline() {
            local target_ref="${WORKING_BRANCH}"

            cd "${GITHUB_WORKSPACE}"
            echo "[agent] Resetting retry worktree to origin/${target_ref}."

            git fetch origin "${target_ref}" || true

            if git rev-parse --verify --quiet "origin/${target_ref}" >/dev/null; then
              git reset --hard "origin/${target_ref}"
            else
              git reset --hard HEAD
            fi

            git submodule update --init --recursive
            cleanup_malformed_untracked_paths
          }

          build_attempt_context() {
            local attempt="$1"

            if [ "${attempt}" -eq 1 ]; then
              printf '%s' "${original_additional_context}"
            else
              printf '%s\n\n%s\n' "${original_additional_context}" "$(cat "$retry_prompt_file")"
            fi
          }

          run_agent_attempt() {
            local attempt="$1"
            local attempt_log="$RUNNER_TEMP/agent-live-attempt-${attempt}.log"

            cd "${GITHUB_WORKSPACE}"
            export ADDITIONAL_CONTEXT
            ADDITIONAL_CONTEXT="$(build_attempt_context "${attempt}")"

            echo "[agent] Starting agent attempt ${attempt}/${total_attempts}."
            echo "[agent] Attempt working directory before agent command: $(pwd)"
            echo "[agent] Attempt git root before agent command: $(git rev-parse --show-toplevel)"
            echo "[agent] Attempt git remotes before agent command:"
            git remote -v | redact_git_remote_credentials
            echo "[agent] Attempt git branch before agent command: $(git branch --show-current)"
            set -x
            set +e
            stdbuf -oL -eL bash "$script" 2>&1 | tee "${attempt_log}"
            agent_status="${PIPESTATUS[0]}"
            set -e
            set +x

            cp "${attempt_log}" "$RUNNER_TEMP/agent-live.log"
            return "${agent_status}"
          }

          push_current_branch_if_needed() {
            cd "${GITHUB_WORKSPACE}"
            echo "[agent] Checking repository changes in: $(pwd)"
            echo "[agent] Change-check git root: $(git rev-parse --show-toplevel)"

            # If the shim already saw a successful git push, don't do anything.
            if [ -f "$SENTINEL" ]; then
              echo "[agent] Push sentinel already present; attempt produced a branch push."
              return 0
            fi

            git fetch origin "${WORKING_BRANCH}" || true

            echo "[agent] Worktree after agent attempt:"
            worktree_status="$(git status --porcelain=v1 --untracked-files=normal)"
            if [ -n "${worktree_status}" ]; then
              printf '%s\n' "${worktree_status}"
            else
              echo "[agent] Worktree clean."
            fi

            if [ -n "${worktree_status}" ]; then
              echo "[agent] Changes detected; committing before push."
              echo "[agent] Worktree status before staging:"
              git status --short
              cleanup_malformed_untracked_paths
              stage_pushable_changes
              echo "[agent] Staged changes before commit:"
              git diff --cached --stat
              echo "[agent] Worktree status after staging:"
              git status --short

              if git diff --cached --quiet; then
                echo "[agent] Only malformed untracked files were present; nothing pushable remains."
                return 1
              fi

              commit_message="chore: apply @${AGENT_NAME} changes for PR #${PR_NUMBER}"
              if git commit -m "$commit_message"; then
                echo "[agent] Created commit: ${commit_message}"
              else
                echo "[agent] git commit failed; aborting auto-push."
                echo "[agent] Staged diff after failed commit:"
                git diff --cached --stat || true
                echo "[agent] Worktree status after failed commit:"
                git status --short || true
                return 2
              fi
            fi

            remote_ref="origin/${WORKING_BRANCH}"
            has_remote_ref=false
            if git show-ref --verify --quiet "refs/remotes/${remote_ref}"; then
              has_remote_ref=true
            fi

            local_head="$(git rev-parse HEAD)"
            remote_head=''
            if [ "${has_remote_ref}" = true ]; then
              remote_head="$(git rev-parse "${remote_ref}")"
            fi

            should_push=false
            if [ "${has_remote_ref}" = false ]; then
              should_push=true
              echo "[agent] Remote ref ${remote_ref} not found; will push branch."
            elif git merge-base --is-ancestor "${remote_ref}" HEAD; then
              if [ "${remote_head}" != "${local_head}" ]; then
                if ! git diff --quiet "${remote_ref}" HEAD; then
                  should_push=true
                  echo "[agent] Local branch has file changes ahead of ${remote_ref}; will push."
                else
                  echo "[agent] Local branch has commits ahead of ${remote_ref}, but the net file diff is empty."
                fi
              fi
            elif git merge-base --is-ancestor HEAD "${remote_ref}"; then
              echo "❌ Remote ref ${remote_ref} moved ahead of local HEAD; refusing to push stale changes."
              return 2
            else
              echo "❌ Local branch diverged from ${remote_ref}; refusing to push without reconciling remote commits."
              return 2
            fi

            if [ "${should_push}" = false ]; then
              echo "❌ Agent completed without producing pushable local changes."
              return 1
            fi

            echo "[agent] Pushing branch ${WORKING_BRANCH}..."

            # Because of the git shim, a successful push returns 99, not 0.
            if git push origin "${WORKING_BRANCH}"; then
              echo "[agent] git push completed with exit 0 (no shim?)."
            else
              code=$?
              if [ "$code" -eq 99 ]; then
                echo "[agent] git push succeeded via shim (exit 99)."
              else
                echo "[agent] git push failed with code $code"
                return 2
              fi
            fi

            return 0
          }

          post_retry_comment_once() {
            local failed_attempt="$1"
            local next_attempt="$2"

            if [ -f "$RETRY_COMMENT_SENTINEL" ]; then
              echo "[agent] Retry comment already posted; skipping duplicate PR comment."
              return 0
            fi

            retry_message="$(
              cat <<MESSAGE
          **[🤖 ${AGENT_NAME}]** The local agent did not produce pushable repository changes on attempt ${failed_attempt}/${total_attempts}, so I am starting retry attempt ${next_attempt}/${total_attempts} with stricter command-grounded instructions.
          MESSAGE
            )"

            if gh issue comment "${PR_NUMBER}" --body "${retry_message}" --repo "${REPOSITORY}"; then
              date +"%F %T" > "$RETRY_COMMENT_SENTINEL"
            else
              echo "::warning::Could not post local-agent retry comment."
            fi
          }

          for ((attempt = 1; attempt <= total_attempts; attempt++)); do
            set +e
            run_agent_attempt "${attempt}"
            agent_status="$?"
            set -e

            set +e
            push_current_branch_if_needed
            push_status="$?"
            set -e

            if [ "${push_status}" -eq 0 ]; then
              echo "[agent] Attempt ${attempt}/${total_attempts} produced pushable changes."
              exit 0
            fi

            if [ "${push_status}" -eq 2 ]; then
              echo "::error::Attempt ${attempt}/${total_attempts} hit a non-retryable push or branch state failure."
              exit 1
            fi

            if [ "${attempt}" -lt "${total_attempts}" ]; then
              post_retry_comment_once "${attempt}" "$((attempt + 1))"
              echo "[agent] Attempt ${attempt}/${total_attempts} produced no pushable changes; starting a fresh retry session."
              reset_branch_to_retry_baseline
            else
              echo "❌ Agent exhausted ${total_attempts} attempt(s) without producing pushable local changes."
              date +"%F %T" > "$NO_CHANGE_SENTINEL"
              if [ "${agent_status}" -ne 0 ]; then
                echo "Last agent command exit code: ${agent_status}"
              fi
              exit 1
            fi
          done

      - name: Report outcome
        id: report_outcome
        if: always()
        env:
          RUN_AGENT_OUTCOME: ${{ steps.run_agent.outcome || '' }}
          RUN_AGENT_CONCLUSION: ${{ steps.run_agent.conclusion || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          MESSAGE: |-
            **[🤖 ${{ inputs.agent }}]** I'm sorry, but I was unable to complete the requested action. See [the logs for details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
        run: |
          set -euo pipefail
          SENTINEL="${RUNNER_TEMP}/.agent_push_succeeded"
          NO_CHANGE_SENTINEL="${RUNNER_TEMP}/.agent_no_change_retries_exhausted"

          write_report_outputs() {
            {
              echo "agent_failed=$1"
              echo "cleanup_empty_pr=$2"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "${{ steps.run_agent.outcome }}" = "failure" ] || [ "${{ steps.run_agent.conclusion }}" = "failure" ]; then
            echo "Run agent step failed → FAIL."
            if gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"; then
              if [ -f "$NO_CHANGE_SENTINEL" ]; then
                write_report_outputs true true
              else
                write_report_outputs true false
              fi
            else
              echo "::warning::Could not post failure comment; skipping empty-agent cleanup."
              write_report_outputs true false
            fi
            exit 0
          fi

          if [ -f "$SENTINEL" ]; then
            echo "Push detected → SUCCESS."
            write_report_outputs false false
            exit 0
          fi

          echo "Agent command succeeded with no branch push → FAIL."
          if gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"; then
            if [ -f "$NO_CHANGE_SENTINEL" ]; then
              write_report_outputs true true
            else
              write_report_outputs true false
            fi
          else
            echo "::warning::Could not post failure comment; skipping empty-agent cleanup."
            write_report_outputs true false
          fi

      - name: Close empty failed agent PR
        if: always() && steps.report_outcome.outputs.cleanup_empty_pr == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_json="$(
            gh api "repos/${REPOSITORY}/pulls/${ISSUE_NUMBER}" \
              --jq '{
                changedFiles: .changed_files,
                headRefName: .head.ref,
                headRepository: .head.repo.full_name,
                baseRefName: .base.ref,
                state: .state
              }'
          )"

          changed_files="$(jq -r '.changedFiles // -1' <<<"${pr_json}")"
          head_ref="$(jq -r '.headRefName // ""' <<<"${pr_json}")"
          head_repo="$(jq -r '.headRepository // ""' <<<"${pr_json}")"
          base_ref="$(jq -r '.baseRefName // ""' <<<"${pr_json}")"
          pr_state="$(jq -r '.state // ""' <<<"${pr_json}")"

          if [ "${pr_state}" != "open" ]; then
            echo "[agent] PR state is '${pr_state}'; leaving PR and branch unchanged."
            exit 0
          fi

          if [ "${changed_files}" != "0" ]; then
            echo "[agent] PR has ${changed_files} changed file(s); leaving PR and branch open."
            exit 0
          fi

          case "${head_ref}" in
            codex/task-*|copilot/task-*|gemini/task-*|qwen/task-*|qwen-local/task-*|aider/task-*)
              ;;
            *)
              echo "[agent] Branch '${head_ref}' is not an expected empty agent branch; leaving PR and branch open."
              exit 0
              ;;
          esac

          case "${head_ref}" in
            ""|main|master|develop|development|trunk|production|release|feature/*|bugfix/*|hotfix/*)
              echo "[agent] Branch '${head_ref}' is protected or human-owned; leaving PR and branch open."
              exit 0
              ;;
          esac

          if [ "${head_ref}" = "${base_ref}" ]; then
            echo "[agent] Head branch matches base branch '${base_ref}'; leaving PR and branch open."
            exit 0
          fi

          if [ "${head_repo}" != "${REPOSITORY}" ]; then
            echo "[agent] Head repository '${head_repo}' is not '${REPOSITORY}'; leaving PR and branch open."
            exit 0
          fi

          echo "[agent] Closing empty agent PR #${ISSUE_NUMBER} and deleting branch '${head_ref}'."
          gh pr close "${ISSUE_NUMBER}" --repo "${REPOSITORY}"
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${head_ref}"

      - name: Fail workflow after unsuccessful agent run
        if: always() && steps.report_outcome.outputs.agent_failed == 'true'
        run: |
          echo "Agent workflow did not produce a successful branch push."
          exit 1
