name: '▶️ Qwen Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body || '', '@qwen') && !startsWith(github.event.comment.body || '', '@qwen-local') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: qwen
      agent_package: '@qwen-code/qwen-code@latest'
      agent_command: |
        set -euo pipefail
        # Resolve API key
        if [ -z "${API_KEY:-}" ]; then
          echo "❌ Missing API_KEY!"
          exit 1
        fi

        export OPENAI_API_KEY="${API_KEY}"

        # OpenRouter defaults. Override with repository variables
        # QWEN_OPENAI_BASE_URL and QWEN_OPENAI_MODEL when routing elsewhere.
        export OPENAI_BASE_URL="${{ vars.QWEN_OPENAI_BASE_URL || 'https://openrouter.ai/api/v1' }}"
        export OPENROUTER_API_KEY="${API_KEY}"
        export OPENAI_MODEL="${{ vars.QWEN_OPENAI_MODEL || 'qwen/qwen3-coder' }}"
        export QWEN_MAX_SESSION_TURNS="${{ vars.QWEN_MAX_SESSION_TURNS || '40' }}"
        QWEN_CI_SYSTEM_PROMPT="$(cat <<'PROMPT'
        You are running in GitHub Actions as an autonomous coding agent.
        Use the available repository, shell, and file-editing tools to inspect the codebase.
        Make the requested changes, run validation commands, and leave the worktree changed when the task requires code changes.
        Do not respond with a plan-only answer, standalone JSON, or instructions for another process.
        Keep using tools until the task is complete or a real blocker prevents progress.
        PROMPT
        )"
        export QWEN_CI_SYSTEM_PROMPT

        printf '%s\n' "${ADDITIONAL_CONTEXT}" | qwen \
          --yolo \
          --channel CI \
          --max-session-turns "${QWEN_MAX_SESSION_TURNS}" \
          --append-system-prompt "${QWEN_CI_SYSTEM_PROMPT}" \
          --auth-type openai \
          --openai-api-key "${OPENAI_API_KEY}" \
          --openai-base-url="${OPENAI_BASE_URL}" \
          --model="${OPENAI_MODEL}" \
          --output-format stream-json \
          --debug \
          --include-partial-messages 2>&1 | tee "$RUNNER_TEMP/qwen-stream.log"
