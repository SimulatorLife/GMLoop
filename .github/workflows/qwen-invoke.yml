name: '▶️ Qwen Invoke'

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body || '', '@qwen') }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      api_key: ${{ secrets.OPENROUTER_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ github.event.issue.number }}
      additional_context: ${{ github.event.comment.body }}
      agent: qwen
      agent_package: '@qwen-code/qwen-code@latest'
      agent_command: |
        set -euo pipefail
        # Resolve API key
        if [ -z "${API_KEY:-}" ]; then
          echo "❌ Missing API_KEY!"
          exit 1
        fi

        export OPENAI_API_KEY="${API_KEY}"

        # OpenRouter defaults. Override with repository variables
        # QWEN_OPENAI_BASE_URL and QWEN_OPENAI_MODEL when routing elsewhere.
        export OPENAI_BASE_URL="${{ vars.QWEN_OPENAI_BASE_URL || 'https://openrouter.ai/api/v1' }}"
        export OPENROUTER_API_KEY="${API_KEY}"
        export OPENAI_MODEL="${{ vars.QWEN_OPENAI_MODEL || 'qwen/qwen3-coder' }}"

        qwen --yolo --auth-type openai --openai-api-key "${OPENAI_API_KEY}" --openai-base-url="${OPENAI_BASE_URL}" --model="${OPENAI_MODEL}" --prompt "${ADDITIONAL_CONTEXT}"
