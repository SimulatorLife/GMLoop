name: "Reconcile trusted auto-merge"
description: "Retry a trusted merge or request fresh validation when main advances; never mutates the PR branch."

inputs:
  pr-number:
    description: "Pull request number."
    required: true
  validated-head:
    description: "Exact head SHA covered by trusted evidence."
    required: true
  validated-base:
    description: "Exact main SHA covered by trusted evidence."
    required: true
  allow-merge:
    description: "Whether to merge if refs remain current."
    required: false
    default: "true"
  source:
    description: "Caller label for diagnostics."
    required: false
    default: "trusted-finalizer"
outputs:
  status:
    description: "current, revalidation-requested, merged, pending-mergeability, conflict, merge-failed, or not-current."
    value: ${{ steps.reconcile.outputs.status }}
  merged:
    description: "Whether this invocation merged the PR."
    value: ${{ steps.reconcile.outputs.merged }}
  merged_sha:
    description: "New main commit SHA when a merge completed."
    value: ${{ steps.reconcile.outputs.merged_sha }}

runs:
  using: "composite"
  steps:
    - id: reconcile
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        VALIDATED_HEAD: ${{ inputs.validated-head }}
        VALIDATED_BASE: ${{ inputs.validated-base }}
        ALLOW_MERGE: ${{ inputs.allow-merge }}
        SOURCE: ${{ inputs.source }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const number = Number(process.env.PR_NUMBER);
          const head = String(process.env.VALIDATED_HEAD || '');
          const base = String(process.env.VALIDATED_BASE || '');
          const allowMerge = String(process.env.ALLOW_MERGE || '').toLowerCase() === 'true';
          const source = process.env.SOURCE || 'trusted-finalizer';
          const marker = '<!-- automerge-reconcile-state -->';
          const set = (status, merged = false, mergedSha = '') => {
            core.setOutput('status', status);
            core.setOutput('merged', merged ? 'true' : 'false');
            core.setOutput('merged_sha', mergedSha);
          };
          const publish = async (text) => {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            const body = `${marker}\n${text}`;
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
          };
          if (!Number.isInteger(number) || number <= 0
              || !/^[0-9a-f]{40}$/u.test(head) || !/^[0-9a-f]{40}$/u.test(base)) {
            core.setFailed('Reconciliation requires a valid PR number and exact head/base SHAs.');
            return;
          }
          const load = async () => {
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== head) return null;
            return pr;
          };
          const pr = await load();
          if (!pr) {
            set('not-current');
            return;
          }
          const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
          const liveBase = branch.commit.sha;
          if (liveBase !== base) {
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'automerge-prs.yml', per_page: 50,
            });
            const active = runs.data.workflow_runs.some((run) =>
              ['queued', 'in_progress'].includes(run.status)
              && String(run.display_title || '').includes(`PR #${number} @ ${head}`));
            if (!active) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'automerge-prs.yml',
                ref: 'main',
                inputs: {
                  pr_number: String(number),
                  expected_head: head,
                  retry: '0',
                  reason: `${source}-stale-base`,
                },
              });
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head,
                state: 'pending',
                context: 'automerge/trusted-validation',
                description: 'main advanced; fresh synthetic-merge validation requested',
              });
            }
            await publish(`🔄 **Fresh validation requested without mutating the PR branch.** `
              + `Trusted evidence covered main \`${base}\`, while live main is \`${liveBase}\`. `
              + `The validation worker will test the exact current synthetic merge.`);
            core.notice(`${source}: PR #${number} needs revalidation against ${liveBase}; branch was not modified.`);
            set('revalidation-requested');
            return;
          }
          if (!allowMerge) {
            set('current');
            return;
          }

          const delays = [0, 1000, 2000, 4000, 8000, 12000];
          let current = pr;
          let mergeable = false;
          let mergeState = '';
          for (const delay of delays) {
            if (delay) await new Promise((resolve) => setTimeout(resolve, delay));
            current = await load();
            if (!current) {
              set('not-current');
              return;
            }
            mergeState = String(current.mergeable_state || '').toLowerCase();
            if (mergeState === 'dirty') {
              await publish('⚠️ **Auto-merge is blocked by a real merge conflict.** Resolve the conflict; validation will be queued again after the head changes.');
              set('conflict');
              return;
            }
            if (current.mergeable === true && mergeState !== 'unknown') {
              mergeable = true;
              break;
            }
          }
          if (!mergeable) {
            await publish('⏳ **Trusted validation is green, but GitHub mergeability is still unresolved.** The periodic reconciler will retry without rerunning tests.');
            set('pending-mergeability');
            return;
          }

          const { data: lastBase } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
          if (lastBase.commit.sha !== base) {
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'automerge-prs.yml', ref: 'main',
              inputs: { pr_number: String(number), expected_head: head, retry: '0', reason: `${source}-premerge-race` },
            });
            set('revalidation-requested');
            return;
          }

          let response;
          try {
            response = await github.rest.pulls.merge({
              owner, repo, pull_number: number, merge_method: 'squash', sha: head,
            });
            if (!response.data.merged) {
              await publish(`⚠️ **GitHub declined a trusted green merge.** The reconciler will retry.\n\n${response.data.message || 'No reason supplied.'}`);
              set('merge-failed');
              return;
            }
          } catch (error) {
            await publish(`⚠️ **The merge API failed after trusted validation.** The reconciler will retry.\n\n${error.message}`);
            set('merge-failed');
            return;
          }

          core.notice(`${source}: merged PR #${number} at ${head}.`);
          set('merged', true, String(response.data.sha || ''));
          const headRef = current.head?.ref;
          const headRepo = current.head?.repo?.full_name?.toLowerCase() || '';
          if (headRef && headRepo === `${owner}/${repo}`.toLowerCase() && headRef !== 'main') {
            try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` }); }
            catch (error) { core.warning(`Merged PR #${number}, but branch deletion failed: ${error.message}`); }
          }
